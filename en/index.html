<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revision for the people — English Track</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
        }
        .hero {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            padding: 3rem 2rem;
            text-align: center;
            border-bottom: 3px solid #3b82f6;
        }
        .hero h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: white;
            margin-bottom: 0.5rem;
        }
        .hero p {
            color: #a0a0b0;
            font-size: 1rem;
        }
        .back-link {
            display: inline-block;
            color: #808090;
            font-size: 0.8rem;
            text-decoration: none;
            margin-bottom: 0.5rem;
        }
        .back-link:hover { color: #3b82f6; }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }
        .coming-soon {
            text-align: center;
            padding: 5rem 2rem;
        }
        .coming-soon .emoji { font-size: 4rem; margin-bottom: 1.5rem; }
        .coming-soon h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.8rem;
        }
        .coming-soon p {
            color: #808090;
            font-size: 0.95rem;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.6;
        }
        .footer {
            text-align: center;
            padding: 2rem;
            color: #505060;
            font-size: 0.8rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        /* PEDRO SPLASH */
        .pedro-splash {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0f0f1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            animation: fadeOutSplash 0.5s ease 3s forwards;
        }
        .pedro-img {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            object-fit: cover;
            animation: spinPedro 1.2s linear infinite;
            border: 4px solid #3b82f6;
            box-shadow: 0 0 50px rgba(59,130,246,0.4);
        }
        .pedro-text {
            margin-top: 2rem;
            font-size: 2.5rem;
            font-weight: 800;
            color: white;
            animation: pulseText 0.6s ease-in-out infinite alternate;
        }
        .pedro-sub {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #808090;
        }
        @keyframes spinPedro {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulseText {
            0% { transform: scale(1); color: white; }
            100% { transform: scale(1.08); color: #3b82f6; }
        }
        @keyframes fadeOutSplash {
            0% { opacity: 1; pointer-events: all; }
            100% { opacity: 0; pointer-events: none; }
        }
    </style>
</head>
<body>

<div class="hero">
    <a href="../index.html" class="back-link">&larr; Back to home</a>
    <h1>Revision for the people</h1>
    <p>English Track — made by felix le goat</p>
</div>

<div class="container">
    <div class="coming-soon">
        <div class="emoji">🇬🇧</div>
        <h2>Courses coming soon</h2>
        <p>The English track is being prepared. Summaries, revision sheets and quizzes will appear here as soon as the courses are added. Stay tuned!</p>
    </div>
</div>

<div class="footer">
    English Track — Coming soon
</div>

<script data-goatcounter="https://chaborz.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
