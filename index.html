<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revision pour le peuple</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .landing {
            text-align: center;
            padding: 2rem;
        }
        .landing h1 {
            font-size: 2.5rem;
            font-weight: 800;
            color: white;
            margin-bottom: 0.3rem;
        }
        .landing .sub {
            color: #808090;
            font-size: 1rem;
            margin-bottom: 3rem;
        }
        .tracks {
            display: flex;
            gap: 2rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .track {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 2.5rem 3rem;
            text-decoration: none;
            transition: all 0.3s;
            min-width: 240px;
        }
        .track:hover {
            background: rgba(255,255,255,0.07);
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-4px);
        }
        .track .flag {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }
        .track .track-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
            margin-bottom: 0.3rem;
        }
        .track .track-desc {
            font-size: 0.85rem;
            color: #808090;
        }
        .track-franco { border-color: rgba(233,69,96,0.3); }
        .track-franco:hover { border-color: #e94560; box-shadow: 0 8px 30px rgba(233,69,96,0.15); }
        .track-anglo { border-color: rgba(59,130,246,0.3); }
        .track-anglo:hover { border-color: #3b82f6; box-shadow: 0 8px 30px rgba(59,130,246,0.15); }
        .bottom-links {
            margin-top: 2.5rem;
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .bottom-links a {
            color: #606070;
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }
        .bottom-links a:hover { color: #f59e0b; }
        @media (max-width: 550px) {
            .tracks { flex-direction: column; align-items: center; }
            .track { min-width: 200px; width: 100%; }
            .landing h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<div class="landing">
    <h1>Revision pour le peuple</h1>
    <p class="sub">fais par felix le goat</p>

    <div class="tracks">
        <a href="fr/index.html" class="track track-franco">
            <div class="flag">🇫🇷</div>
            <div class="track-title">Track Franco</div>
            <div class="track-desc">Cours en francais</div>
        </a>
        <a href="en/index.html" class="track track-anglo">
            <div class="flag">🇬🇧</div>
            <div class="track-title">Track Anglo</div>
            <div class="track-desc">Courses in English</div>
        </a>
    </div>

    <div class="bottom-links">
        <a href="previsions.html">🔮 Previsions du Goat</a>
    </div>
</div>

<script data-goatcounter="https://chaborz.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
