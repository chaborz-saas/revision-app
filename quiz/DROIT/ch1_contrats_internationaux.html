<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz — Les contrats internationaux — Principes generaux</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; padding: 1.5rem; }
        .quiz-header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 1.5rem 2rem; border-radius: 16px; margin-bottom: 1.5rem; border-bottom: 3px solid #e94560; }
        .quiz-header .matiere { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #e94560; margin-bottom: 0.3rem; }
        .quiz-header h1 { font-size: 1.3rem; font-weight: 700; color: white; }
        .quiz-container { max-width: 800px; margin: 0 auto; }
        .progress-bar { background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; margin-bottom: 1.5rem; }
        .progress-fill { background: #e94560; height: 100%; border-radius: 10px; transition: width 0.3s; }
        .score-display { text-align: center; font-size: 0.85rem; color: #808090; margin-bottom: 1rem; }
        .timer { text-align: center; font-size: 0.85rem; color: #f59e0b; margin-bottom: 0.5rem; font-weight: 600; }
        .question-card { background: #1a1a2e; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 2rem; margin-bottom: 1rem; }
        .question-num { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #e94560; margin-bottom: 0.8rem; font-weight: 700; }
        .question-text { font-size: 1.05rem; font-weight: 600; color: white; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: grid; gap: 0.6rem; }
        .option { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0.9rem 1.2rem; cursor: pointer; transition: all 0.2s; font-size: 0.92rem; color: #d0d0d8; text-align: left; width: 100%; }
        .option:hover:not(:disabled) { background: rgba(233,69,96,0.1); border-color: rgba(233,69,96,0.4); color: white; }
        .option.correct { background: rgba(16,185,129,0.2); border-color: #10b981; color: #10b981; font-weight: 600; }
        .option.wrong { background: rgba(233,69,96,0.2); border-color: #e94560; color: #e94560; }
        .option:disabled { cursor: default; }
        .explanation { background: rgba(233,69,96,0.08); border-left: 3px solid #e94560; padding: 0.8rem 1rem; margin-top: 1rem; border-radius: 0 8px 8px 0; font-size: 0.88rem; color: #f4a0b0; display: none; }
        .nav-buttons { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; gap: 1rem; }
        .btn { padding: 0.7rem 1.5rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-next { background: #e94560; color: white; margin-left: auto; }
        .btn-next:hover { background: #d63851; }
        .btn-next:disabled { background: rgba(255,255,255,0.1); color: #606070; cursor: default; }
        .result-card { background: #1a1a2e; border-radius: 16px; padding: 3rem 2rem; text-align: center; display: none; }
        .result-score { font-size: 3.5rem; font-weight: 800; color: #e94560; margin: 1rem 0; }
        .result-msg { font-size: 1.1rem; color: #d0d0d8; margin-bottom: 2rem; }
        .result-time { font-size: 0.9rem; color: #f59e0b; margin-bottom: 1.5rem; }
        .btn-restart { background: #e94560; color: white; padding: 0.8rem 2rem; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; border: none; }
        .back-link { display: inline-block; color: #808090; font-size: 0.8rem; text-decoration: none; margin-bottom: 1rem; }
        .back-link:hover { color: #e94560; }
    </style>
</head>
<body>
<div class="quiz-container">
    <a href="../../fr/index.html" class="back-link">&larr; Retour &agrave; l'accueil</a>
    <div class="quiz-header">
        <div class="matiere">DROIT DES AFFAIRES INTERNATIONALES &mdash; QUIZ</div>
        <h1>Ch.1 : Les contrats internationaux &mdash; Principes generaux</h1>
    </div>
    <div class="timer" id="timer">&#9201; 00:00</div>
    <div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">10</span> &mdash; Score : <span id="score">0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:10%"></div></div>
    <div id="quiz-area"></div>
    <div class="result-card" id="result-card">
        <div style="font-size:2rem">&#127919;</div>
        <div class="result-score"><span id="final-score">0</span>/10</div>
        <div class="result-time" id="result-time"></div>
        <div class="result-msg" id="result-msg"></div>
        <button class="btn-restart" onclick="restartQuiz()">Recommencer</button>
        <br><br>
        <a href="../../fr/index.html" class="back-link">&larr; Retour &agrave; l'accueil</a>
    </div>
</div>
<script>
const questions = [
    {q:"Selon le Reglement Rome I (art. 3), les parties a un contrat international peuvent choisir comme loi applicable :",options:["Uniquement la loi d'un Etat membre de l'UE","N'importe quel droit national, sans restriction","Uniquement la loi du pays du vendeur ou de l'acheteur","Uniquement la loi du pays ou le contrat est execute"],correct:1,explanation:"Le principe de liberte de choix de Rome I est illimite : les parties peuvent designer n'importe quel droit national comme loi du contrat (art. 3)."},
    {q:"Vrai ou faux : En l'absence de choix de loi applicable, un contrat de franchise est regi par la loi du pays ou le franchiseur a sa residence habituelle.",options:["Vrai, c'est le franchiseur qui effectue la prestation caracteristique","Vrai, car le franchiseur detient la marque","Faux, c'est la loi du pays du franchise qui s'applique","Faux, c'est la loi du pays ou la franchise est exploitee"],correct:2,explanation:"Selon Rome I (art. 4.1), un contrat de franchise est regi par la loi du pays ou le franchise (et non le franchiseur) a sa residence habituelle."},
    {q:"Lequel de ces contrats ne peut PAS contenir une clause attributive de competence valable dans l'UE ?",options:["Un contrat de vente de marchandises","Un contrat de licence de brevet","Un contrat de distribution","Un contrat d'assurance"],correct:3,explanation:"Les clauses attributives de competence sont interdites dans trois types de contrats : travail, assurance et consommation."},
    {q:"Que sont les dispositions imperatives (lois de police) au sens de l'article 9 de Rome I ?",options:["Des clauses contractuelles obligatoires dans tout contrat international","Des regles propres aux contrats de travail uniquement","Des regles dont le respect est essentiel pour les interets publics d'un pays, applicables quelle que soit la loi du contrat","Des regles qui s'appliquent uniquement aux entreprises de l'UE"],correct:2,explanation:"Les lois de police (art. 9 Rome I) sont des regles considerees comme essentielles pour la sauvegarde des interets publics d'un pays et s'appliquent independamment de la loi choisie."},
    {q:"Un vendeur francais et un acheteur chinois n'ont pas designe de loi applicable a leur contrat de vente. Quelle loi s'applique selon Rome I ?",options:["La loi chinoise, car l'acheteur supporte le risque principal","La loi francaise, car c'est la loi du pays du vendeur","La loi du lieu de livraison des marchandises","La loi du pays du tribunal saisi"],correct:1,explanation:"En l'absence de choix, un contrat de vente de biens est regi par la loi du pays ou le vendeur a sa residence habituelle (Rome I, art. 4.1 a)."},
    {q:"Selon les Principes UNIDROIT, laquelle n'est PAS une condition du hardship (art. 6.2.2) ?",options:["Les evenements surviennent apres la conclusion du contrat","L'execution du contrat est devenue totalement impossible","Les evenements echappent au controle de la partie lesee","Le risque n'a pas ete assume par la partie lesee"],correct:1,explanation:"Le hardship concerne une execution devenue excessivement onereuse, pas impossible. L'impossibilite totale releve de la force majeure, pas du hardship."},
    {q:"Quelle est la premiere etape prevue par les Principes UNIDROIT en cas de hardship ?",options:["La saisine immediate du tribunal","La suspension automatique de l'execution du contrat","La resolution unilaterale du contrat","La demande de renegociation adressee a l'autre partie"],correct:3,explanation:"En cas de hardship, la partie lesee doit d'abord demander la renegociation du contrat (art. 6.2.3). Ce n'est qu'a defaut d'accord que le tribunal peut etre saisi."},
    {q:"Quel est le principe general de competence juridictionnelle pose par le Reglement Bruxelles I bis ?",options:["Le tribunal du domicile du defendeur","Le tribunal du domicile du demandeur","Le tribunal du lieu de conclusion du contrat","Le tribunal du lieu d'execution du contrat"],correct:0,explanation:"Le Reglement Bruxelles I bis pose le principe de competence du tribunal du domicile du defendeur (art. 4)."},
    {q:"La Convention de New York du 10 juin 1958 concerne :",options:["La determination de la loi applicable aux contrats internationaux","La protection des consommateurs dans le commerce international","La reconnaissance et l'execution des sentences arbitrales etrangeres","La reglementation du transport maritime international"],correct:2,explanation:"La Convention de New York de 1958 porte sur la reconnaissance et l'execution des sentences arbitrales etrangeres et a ete ratifiee par plus de 170 Etats."},
    {q:"Vrai ou faux : Une clause compromissoire (clause d'arbitrage) peut etre etendue a une partie non signataire du contrat si celle-ci etait directement impliquee dans son execution.",options:["Faux, seules les parties signataires sont liees par la clause","Vrai, c'est le principe d'extension reconnu par la jurisprudence","Faux, l'arbitrage ne s'applique jamais aux tiers","Vrai, mais uniquement si le tribunal etatique l'ordonne"],correct:1,explanation:"La jurisprudence (CA Paris, 18 dec. 2018) reconnait qu'une clause compromissoire peut etre etendue aux parties directement impliquees dans l'execution du contrat, meme non signataires, si elles en avaient connaissance."}
];
let current = 0, score = 0, answered = false, startTime = Date.now(), timerInterval;
function startTimer() { timerInterval = setInterval(() => { const elapsed = Math.floor((Date.now() - startTime) / 1000); const m = String(Math.floor(elapsed / 60)).padStart(2, '0'); const s = String(elapsed % 60).padStart(2, '0'); document.getElementById('timer').textContent = '\u23F1 ' + m + ':' + s; }, 1000); }
function shuffleOptions(q) { const indices = q.options.map((_, i) => i); for (let i = indices.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [indices[i], indices[j]] = [indices[j], indices[i]]; } const shuffled = indices.map(i => q.options[i]); const newCorrect = indices.indexOf(q.correct); return { ...q, options: shuffled, correct: newCorrect }; }
function renderQ() { const q = shuffleOptions(questions[current]); questions[current]._shuffled = q; document.getElementById('current-q').textContent = current + 1; document.getElementById('total-q').textContent = questions.length; document.getElementById('score').textContent = score; document.getElementById('progress').style.width = ((current + 1) / questions.length * 100) + '%'; const letters = ['A', 'B', 'C', 'D']; document.getElementById('quiz-area').innerHTML = '<div class="question-card"><div class="question-num">Question ' + (current + 1) + ' / ' + questions.length + '</div><div class="question-text">' + q.q + '</div><div class="options">' + q.options.map((opt, i) => '<button class="option" onclick="selectOption(' + i + ')" id="opt' + i + '">' + letters[i] + '. ' + opt + '</button>').join('') + '</div><div class="explanation" id="explanation">' + q.explanation + '</div></div><div class="nav-buttons"><div></div><button class="btn btn-next" id="btn-next" onclick="nextQ()" disabled>Suivant &rarr;</button></div>'; answered = false; }
function selectOption(idx) { if (answered) return; answered = true; const q = questions[current]._shuffled; document.querySelectorAll('.option').forEach(b => b.disabled = true); if (idx === q.correct) { document.getElementById('opt' + idx).classList.add('correct'); score++; } else { document.getElementById('opt' + idx).classList.add('wrong'); document.getElementById('opt' + q.correct).classList.add('correct'); } document.getElementById('explanation').style.display = 'block'; document.getElementById('btn-next').disabled = false; document.getElementById('score').textContent = score; }
function nextQ() { if (current < questions.length - 1) { current++; renderQ(); } else { showResult(); } }
function showResult() { clearInterval(timerInterval); const elapsed = Math.floor((Date.now() - startTime) / 1000); const m = Math.floor(elapsed / 60); const s = elapsed % 60; document.getElementById('quiz-area').innerHTML = ''; const rc = document.getElementById('result-card'); rc.style.display = 'block'; document.getElementById('final-score').textContent = score; document.getElementById('result-time').textContent = '\u23F1 Temps : ' + m + 'min ' + s + 's'; const pct = score / questions.length; document.getElementById('result-msg').textContent = pct >= 0.9 ? 'Excellent ! Tu maitrises ce chapitre.' : pct >= 0.7 ? 'Bien joue ! Encore un peu de revision et ce sera parfait.' : pct >= 0.5 ? 'Pas mal, mais relis la synthese pour consolider.' : 'Continue a reviser ! Relis la synthese et reessaie.'; }
function restartQuiz() { current = 0; score = 0; answered = false; startTime = Date.now(); document.getElementById('result-card').style.display = 'none'; startTimer(); renderQ(); }
startTimer(); renderQ();
</script>
<script data-goatcounter="https://chaborz.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
