<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz — Change Management Ch3: From Rhetoric to Strategy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; padding: 1.5rem; }
        .quiz-header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 1.5rem 2rem; border-radius: 16px; margin-bottom: 1.5rem; border-bottom: 3px solid #10b981; }
        .quiz-header .matiere { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #10b981; margin-bottom: 0.3rem; }
        .quiz-header h1 { font-size: 1.3rem; font-weight: 700; color: white; }
        .quiz-container { max-width: 800px; margin: 0 auto; }
        .progress-bar { background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; margin-bottom: 1.5rem; }
        .progress-fill { background: #10b981; height: 100%; border-radius: 10px; transition: width 0.3s; }
        .score-display { text-align: center; font-size: 0.85rem; color: #808090; margin-bottom: 1rem; }
        .timer { text-align: center; font-size: 0.85rem; color: #f59e0b; margin-bottom: 0.5rem; font-weight: 600; }
        .question-card { background: #1a1a2e; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 2rem; margin-bottom: 1rem; }
        .question-num { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #10b981; margin-bottom: 0.8rem; font-weight: 700; }
        .question-text { font-size: 1.05rem; font-weight: 600; color: white; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: grid; gap: 0.6rem; }
        .option { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0.9rem 1.2rem; cursor: pointer; transition: all 0.2s; font-size: 0.92rem; color: #d0d0d8; text-align: left; width: 100%; }
        .option:hover:not(:disabled) { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.4); color: white; }
        .option.correct { background: rgba(16,185,129,0.2); border-color: #10b981; color: #10b981; font-weight: 600; }
        .option.wrong { background: rgba(239,68,68,0.2); border-color: #ef4444; color: #ef4444; }
        .option:disabled { cursor: default; }
        .explanation { background: rgba(16,185,129,0.08); border-left: 3px solid #10b981; padding: 0.8rem 1rem; margin-top: 1rem; border-radius: 0 8px 8px 0; font-size: 0.88rem; color: #6ee7b7; display: none; }
        .nav-buttons { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; gap: 1rem; }
        .btn { padding: 0.7rem 1.5rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-next { background: #10b981; color: white; margin-left: auto; }
        .btn-next:hover { background: #059669; }
        .btn-next:disabled { background: rgba(255,255,255,0.1); color: #606070; cursor: default; }
        .result-card { background: #1a1a2e; border-radius: 16px; padding: 3rem 2rem; text-align: center; display: none; }
        .result-score { font-size: 3.5rem; font-weight: 800; color: #10b981; margin: 1rem 0; }
        .result-msg { font-size: 1.1rem; color: #d0d0d8; margin-bottom: 2rem; }
        .result-time { font-size: 0.9rem; color: #f59e0b; margin-bottom: 1.5rem; }
        .btn-restart { background: #10b981; color: white; padding: 0.8rem 2rem; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; border: none; }
        .back-link { display: inline-block; color: #808090; font-size: 0.8rem; text-decoration: none; margin-bottom: 1rem; }
        .back-link:hover { color: #10b981; }
    </style>
</head>
<body>
<div class="quiz-container">
    <a href="../../en/index.html" class="back-link">&larr; Back to dashboard</a>
    <div class="quiz-header">
        <div class="matiere">CHANGE MANAGEMENT &mdash; QUIZ</div>
        <h1>Chapter 3 &mdash; From Rhetoric to Strategy</h1>
    </div>
    <div class="timer" id="timer">⏱ 00:00</div>
    <div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">10</span> &mdash; Score: <span id="score">0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:10%"></div></div>
    <div id="quiz-area"></div>
    <div class="result-card" id="result-card">
        <div style="font-size:2rem">&#127919;</div>
        <div class="result-score"><span id="final-score">0</span>/10</div>
        <div class="result-time" id="result-time"></div>
        <div class="result-msg" id="result-msg"></div>
        <button class="btn-restart" onclick="restartQuiz()">Restart</button>
        <br><br>
        <a href="../../en/index.html" class="back-link">&larr; Back to dashboard</a>
    </div>
</div>
<script>
const questions = [
    {q:"According to Porter & Kramer (2006), a 'generic issue' for a firm is one that is:", options:["Directly caused by the firm's operations","Socially important but unrelated to the firm's specific operations","A structural condition shaping long-term competitiveness","Embedded in the firm's supply chain"], correct:1, explanation:"Generic issues are socially important but unrelated to the firm's own operations — for example, a software firm donating to disaster relief. They build goodwill but offer limited strategic leverage."},
    {q:"'Double materiality' combines which two perspectives?", options:["Short-term profit and long-term profit","Financial materiality and environmental materiality","Shareholder value and stock price","Internal audit and external audit"], correct:1, explanation:"Double materiality combines financial materiality (how sustainability issues affect the firm's finances) with environmental materiality (how the firm impacts the environment). Tools include GRI and SASB mapping."},
    {q:"In the evolution from CSR to CSM, what does the CSM stage emphasize?", options:["Voluntary narrative reporting","Investor compliance only","Data-driven strategic management with indices and life-cycle tools","Philanthropic donations and volunteer programs"], correct:2, explanation:"CSM (Corporate Sustainability Management) is the third stage: it uses data-driven strategic management — measuring impacts through indices and life-cycle tools, managing through incentives and governance, and improving through continuous innovation."},
    {q:"Which of the following best describes 'peripheral sustainability' rather than 'strategic sustainability'?", options:["Embedding sustainability in operations, supply chain, and product design","Using sustainability as an innovation filter for R&D and capital expenditure","Isolated CSR actions like donations and short campaigns, motivated by image","Tying executive pay to audited ESG outcomes"], correct:2, explanation:"Peripheral sustainability involves isolated, symbolic CSR actions (donations, volunteer days) motivated by image or external pressure. Strategic sustainability embeds it in core operations with measurable, transformative impact."},
    {q:"HUL's Project Shakti is used in the course as an example of:", options:["A failed greenwashing campaign","A government-mandated sustainability regulation","Inclusive sustainability — using rural women as micro-entrepreneurs for supply-chain innovation","A circular economy recycling program"], correct:2, explanation:"HUL Project Shakti trained 120,000+ rural women in India as micro-entrepreneurs, creating rural reach and trusted local distribution. It demonstrates that inclusion can be a supply-chain innovation, not just CSR."},
    {q:"For climate change, the course shows that ExxonMobil faces it as a 'competitive-context issue.' What does this mean?", options:["Climate is irrelevant to ExxonMobil's operations","Climate change only affects ExxonMobil's brand image","The core business model itself is at risk from climate change","ExxonMobil only needs minor efficiency improvements"], correct:2, explanation:"For ExxonMobil (energy), climate is a competitive-context issue — meaning the structural conditions shaping its long-term competitiveness and core business model are fundamentally at risk."},
    {q:"The three mechanisms of Shared Value (Porter & Kramer, 2011) are reconceiving products/markets, redefining value-chain productivity, and:", options:["Maximizing quarterly earnings","Enabling local cluster development","Reducing the corporate tax rate","Outsourcing to low-cost countries"], correct:1, explanation:"The three mechanisms are: (1) reconceive products and markets, (2) redefine value-chain productivity, and (3) enable local cluster development — training suppliers, improving infrastructure, supporting smallholders."},
    {q:"The 'inside-out' perspective in strategic sustainability focuses on:", options:["Addressing external conditions affecting competitiveness like infrastructure and water","Reducing harms from the firm's own operations such as waste, emissions, and labour conditions","Lobbying government for subsidies","Benchmarking against competitors' ESG scores"], correct:1, explanation:"Inside-out focuses on reducing harms from the firm's own operations (waste, emissions, labour). Outside-in addresses external conditions that affect competitiveness (infrastructure, health, water)."},
    {q:"What key lesson does the Facebook/Cambridge Analytica case illustrate about sustainability?", options:["Social media companies are exempt from sustainability concerns","Sustainability includes digital responsibility — data rights, equity, and truth","Only environmental issues matter for corporate sustainability","Privacy violations have no financial consequences"], correct:1, explanation:"The Cambridge Analytica case shows that sustainability extends to digital responsibility — including data privacy, equity, and algorithmic transparency. Weak governance of social externalities led to regulatory backlash and trust loss."},
    {q:"According to the course, the three analytical filters for strategic prioritization of sustainability issues are influence, risk exposure, and:", options:["Brand recognition","Impact potential","Employee satisfaction","Historical precedent"], correct:1, explanation:"Managers evaluate sustainability issues through three filters: (1) Influence — where can the firm shape outcomes, (2) Risk Exposure — biggest threats, and (3) Impact Potential — which actions yield both societal and business value."}
];
let current = 0, score = 0, answered = false, startTime = Date.now(), timerInterval;
function startTimer() {
    timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const s = String(elapsed % 60).padStart(2, '0');
        document.getElementById('timer').textContent = '⏱ ' + m + ':' + s;
    }, 1000);
}
function shuffleOptions(q) {
    const indices = q.options.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    const shuffled = indices.map(i => q.options[i]);
    const newCorrect = indices.indexOf(q.correct);
    return { ...q, options: shuffled, correct: newCorrect };
}
function renderQ() {
    const q = shuffleOptions(questions[current]);
    questions[current]._shuffled = q;
    document.getElementById('current-q').textContent = current + 1;
    document.getElementById('total-q').textContent = questions.length;
    document.getElementById('score').textContent = score;
    document.getElementById('progress').style.width = ((current + 1) / questions.length * 100) + '%';
    const letters = ['A', 'B', 'C', 'D'];
    document.getElementById('quiz-area').innerHTML =
        '<div class="question-card">' +
        '<div class="question-num">Question ' + (current + 1) + ' / ' + questions.length + '</div>' +
        '<div class="question-text">' + q.q + '</div>' +
        '<div class="options">' + q.options.map((opt, i) => '<button class="option" onclick="selectOption(' + i + ')" id="opt' + i + '">' + letters[i] + '. ' + opt + '</button>').join('') + '</div>' +
        '<div class="explanation" id="explanation">' + q.explanation + '</div>' +
        '</div>' +
        '<div class="nav-buttons"><div></div><button class="btn btn-next" id="btn-next" onclick="nextQ()" disabled>Next &rarr;</button></div>';
    answered = false;
}
function selectOption(idx) {
    if (answered) return;
    answered = true;
    const q = questions[current]._shuffled;
    document.querySelectorAll('.option').forEach(b => b.disabled = true);
    if (idx === q.correct) { document.getElementById('opt' + idx).classList.add('correct'); score++; }
    else { document.getElementById('opt' + idx).classList.add('wrong'); document.getElementById('opt' + q.correct).classList.add('correct'); }
    document.getElementById('explanation').style.display = 'block';
    document.getElementById('btn-next').disabled = false;
    document.getElementById('score').textContent = score;
}
function nextQ() { if (current < questions.length - 1) { current++; renderQ(); } else { showResult(); } }
function showResult() {
    clearInterval(timerInterval);
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    document.getElementById('quiz-area').innerHTML = '';
    const rc = document.getElementById('result-card');
    rc.style.display = 'block';
    document.getElementById('final-score').textContent = score;
    document.getElementById('result-time').textContent = '⏱ Time: ' + m + 'min ' + s + 's';
    const pct = score / questions.length;
    document.getElementById('result-msg').textContent = pct >= 0.9 ? 'Outstanding! You truly mastered this chapter.' : pct >= 0.7 ? 'Good job! A bit more review and you will ace it.' : pct >= 0.5 ? 'Not bad, but review the summary to strengthen weak areas.' : 'Keep studying! Read the summary and try again.';
}
function restartQuiz() { current = 0; score = 0; answered = false; startTime = Date.now(); document.getElementById('result-card').style.display = 'none'; startTimer(); renderQ(); }
startTimer();
renderQ();
</script>

</body>
</html>
