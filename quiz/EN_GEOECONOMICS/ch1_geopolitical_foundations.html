        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

<body>
<div class="quiz-container">
    <a href="../../en/index.html" class="back-link">&larr; Back to dashboard</a>
    <div class="quiz-header">
        <div class="matiere">GEOECONOMICS &mdash; QUIZ</div>
        <h1>Chapter 1 &mdash; Geopolitical Foundations and Geoeconomics</h1>
    </div>
    <div class="timer" id="timer">&#9201; 00:00</div>
    <div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">10</span> &mdash; Score: <span id="score">0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:10%"></div></div>
    <div id="quiz-area"></div>
    <div class="result-card" id="result-card">
        <div style="font-size:2rem">&#127919;</div>
        <div class="result-score"><span id="final-score">0</span>/10</div>
        <div class="result-time" id="result-time"></div>
        <div class="result-msg" id="result-msg"></div>
        <button class="btn-restart" onclick="restartQuiz()">Restart</button>
        <br><br>
        <a href="../../en/index.html" class="back-link">&larr; Back to dashboard</a>
    </div>
</div>
<script>
const questions = [
    {q:"According to Lacoste (2008), what is the central question of geopolitical analysis?", options:["How do states maximize their military budgets?","Which country has the largest economy in a region?","What is at stake in a given territory that makes it a place of crisis, conflict, or tension?","How do international organizations distribute foreign aid?"], correct:2, explanation:"Geopolitics is the study of rivalries for power or influence over a given territory. Its central question asks what is at stake in a territory that makes it a place of crisis, conflict, or tension."},
    {q:"Which of the following is NOT one of the three key dimensions of geopolitical analysis?", options:["Technology","Territory","Actors","Issue / Stake / Conflict"], correct:0, explanation:"The three interconnected dimensions of any geopolitical analysis are Territory, Actors, and Issue/Stake/Conflict. Technology is not one of these foundational dimensions."},
    {q:"What distinguishes external actors from internal actors in a geopolitical conflict?", options:["External actors always use military force while internal actors rely on diplomacy","External actors have relations with internal actors or interests in the territory but are not directly in opposition","External actors are always states while internal actors are always non-state entities","External actors have no impact on the issue at hand"], correct:1, explanation:"Internal actors are directly in opposition through crises/conflicts on a territory. External actors have friendly or hostile relations with internal actors and/or other interests in the territory and may impact the issue."},
    {q:"In the Strait of Hormuz case study, which mechanism did the EU create to maintain trade with Iran despite US sanctions?", options:["The Quad Alliance","CENTCOM","The JCPOA nuclear deal","INSTEX (Instrument in Support of Trade Exchanges)"], correct:3, explanation:"The EU created INSTEX to facilitate trade exchanges with Iran while navigating US sanctions. The EU was also involved in the JCPOA, but INSTEX was the specific trade mechanism created in response to sanctions."},
    {q:"Which power lever is used by China in the South China Sea dispute according to the course?", options:["Deployment of US CENTCOM naval fleets","Construction of artificial islands and the Nine-Dash Line discourse","Control of the Druzhba pipeline","Deployment of IRGC Navy forces"], correct:1, explanation:"China uses naval deployment, artificial island construction, anti-ship missiles, coast guard patrols, the Nine-Dash Line discourse, and selective ASEAN partnerships as power levers in the South China Sea."},
    {q:"How does Luttwak (1990) define geoeconomics?", options:["The study of how geography determines economic development","A theory that free markets always outperform state intervention","The use of economic instruments by States for strategic purposes within the international arena","The analysis of GDP growth rates across different regions"], correct:2, explanation:"Geoeconomics is defined as the use of economic instruments by States for strategic purposes within the international arena (Luttwak, 1990). It bridges market logic with political objectives."},
    {q:"Which statement correctly describes the relationship between geopolitics and geoeconomics?", options:["They are complementary approaches whose distinction is increasingly blurred as hybrid strategies proliferate","Geopolitics has been entirely replaced by geoeconomics in the 21st century","They are completely separate fields with no possible overlap","Geoeconomics only applies during peacetime while geopolitics applies during war"], correct:0, explanation:"The distinction between geopolitics and geoeconomics is increasingly blurred. They are complementary approaches: distinct but interrelated modalities of power. Contemporary state strategies increasingly combine both logics."},
    {q:"In the Kashmir case study, which external actor uses CPEC economic influence and UN veto power as power levers?", options:["Pakistan","India","The United States","China"], correct:3, explanation:"China uses military strength, territorial control in adjacent areas (Ladakh), CPEC (China-Pakistan Economic Corridor) economic influence, and UN veto power as its power levers in the Kashmir dispute."},
    {q:"For the Guadeloupe social protests case study (2021-2022), which actor used general strikes and anti-colonial discourse as power levers?", options:["The French State","The UGTG trade union","International human rights NGOs","The European Commission"], correct:1, explanation:"The UGTG trade union used its capacity to organize general strikes, anti-colonial discourse, and cross-sector mobilization as power levers during the Guadeloupe social protests."},
    {q:"Which of the following is NOT a geoeconomic lever of power listed in the course?", options:["Economic sanctions and embargoes","Export controls on sensitive technologies","Military invasion and territorial occupation","Conditional access to critical resources such as rare earth elements"], correct:2, explanation:"Military invasion is a classical geopolitical lever based on direct coercive force. Geoeconomic levers include sanctions, export controls, trade agreements, energy diplomacy, resource access conditions, and infrastructure control."}
];
let current = 0, score = 0, answered = false, startTime = Date.now(), timerInterval;
function startTimer() { timerInterval = setInterval(() => { const elapsed = Math.floor((Date.now() - startTime) / 1000); const m = String(Math.floor(elapsed / 60)).padStart(2, '0'); const s = String(elapsed % 60).padStart(2, '0'); document.getElementById('timer').textContent = '\u23F1 ' + m + ':' + s; }, 1000); }
function shuffleOptions(q) { const indices = q.options.map((_, i) => i); for (let i = indices.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [indices[i], indices[j]] = [indices[j], indices[i]]; } const shuffled = indices.map(i => q.options[i]); const newCorrect = indices.indexOf(q.correct); return { ...q, options: shuffled, correct: newCorrect }; }
function renderQ() { const q = shuffleOptions(questions[current]); questions[current]._shuffled = q; document.getElementById('current-q').textContent = current + 1; document.getElementById('total-q').textContent = questions.length; document.getElementById('score').textContent = score; document.getElementById('progress').style.width = ((current + 1) / questions.length * 100) + '%'; const letters = ['A', 'B', 'C', 'D']; document.getElementById('quiz-area').innerHTML = '<div class="question-card"><div class="question-num">Question ' + (current + 1) + ' / ' + questions.length + '</div><div class="question-text">' + q.q + '</div><div class="options">' + q.options.map((opt, i) => '<button class="option" onclick="selectOption(' + i + ')" id="opt' + i + '">' + letters[i] + '. ' + opt + '</button>').join('') + '</div><div class="explanation" id="explanation">' + q.explanation + '</div></div><div class="nav-buttons"><div></div><button class="btn btn-next" id="btn-next" onclick="nextQ()" disabled>Next &rarr;</button></div>'; answered = false; }
function selectOption(idx) { if (answered) return; answered = true; const q = questions[current]._shuffled; document.querySelectorAll('.option').forEach(b => b.disabled = true); if (idx === q.correct) { document.getElementById('opt' + idx).classList.add('correct'); score++; } else { document.getElementById('opt' + idx).classList.add('wrong'); document.getElementById('opt' + q.correct).classList.add('correct'); } document.getElementById('explanation').style.display = 'block'; document.getElementById('btn-next').disabled = false; document.getElementById('score').textContent = score; }
function nextQ() { if (current < questions.length - 1) { current++; renderQ(); } else { showResult(); } }
function showResult() { clearInterval(timerInterval); const elapsed = Math.floor((Date.now() - startTime) / 1000); const m = Math.floor(elapsed / 60); const s = elapsed % 60; document.getElementById('quiz-area').innerHTML = ''; const rc = document.getElementById('result-card'); rc.style.display = 'block'; document.getElementById('final-score').textContent = score; document.getElementById('result-time').textContent = '\u23F1 Time: ' + m + 'min ' + s + 's'; const pct = score / questions.length; document.getElementById('result-msg').textContent = pct >= 0.9 ? 'Outstanding! You truly mastered this chapter.' : pct >= 0.7 ? 'Good job! A bit more review and you will ace it.' : pct >= 0.5 ? 'Not bad, but review the summary to strengthen weak areas.' : 'Keep studying! Read the summary and try again.'; }
function restartQuiz() { current = 0; score = 0; answered = false; startTime = Date.now(); document.getElementById('result-card').style.display = 'none'; startTimer(); renderQ(); }
startTimer(); renderQ();
</script>
