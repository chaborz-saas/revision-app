<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz — Geoeconomics Ch 2: Actors, Flows, and Scales of Analysis</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', 'Segoe UI', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; padding: 2rem; }
        .quiz-container { max-width: 800px; margin: 0 auto; }
        .back-link { color: #10b981; text-decoration: none; font-weight: 600; display: inline-block; margin-bottom: 1rem; }
        .back-link:hover { text-decoration: underline; }
        .quiz-header { text-align: center; margin-bottom: 2rem; }
        .matiere { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 2px; color: #10b981; margin-bottom: 0.5rem; }
        h1 { font-size: 1.8rem; color: #fff; }
        .score-display { text-align: center; font-size: 1rem; color: #aaa; margin-bottom: 1rem; }
        .progress-bar { width: 100%; height: 6px; background: #1e1e2f; border-radius: 3px; margin-bottom: 2rem; overflow: hidden; }
        .progress-fill { height: 100%; background: #10b981; border-radius: 3px; transition: width 0.4s ease; }
        .question-card { background: #1a1a2e; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; }
        .question-num { color: #10b981; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.75rem; }
        .question-text { font-size: 1.15rem; color: #fff; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 0.75rem; }
        .option { background: #16213e; border: 2px solid #1e3a5f; padding: 1rem 1.25rem; border-radius: 8px; color: #e0e0e0; font-size: 1rem; cursor: pointer; text-align: left; transition: all 0.2s; }
        .option:hover:not(:disabled) { border-color: #10b981; background: #1a2a4a; }
        .option:disabled { cursor: not-allowed; opacity: 0.85; }
        .option.correct { border-color: #10b981; background: rgba(16,185,129,0.15); color: #10b981; font-weight: 600; }
        .option.wrong { border-color: #ef4444; background: rgba(239,68,68,0.15); color: #ef4444; }
        .explanation { display: none; margin-top: 1.25rem; padding: 1rem; background: rgba(16,185,129,0.08); border-left: 3px solid #10b981; border-radius: 4px; font-size: 0.95rem; color: #a7f3d0; }
        .nav-buttons { text-align: center; margin-top: 1rem; }
        .btn-next { background: #10b981; color: #fff; border: none; padding: 0.75rem 2rem; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: 600; }
        .btn-next:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-next:hover:not(:disabled) { background: #059669; }
        .result-card { display: none; text-align: center; background: #1a1a2e; border-radius: 12px; padding: 3rem 2rem; }
        .result-score { font-size: 3rem; color: #10b981; font-weight: 700; margin: 1rem 0; }
        .result-msg { font-size: 1.2rem; color: #ccc; margin-bottom: 1.5rem; }
        .btn-restart { background: #10b981; color: #fff; border: none; padding: 0.75rem 2rem; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: 600; }
        .btn-restart:hover { background: #059669; }
    </style>
</head>
<body>
<div class="quiz-container">
    <a href="../../en/index.html" class="back-link">&larr; Back to dashboard</a>
    <div class="quiz-header">
        <div class="matiere">GEOECONOMICS &mdash; QUIZ</div>
        <h1>Chapter 2 &mdash; Actors, Flows, and Scales of Analysis</h1>
    </div>
    <div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">8</span> &mdash; Score: <span id="score">0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:12.5%"></div></div>
    <div id="quiz-area"></div>
    <div class="result-card" id="result-card">
        <div style="font-size:2rem">&#127919;</div>
        <div class="result-score"><span id="final-score">0</span>/<span id="final-total">8</span></div>
        <div class="result-msg" id="result-msg"></div>
        <button class="btn-restart" onclick="restartQuiz()">Restart</button>
        <br><br>
        <a href="../../en/index.html" class="back-link">&larr; Back to dashboard</a>
    </div>
</div>

<script>
const questions = [
    { q: "In the TikTok vs. USA case, what law did the US Congress pass in 2024?", options: ["A. Digital Markets Act", "B. Protecting Americans from Foreign Adversary Controlled Applications Act (PAFACA)", "C. National Data Protection Act", "D. Foreign Technology Restriction Act"], correct: 1, explanation: "The PAFACA (Protecting Americans from Foreign Adversary Controlled Applications Act) was passed in 2024, requiring TikTok to divest from ByteDance or face a nationwide ban." },
    { q: "In the Foxconn/Apple vs. China case, what type of flows are primarily at stake?", options: ["A. Tourism and cultural flows", "B. Material flows (components, iPhones), financial flows, and knowledge flows", "C. Migration and demographic flows", "D. Energy and water flows"], correct: 1, explanation: "The Foxconn/Apple case involves material flows (semiconductors, batteries, screens, iPhones), financial flows (taxation, profits, penalties), and knowledge flows (manufacturing expertise transfer)." },
    { q: "Why did the Lukoil vs. Ukraine dispute escalate into a broader diplomatic conflict?", options: ["A. Lukoil refused to pay transit fees", "B. Ukraine used control over energy transit flows as strategic leverage during wartime", "C. Hungary and Slovakia declared war on Ukraine", "D. The EU imposed new tariffs on Russian oil"], correct: 1, explanation: "Ukraine restricted Lukoil's oil transit through the Druzhba pipeline, using control over energy flows as leverage. Hungary and Slovakia, dependent on Russian crude, protested, creating a diplomatic dispute within the EU." },
    { q: "According to the course, what gives multinational corporations their geoeconomic power?", options: ["A. Their military capabilities", "B. Their control over global value chains", "C. Their ability to declare war on states", "D. Their direct control over national currencies"], correct: 1, explanation: "MNCs derive their geoeconomic power from control over global value chains (Bednarski et al., 2023). They influence geopolitics through location, sourcing, and lobbying decisions." },
    { q: "What are the three interconnected levels of geopolitical/geoeconomic analysis?", options: ["A. Micro, meso, macro economics", "B. Classical geopolitics, critical geopolitics, geoeconomics", "C. Military, diplomatic, cultural analysis", "D. Local, national, international governance"], correct: 1, explanation: "The three levels are: (1) Classical geopolitics (State struggles for territorial control), (2) Critical geopolitics (identity issues and discourse analysis), and (3) Geoeconomics (competition over flows, networks, resources)." },
    { q: "What is a key limitation of classical geopolitics according to the course?", options: ["A. It ignores military power", "B. It focuses too much on non-state actors", "C. It is state-centric and deterministic, poorly suited to hybrid conflicts", "D. It overestimates the role of economic flows"], correct: 2, explanation: "Classical geopolitics is criticized for being state-centric and deterministic, underestimating the role of representations, ideologies, and non-state actors, and being poorly suited to contemporary hybrid conflicts." },
    { q: "In the Tesla Gigafactory Berlin-Brandenburg case, what are the two local geopolitical scales at stake?", options: ["A. German federal level and EU level only", "B. Local (Grunheide: land use, water, environment) and broader European markets (EV flows and investments)", "C. US-China trade relations and NATO military strategy", "D. Brandenburg state politics and United Nations environmental policy"], correct: 1, explanation: "The local scale involves Grunheide (land use, water resources, environmental protection). The broader geoeconomic scale involves European markets supplied by the Gigafactory, where flows of vehicles and investments are impacted." },
    { q: "According to critical geopolitics, what role do media and cultural productions play?", options: ["A. They are irrelevant to geopolitical dynamics", "B. They only serve as entertainment without political impact", "C. They shape geopolitical representations and narratives, fueling geopolitical imagination", "D. They exclusively serve state propaganda"], correct: 2, explanation: "Critical geopolitics holds that media play a role in constructing geopolitical narratives (Dodds, 2007). Films, TV series, video games, and literature fuel geopolitical imagination. Maps and visualizations convey ideological messages." }
];
let current = 0, score = 0, answered = [];
function renderQ() {
    if (current >= questions.length) { showResult(); return; }
    const qd = questions[current];
    document.getElementById('current-q').textContent = current + 1;
    document.getElementById('progress').style.width = ((current + 1) / questions.length * 100) + '%';
    let html = '<div class="question-card"><div class="question-num">Question ' + (current + 1) + '</div>';
    html += '<div class="question-text">' + qd.q + '</div><div class="options">';
    qd.options.forEach((o, i) => {
        html += '<button class="option" onclick="selectOption(' + i + ')" id="opt' + i + '">' + o + '</button>';
    });
    html += '</div><div class="explanation" id="expl">' + qd.explanation + '</div></div>';
    html += '<div class="nav-buttons"><button class="btn btn-next" id="nextBtn" onclick="nextQ()" disabled>Next &rarr;</button></div>';
    document.getElementById('quiz-area').innerHTML = html;
    if (answered[current] !== undefined) { showAnswered(); }
}
function selectOption(idx) {
    if (answered[current] !== undefined) return;
    answered[current] = idx;
    const qd = questions[current];
    document.getElementById('opt' + qd.correct).classList.add('correct');
    if (idx !== qd.correct) { document.getElementById('opt' + idx).classList.add('wrong'); }
    else { score++; }
    document.querySelectorAll('.option').forEach(b => b.disabled = true);
    document.getElementById('expl').style.display = 'block';
    document.getElementById('nextBtn').disabled = false;
    document.getElementById('score').textContent = score;
}
function showAnswered() {
    const qd = questions[current];
    document.getElementById('opt' + qd.correct).classList.add('correct');
    if (answered[current] !== qd.correct) document.getElementById('opt' + answered[current]).classList.add('wrong');
    document.querySelectorAll('.option').forEach(b => b.disabled = true);
    document.getElementById('expl').style.display = 'block';
    document.getElementById('nextBtn').disabled = false;
}
function nextQ() { current++; renderQ(); }
function showResult() {
    document.getElementById('quiz-area').style.display = 'none';
    document.querySelector('.nav-buttons')?.remove();
    const rc = document.getElementById('result-card');
    rc.style.display = 'block';
    document.getElementById('final-score').textContent = score;
    document.getElementById('final-total').textContent = questions.length;
    const pct = score / questions.length;
    document.getElementById('result-msg').textContent = pct >= 0.8 ? 'Excellent! Well done!' : pct >= 0.5 ? 'Good job, keep revising!' : 'Keep studying, you will get there!';
}
function restartQuiz() { current = 0; score = 0; answered = []; document.getElementById('quiz-area').style.display = 'block'; document.getElementById('result-card').style.display = 'none'; document.getElementById('score').textContent = '0'; renderQ(); }
renderQ();
</script>
<script data-goatcounter="https://chaborz.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
