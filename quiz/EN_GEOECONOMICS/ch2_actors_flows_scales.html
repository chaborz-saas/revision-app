    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

<body>
<div class="quiz-container">
    <a href="../../en/index.html" class="back-link">&larr; Back to dashboard</a>
    <div class="quiz-header">
        <div class="matiere">GEOECONOMICS &mdash; QUIZ</div>
        <h1>Chapter 2 &mdash; Actors, Flows, and Scales of Analysis</h1>
    </div>
    <div class="timer" id="timer">&#9201; 00:00</div>
    <div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">10</span> &mdash; Score: <span id="score">0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:10%"></div></div>
    <div id="quiz-area"></div>
    <div class="result-card" id="result-card">
        <div style="font-size:2rem">&#127919;</div>
        <div class="result-score"><span id="final-score">0</span>/10</div>
        <div class="result-time" id="result-time"></div>
        <div class="result-msg" id="result-msg"></div>
        <button class="btn-restart" onclick="restartQuiz()">Restart</button>
        <br><br>
        <a href="../../en/index.html" class="back-link">&larr; Back to dashboard</a>
    </div>
</div>
<script>
const questions = [
    {q:"In the TikTok vs. USA case, what did the PAFACA law (2024) require of ByteDance?", options:["Paying a special technology tax to the US Treasury","Divesting from TikTok or facing a nationwide ban","Sharing its algorithm source code with the FBI","Relocating its headquarters to Washington, D.C."], correct:1, explanation:"The Protecting Americans from Foreign Adversary Controlled Applications Act (PAFACA) required ByteDance to divest from TikTok or face a nationwide ban. In 2025, the Supreme Court upheld the law, prioritizing national security."},
    {q:"In the Foxconn/Apple vs. China case (2023), what types of flows are primarily at stake?", options:["Tourism and cultural exchange flows","Migration and demographic flows","Energy flows and water resources","Material flows (components, iPhones), financial flows, and knowledge flows"], correct:3, explanation:"The Foxconn/Apple case involves material flows (semiconductors, batteries, screens, iPhones), financial flows (taxation, profits, penalties from regulatory actions), and knowledge flows (transfer of manufacturing expertise)."},
    {q:"In the Lukoil vs. Ukraine dispute, why did the conflict escalate into a broader diplomatic issue?", options:["Ukraine used control over energy transit flows through the Druzhba pipeline as strategic leverage during wartime","Lukoil refused to pay any transit fees to Ukraine","Hungary and Slovakia imposed counter-sanctions on Ukraine","The EU decided to increase purchases of Russian oil"], correct:0, explanation:"Ukraine restricted Lukoil's oil transit through the Druzhba pipeline as wartime leverage. Hungary and Slovakia, heavily dependent on Russian crude, protested, escalating a commercial transit issue into a diplomatic dispute."},
    {q:"According to the course, what gives multinational corporations (MNCs) their geoeconomic power?", options:["Their military capabilities and defense contracts","Their ability to print national currencies","Their control over global value chains, location choices, sourcing, and lobbying","Their exclusive relationship with the United Nations"], correct:2, explanation:"MNCs derive geoeconomic power from control over global value chains (Bednarski et al., 2023). They influence geopolitics through their choices of location, sourcing, and lobbying (Flint, 2021)."},
    {q:"Which of the following is TRUE about classical geopolitics according to the course?", options:["It is rooted in 19th-century strategic geography and is State-centric, focusing on borders and armed conflicts","It primarily analyzes non-state actors and cultural identity","It rejects the importance of territorial control","It was developed in the 21st century as a response to globalization"], correct:0, explanation:"Classical geopolitics is rooted in 19th-century strategic geography (Ratzel, Mackinder, Spykman). It is State-centric, focusing on borders, resources, and armed conflicts between States for territorial control."},
    {q:"What is a key limitation of classical geopolitics identified in the course?", options:["It focuses too much on economic flows","It is state-centric and deterministic, poorly suited to contemporary hybrid conflicts","It overestimates the role of non-state actors","It ignores the existence of territorial borders"], correct:1, explanation:"Classical geopolitics is criticized for being state-centric and deterministic (Kuus, 2017), underestimating representations, ideologies, and non-state actors, and being poorly suited to contemporary hybrid conflicts."},
    {q:"In the Tesla Gigafactory Berlin-Brandenburg case, what was the main source of local conflict?", options:["Disputes over German labor laws","Competition with Chinese EV manufacturers","Disagreements about Tesla's stock price","Environmental opposition to deforestation and water consumption in Grunheide"], correct:3, explanation:"Environmental activist groups opposed the Gigafactory expansion in Grunheide due to deforestation and water consumption concerns. They protested, attempted site intrusions, and even claimed responsibility for sabotage disrupting electricity supply."},
    {q:"According to critical geopolitics, what role do media and cultural productions play?", options:["They are irrelevant to geopolitical dynamics","They only serve state propaganda purposes","They shape geopolitical representations and narratives, fueling geopolitical imagination through films, TV, and literature","They exclusively provide neutral factual information"], correct:2, explanation:"Critical geopolitics holds that media construct geopolitical narratives (Dodds, 2007). Films, TV series, video games, and literature fuel geopolitical imagination. Maps and visualizations convey ideological messages."},
    {q:"In the Airbnb vs. New York City case (2023), what did Local Law 18 introduce?", options:["Strict registration requirements for short-term rentals, significantly reducing Airbnb listings","A complete ban on all forms of tourism accommodation","Tax exemptions for Airbnb hosts in Manhattan","Mandatory hotel partnerships for all platform-based rentals"], correct:0, explanation:"NYC implemented Local Law 18 in 2023, introducing strict registration requirements for short-term rentals. This significantly reduced Airbnb listings and created a test case for regulating the platform economy at the local level."},
    {q:"According to the course, how is power measured in a geoeconomic context?", options:["Exclusively by the size of a country's military","By the ability to influence global norms, flows, and networks","Only by GDP per capita","By the number of embassies a country maintains"], correct:1, explanation:"In a geoeconomic context, power is measured by the ability to influence global norms (Kuus, 2017). It includes economic, normative, and technological influence (Flint, 2021), and relies on networks like cables, roads, and logistical platforms."}
];
let current = 0, score = 0, answered = false, startTime = Date.now(), timerInterval;
function startTimer() { timerInterval = setInterval(() => { const elapsed = Math.floor((Date.now() - startTime) / 1000); const m = String(Math.floor(elapsed / 60)).padStart(2, '0'); const s = String(elapsed % 60).padStart(2, '0'); document.getElementById('timer').textContent = '\u23F1 ' + m + ':' + s; }, 1000); }
function shuffleOptions(q) { const indices = q.options.map((_, i) => i); for (let i = indices.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [indices[i], indices[j]] = [indices[j], indices[i]]; } const shuffled = indices.map(i => q.options[i]); const newCorrect = indices.indexOf(q.correct); return { ...q, options: shuffled, correct: newCorrect }; }
function renderQ() { const q = shuffleOptions(questions[current]); questions[current]._shuffled = q; document.getElementById('current-q').textContent = current + 1; document.getElementById('total-q').textContent = questions.length; document.getElementById('score').textContent = score; document.getElementById('progress').style.width = ((current + 1) / questions.length * 100) + '%'; const letters = ['A', 'B', 'C', 'D']; document.getElementById('quiz-area').innerHTML = '<div class="question-card"><div class="question-num">Question ' + (current + 1) + ' / ' + questions.length + '</div><div class="question-text">' + q.q + '</div><div class="options">' + q.options.map((opt, i) => '<button class="option" onclick="selectOption(' + i + ')" id="opt' + i + '">' + letters[i] + '. ' + opt + '</button>').join('') + '</div><div class="explanation" id="explanation">' + q.explanation + '</div></div><div class="nav-buttons"><div></div><button class="btn btn-next" id="btn-next" onclick="nextQ()" disabled>Next &rarr;</button></div>'; answered = false; }
function selectOption(idx) { if (answered) return; answered = true; const q = questions[current]._shuffled; document.querySelectorAll('.option').forEach(b => b.disabled = true); if (idx === q.correct) { document.getElementById('opt' + idx).classList.add('correct'); score++; } else { document.getElementById('opt' + idx).classList.add('wrong'); document.getElementById('opt' + q.correct).classList.add('correct'); } document.getElementById('explanation').style.display = 'block'; document.getElementById('btn-next').disabled = false; document.getElementById('score').textContent = score; }
function nextQ() { if (current < questions.length - 1) { current++; renderQ(); } else { showResult(); } }
function showResult() { clearInterval(timerInterval); const elapsed = Math.floor((Date.now() - startTime) / 1000); const m = Math.floor(elapsed / 60); const s = elapsed % 60; document.getElementById('quiz-area').innerHTML = ''; const rc = document.getElementById('result-card'); rc.style.display = 'block'; document.getElementById('final-score').textContent = score; document.getElementById('result-time').textContent = '\u23F1 Time: ' + m + 'min ' + s + 's'; const pct = score / questions.length; document.getElementById('result-msg').textContent = pct >= 0.9 ? 'Outstanding! You truly mastered this chapter.' : pct >= 0.7 ? 'Good job! A bit more review and you will ace it.' : pct >= 0.5 ? 'Not bad, but review the summary to strengthen weak areas.' : 'Keep studying! Read the summary and try again.'; }
function restartQuiz() { current = 0; score = 0; answered = false; startTime = Date.now(); document.getElementById('result-card').style.display = 'none'; startTimer(); renderQ(); }
startTimer(); renderQ();
</script>
