<body>
<div class="quiz-container">

    </div>
    <div class="timer" id="timer">&#9201; 00:00</div>
    <div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">10</span> &mdash; Score: <span id="score">0</span></div>

        <div class="result-score"><span id="final-score">0</span>/10</div>
        <div class="result-time" id="result-time"></div>
        <div class="result-msg" id="result-msg"></div>
        <button class="btn-restart" onclick="restartQuiz()">Restart</button>

        <a href="../../en/index.html" class="back-link">&larr; Back to dashboard</a>

</div>
<script>
const questions = [
    {q:"According to Kobrin (2015), how have transnational corporations (TNCs) evolved in the geoeconomic arena?", options:["They are no longer mere economic agents; they influence geopolitics through their strategic decisions","They have become entirely subordinate to State policies","They have abandoned international markets to focus on domestic production","They only operate in countries with stable governments"], correct:0, explanation:"Kobrin (2015) argues that TNCs are no longer mere economic agents; they influence geopolitics. Their strategic decisions have repercussions on power relations among States (Belhoste & Dimitrova, 2023)."},
    {q:"What is the key challenge for companies in a multipolar world?", options:["Finding a single global regulatory framework to follow","Avoiding all international trade entirely","Facing competing norms, sanctions regimes, and political pressures from different states simultaneously","Focusing exclusively on domestic markets to avoid risk"], correct:2, explanation:"In a multipolar world, companies face competing norms, sanctions regimes, and political pressures from different states. A single investment or sourcing decision can place a company in the crossfire of rival geopolitical blocs."},
    {q:"What determines a multinational's normative power according to the course?", options:["Only its number of employees worldwide","Its size, sector, and lobbying capacity","Its ability to deploy military forces","The number of countries where it has offices"], correct:1, explanation:"A multinational's normative power depends on its size, sector, and lobbying capacity (Tamimi, 2017). Some multinationals influence the rules of the international game and contribute to the construction of standards in ecological or digital matters."},
    {q:"A company concentrates all its semiconductor production in a single country. According to the course, this creates:", options:["An optimal efficiency arrangement with no downsides","Greater bargaining power with all trading partners","A strong diversification strategy","A single point of failure that rivals can exploit, making the company vulnerable to geopolitical shocks"], correct:3, explanation:"The more interconnected a company's value chain, the more exposed it is to geopolitical shocks. Concentration of production in a single country creates a single point of failure that rivals can exploit."},
    {q:"Which of the following is NOT one of the four strategies for managing geopolitical risk identified in the course?", options:["Military deterrence against rival states","Scenario planning and risk mapping","Contractual mechanisms including force majeure clauses","Geographic diversification of production sites"], correct:0, explanation:"The four strategies are: scenario planning, contractual mechanisms (force majeure clauses, risk-sharing), geographic diversification, and enhanced dialogue with governments and institutions. Military deterrence is a State strategy, not a corporate one."},
    {q:"In Step 2 of the geoeconomic diagnostic (Analyze Stakeholders), what must be assessed?", options:["Only the competitor's marketing campaigns","Only the company's internal financial performance","The mutual dependence between the company and each stakeholder, plus stakeholder stability","Only the environmental impact of the stakeholder"], correct:2, explanation:"Step 2 requires analyzing the company's dependence on the stakeholder, the stakeholder's dependence on the company, and the stakeholder's stability (market position, financial situation, government stability, etc.)."},
    {q:"What is the purpose of Step 5 (Visual Synthesis) in the geoeconomic diagnostic?", options:["Creating a financial balance sheet for investors","Creating a map or diagram showing territories, conflicts, actors with power levers, and flows as a visual summary","Writing a legal contract for international trade","Developing a marketing campaign for new markets"], correct:1, explanation:"Step 5 involves creating a diagram or map as a visual summary showing territories where conflicts occur, internal actors with power levers, flows involved, and if space allows, external actors and related conflicts."},
    {q:"In the six-step data reliability evaluation, which step involves asking whether the information can be triangulated with other sources?", options:["Step 1: The source","Step 2: The author","Step 4: Our biases","Step 5: External validations"], correct:3, explanation:"Step 5 (External validations) asks what the information can be triangulated with. The six steps are: (1) source reliability, (2) author credibility, (3) date/currency, (4) our biases, (5) external validations, (6) an accessible expert."},
    {q:"A peer-reviewed article in a top-ranked journal by established academics would score how on the reliability framework?", options:["High reliability, as it meets criteria for source, author, and external validation","Low reliability, because academic sources are always biased","Medium reliability, as only government reports are fully reliable","It cannot be evaluated using this framework"], correct:0, explanation:"According to the course, a peer-reviewed article in a top-ranked journal by established academics with cross-validations from other references scores high on reliability, meeting criteria for source (peer-reviewed), author (established), and validation."},
    {q:"According to the course, what characterizes geopolitical risks that companies must manage?", options:["They are predictable and follow regular patterns","They only affect companies in the defense sector","They are both highly unpredictable and intense, requiring scenario planning and diversification","They can be fully eliminated through insurance contracts"], correct:2, explanation:"Geopolitical risks are both highly unpredictable and intense (De Villa et al., 2015). Companies must consider the resilience of their value chains and use strategies like scenario planning and geographic diversification to manage these risks."}
];
let current = 0, score = 0, answered = false, startTime = Date.now(), timerInterval;
function startTimer() { timerInterval = setInterval(() => { const elapsed = Math.floor((Date.now() - startTime) / 1000); const m = String(Math.floor(elapsed / 60)).padStart(2, '0'); const s = String(elapsed % 60).padStart(2, '0'); document.getElementById('timer').textContent = '\u23F1 ' + m + ':' + s; }, 1000); }
function shuffleOptions(q) { const indices = q.options.map((_, i) => i); for (let i = indices.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [indices[i], indices[j]] = [indices[j], indices[i]]; } const shuffled = indices.map(i => q.options[i]); const newCorrect = indices.indexOf(q.correct); return { ...q, options: shuffled, correct: newCorrect }; }
function renderQ() { const q = shuffleOptions(questions[current]); questions[current]._shuffled = q; document.getElementById('current-q').textContent = current + 1; document.getElementById('total-q').textContent = questions.length; document.getElementById('score').textContent = score; document.getElementById('progress').style.width = ((current + 1) / questions.length * 100) + '%'; const letters = ['A', 'B', 'C', 'D']; document.getElementById('quiz-area').innerHTML = '<div class="question-card"><div class="question-num">Question ' + (current + 1) + ' / ' + questions.length + '</div><div class="question-text">' + q.q + '</div><div class="options">' + q.options.map((opt, i) => '<button class="option" onclick="selectOption(' + i + ')" id="opt' + i + '">' + letters[i] + '. ' + opt + '</button>').join('') + '</div><div class="explanation" id="explanation">' + q.explanation + '</div></div><div class="nav-buttons"><div></div><button class="btn btn-next" id="btn-next" onclick="nextQ()" disabled>Next &rarr;</button></div>'; answered = false; }
function selectOption(idx) { if (answered) return; answered = true; const q = questions[current]._shuffled; document.querySelectorAll('.option').forEach(b => b.disabled = true); if (idx === q.correct) { document.getElementById('opt' + idx).classList.add('correct'); score++; } else { document.getElementById('opt' + idx).classList.add('wrong'); document.getElementById('opt' + q.correct).classList.add('correct'); } document.getElementById('explanation').style.display = 'block'; document.getElementById('btn-next').disabled = false; document.getElementById('score').textContent = score; }
function nextQ() { if (current < questions.length - 1) { current++; renderQ(); } else { showResult(); } }
function showResult() { clearInterval(timerInterval); const elapsed = Math.floor((Date.now() - startTime) / 1000); const m = Math.floor(elapsed / 60); const s = elapsed % 60; document.getElementById('quiz-area').innerHTML = ''; const rc = document.getElementById('result-card'); rc.style.display = 'block'; document.getElementById('final-score').textContent = score; document.getElementById('result-time').textContent = '\u23F1 Time: ' + m + 'min ' + s + 's'; const pct = score / questions.length; document.getElementById('result-msg').textContent = pct >= 0.9 ? 'Outstanding! You truly mastered this chapter.' : pct >= 0.7 ? 'Good job! A bit more review and you will ace it.' : pct >= 0.5 ? 'Not bad, but review the summary to strengthen weak areas.' : 'Keep studying! Read the summary and try again.'; }
function restartQuiz() { current = 0; score = 0; answered = false; startTime = Date.now(); document.getElementById('result-card').style.display = 'none'; startTimer(); renderQ(); }
startTimer(); renderQ();
</script>
