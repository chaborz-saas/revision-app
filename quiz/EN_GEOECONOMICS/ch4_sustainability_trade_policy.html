</div>
<script>
const questions = [
    {q:"According to the course, how does climate change affect geopolitical tensions?", options:["It reduces tensions by encouraging international cooperation","It has no measurable impact on geopolitics","It only affects small island nations","It acts as a threat multiplier, intensifying rivalries over scarce resources like water, minerals, and energy"], correct:3, explanation:"Climate change acts as a 'threat multiplier' for geopolitical tensions. Resource scarcity (water, minerals, energy) intensifies rivalries and creates new geoeconomic stakes that companies must factor into their strategic planning."},
    {q:"What is territorial acceptability as defined in the course?", options:["A government's legal permit allowing companies to operate","The degree to which a company's presence and activities are accepted by local community, institutions, and stakeholders","A tax exemption granted to companies investing in rural areas","The process of acquiring territory through hostile takeover"], correct:1, explanation:"Territorial acceptability is the degree to which a company's presence and activities are accepted by local community, institutions, and stakeholders. Without it, companies face protests, regulatory obstacles, and reputational damage."},
    {q:"What are gray zones in geoeconomic terms?", options:["Areas with weak State governance where companies face risks of corruption, violence, and exploitation","Economic free zones with no taxation","Disputed maritime boundaries between neighboring states","Territories where trade tariffs are temporarily suspended"], correct:0, explanation:"Gray zones are territories with weak State governance where companies operate alongside risks of corruption, violence, and exploitation (De Villa et al., 2015). Companies must adopt robust ethical policies in such areas."},
    {q:"Which of the following is NOT a critique of free trade presented in the course?", options:["It may lead to substantial sectoral losses in open economies","It can exacerbate social inequalities","It eliminates all forms of international competition","It may create excessive dependence on foreign suppliers"], correct:2, explanation:"Free trade actually fosters international competition. The critiques listed in the course are: sectoral losses, exacerbated inequalities, excessive dependence on foreign suppliers, and failure to account for environmental or social externalities."},
    {q:"What is the infant industry argument for protectionism?", options:["Permanently banning all foreign imports in every sector","Subsidizing only industries run by young entrepreneurs","Taxing industries that employ workers under age 25","Temporarily protecting a developing sector to allow it to become competitive before opening to international competition"], correct:3, explanation:"The infant industry argument justifies temporarily protecting a developing sector to allow it to become competitive before opening it to international competition. It is one of the main economic justifications for protectionism."},
    {q:"When were the UN Sustainable Development Goals (SDGs) adopted, and how many goals do they comprise?", options:["In 2015, comprising 17 goals and 169 targets as part of the 2030 Agenda","In 2000, comprising 8 goals as part of the Millennium Development Goals","In 2020, comprising 20 goals in response to the COVID-19 pandemic","In 2010, comprising 12 goals at the Copenhagen Climate Summit"], correct:0, explanation:"The SDGs were adopted in 2015 by all UN Member States as part of the 2030 Agenda for Sustainable Development. They comprise 17 goals and 169 targets addressing poverty, inequality, climate change, environmental degradation, peace, and justice."},
    {q:"Which four SDGs does the course specifically recommend focusing on for exam purposes?", options:["SDGs 1, 3, 4, 5 (Poverty, Health, Education, Gender)","SDGs 2, 6, 7, 10 (Zero Hunger, Clean Water, Affordable Energy, Reduced Inequalities)","SDGs 8, 9, 11, 12 (Work, Industry, Cities, Consumption)","SDGs 13, 14, 15, 16 (Climate, Oceans, Land, Peace)"], correct:1, explanation:"The course specifies focusing on SDG 2 (Zero Hunger), SDG 6 (Clean Water and Sanitation), SDG 7 (Affordable and Clean Energy), and SDG 10 (Reduced Inequalities) for exam purposes."},
    {q:"What is the fundamental trade policy dilemma according to the course?", options:["Whether to trade exclusively with allies or with all nations","Whether to invest in manufacturing or services sectors","A complex political choice between efficiency, equity, and sovereignty with no universally optimal policy","Whether to use tariffs or quotas as the primary trade barrier"], correct:2, explanation:"Trade policies represent complex political choices between efficiency (free trade maximizes output), equity (distributional effects on workers and regions), and sovereignty (national control over strategic sectors). There is no universally optimal policy."},
    {q:"According to the course, what is dumping in international trade?", options:["Exporting goods with excessive packaging waste","Imposing tariffs above 50% on foreign imports","Selling below cost to destroy foreign competitors, which is considered an unfair trade practice","Donating surplus goods to developing countries"], correct:3, explanation:"Dumping is defined in the course as selling below cost to destroy foreign competitors. It is considered an unfair trade practice that justifies protectionist countermeasures as a response."},
    {q:"How should sustainability be integrated into geoeconomic recommendations according to the course?", options:["By checking whether recommendations align with free trade or protectionism, and whether they align with the SDGs","By ignoring environmental concerns and focusing only on profit maximization","By automatically choosing the most protectionist option available","By delegating all sustainability decisions to the United Nations"], correct:0, explanation:"The course specifies two key questions: (1) Does dialogue with governments align with free trade or protectionist policies? (2) Do all recommendations align with the SDGs? This ensures geoeconomic strategies incorporate sustainability."}
];
let current = 0, score = 0, answered = false, startTime = Date.now(), timerInterval;
function startTimer() { timerInterval = setInterval(() => { const elapsed = Math.floor((Date.now() - startTime) / 1000); const m = String(Math.floor(elapsed / 60)).padStart(2, '0'); const s = String(elapsed % 60).padStart(2, '0'); document.getElementById('timer').textContent = '\u23F1 ' + m + ':' + s; }, 1000); }
function shuffleOptions(q) { const indices = q.options.map((_, i) => i); for (let i = indices.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [indices[i], indices[j]] = [indices[j], indices[i]]; } const shuffled = indices.map(i => q.options[i]); const newCorrect = indices.indexOf(q.correct); return { ...q, options: shuffled, correct: newCorrect }; }
function renderQ() { const q = shuffleOptions(questions[current]); questions[current]._shuffled = q; document.getElementById('current-q').textContent = current + 1; document.getElementById('total-q').textContent = questions.length; document.getElementById('score').textContent = score; document.getElementById('progress').style.width = ((current + 1) / questions.length * 100) + '%'; const letters = ['A', 'B', 'C', 'D']; document.getElementById('quiz-area').innerHTML = '<div class="question-card"><div class="question-num">Question ' + (current + 1) + ' / ' + questions.length + '</div><div class="question-text">' + q.q + '</div><div class="options">' + q.options.map((opt, i) => '<button class="option" onclick="selectOption(' + i + ')" id="opt' + i + '">' + letters[i] + '. ' + opt + '</button>').join('') + '</div><div class="explanation" id="explanation">' + q.explanation + '</div></div><div class="nav-buttons"><div></div><button class="btn btn-next" id="btn-next" onclick="nextQ()" disabled>Next &rarr;</button></div>'; answered = false; }
function selectOption(idx) { if (answered) return; answered = true; const q = questions[current]._shuffled; document.querySelectorAll('.option').forEach(b => b.disabled = true); if (idx === q.correct) { document.getElementById('opt' + idx).classList.add('correct'); score++; } else { document.getElementById('opt' + idx).classList.add('wrong'); document.getElementById('opt' + q.correct).classList.add('correct'); } document.getElementById('explanation').style.display = 'block'; document.getElementById('btn-next').disabled = false; document.getElementById('score').textContent = score; }
function nextQ() { if (current < questions.length - 1) { current++; renderQ(); } else { showResult(); } }
function showResult() { clearInterval(timerInterval); const elapsed = Math.floor((Date.now() - startTime) / 1000); const m = Math.floor(elapsed / 60); const s = elapsed % 60; document.getElementById('quiz-area').innerHTML = ''; const rc = document.getElementById('result-card'); rc.style.display = 'block'; document.getElementById('final-score').textContent = score; document.getElementById('result-time').textContent = '\u23F1 Time: ' + m + 'min ' + s + 's'; const pct = score / questions.length; document.getElementById('result-msg').textContent = pct >= 0.9 ? 'Outstanding! You truly mastered this chapter.' : pct >= 0.7 ? 'Good job! A bit more review and you will ace it.' : pct >= 0.5 ? 'Not bad, but review the summary to strengthen weak areas.' : 'Keep studying! Read the summary and try again.'; }
function restartQuiz() { current = 0; score = 0; answered = false; startTime = Date.now(); document.getElementById('result-card').style.display = 'none'; startTimer(); renderQ(); }
startTimer(); renderQ();
</script>
