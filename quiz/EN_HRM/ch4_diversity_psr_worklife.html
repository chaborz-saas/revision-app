<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz — HRM Ch4: Diversity, PSR & Work-Life Balance</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; padding: 1.5rem; }
        .quiz-header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 1.5rem 2rem; border-radius: 16px; margin-bottom: 1.5rem; border-bottom: 3px solid #10b981; }
        .quiz-header .matiere { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #10b981; margin-bottom: 0.3rem; }
        .quiz-header h1 { font-size: 1.3rem; font-weight: 700; color: white; }
        .quiz-container { max-width: 800px; margin: 0 auto; }
        .progress-bar { background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; margin-bottom: 1.5rem; }
        .progress-fill { background: #10b981; height: 100%; border-radius: 10px; transition: width 0.3s; }
        .score-display { text-align: center; font-size: 0.85rem; color: #808090; margin-bottom: 1rem; }
        .timer { text-align: center; font-size: 0.85rem; color: #f59e0b; margin-bottom: 0.5rem; font-weight: 600; }
        .question-card { background: #1a1a2e; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 2rem; margin-bottom: 1rem; }
        .question-num { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #10b981; margin-bottom: 0.8rem; font-weight: 700; }
        .question-text { font-size: 1.05rem; font-weight: 600; color: white; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: grid; gap: 0.6rem; }
        .option { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0.9rem 1.2rem; cursor: pointer; transition: all 0.2s; font-size: 0.92rem; color: #d0d0d8; text-align: left; width: 100%; }
        .option:hover:not(:disabled) { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.4); color: white; }
        .option.correct { background: rgba(16,185,129,0.2); border-color: #10b981; color: #10b981; font-weight: 600; }
        .option.wrong { background: rgba(239,68,68,0.2); border-color: #ef4444; color: #ef4444; }
        .option:disabled { cursor: default; }
        .explanation { background: rgba(16,185,129,0.08); border-left: 3px solid #10b981; padding: 0.8rem 1rem; margin-top: 1rem; border-radius: 0 8px 8px 0; font-size: 0.88rem; color: #6ee7b7; display: none; }
        .nav-buttons { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; gap: 1rem; }
        .btn { padding: 0.7rem 1.5rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-next { background: #10b981; color: white; margin-left: auto; }
        .btn-next:hover { background: #059669; }
        .btn-next:disabled { background: rgba(255,255,255,0.1); color: #606070; cursor: default; }
        .result-card { background: #1a1a2e; border-radius: 16px; padding: 3rem 2rem; text-align: center; display: none; }
        .result-score { font-size: 3.5rem; font-weight: 800; color: #10b981; margin: 1rem 0; }
        .result-msg { font-size: 1.1rem; color: #d0d0d8; margin-bottom: 2rem; }
        .result-time { font-size: 0.9rem; color: #f59e0b; margin-bottom: 1.5rem; }
        .btn-restart { background: #10b981; color: white; padding: 0.8rem 2rem; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; border: none; }
        .back-link { display: inline-block; color: #808090; font-size: 0.8rem; text-decoration: none; margin-bottom: 1rem; }
        .back-link:hover { color: #10b981; }
    </style>
</head>
<body>
<div class="quiz-container">
    <a href="../../en/index.html" class="back-link">&larr; Back to dashboard</a>
    <div class="quiz-header">
        <div class="matiere">HRM FOR MANAGERS &mdash; QUIZ</div>
        <h1>Chapter 4 &mdash; Diversity, PSR &amp; Work-Life Balance</h1>
    </div>
    <div class="timer" id="timer">⏱ 00:00</div>
    <div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">10</span> &mdash; Score: <span id="score">0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:10%"></div></div>
    <div id="quiz-area"></div>
    <div class="result-card" id="result-card">
        <div style="font-size:2rem">&#127919;</div>
        <div class="result-score"><span id="final-score">0</span>/10</div>
        <div class="result-time" id="result-time"></div>
        <div class="result-msg" id="result-msg"></div>
        <button class="btn-restart" onclick="restartQuiz()">Restart</button>
        <br><br>
        <a href="../../en/index.html" class="back-link">&larr; Back to dashboard</a>
    </div>
</div>
<script>
const questions = [
    {q:"According to INSEE (2023), the average salary of men in France is how much higher than that of women?", options:["12.5% higher","17.8% higher","22.2% higher","28.6% higher"], correct:2, explanation:"The average salary of men is 22.2% higher than that of women (INSEE, 2023). Women represent 47% of the active workforce but hold only 34% of managerial positions and 14% of executive roles."},
    {q:"Under the Rixain Law (2021), what percentage of executive positions must be held by women by 2030?", options:["25%","30%","40%","50%"], correct:2, explanation:"The Rixain Law requires at least 30% women in leadership by 2026, increasing to 40% by 2030. Non-compliance can result in penalties of up to 1% of the total wage bill."},
    {q:"Which of the following is NOT a prohibited discrimination criterion listed in the course?", options:["Physical appearance","Educational level","Surname","Banking details"], correct:1, explanation:"Educational level is not listed as a prohibited discrimination criterion. Physical appearance, surname, and banking details are all specifically listed under additional French law criteria for prohibited discrimination."},
    {q:"In DiMaggio and Powell's framework, which type of isomorphism involves top management setting the example for others to follow?", options:["Coercive isomorphism","Normative isomorphism","Mimetic isomorphism","Structural isomorphism"], correct:2, explanation:"Mimetic isomorphism involves imitating successful models. At the macro level, top management sets the example; at the micro level, the manager sets an example for the team. Coercive involves legal obligations, and normative involves cultural norms."},
    {q:"According to the course, bore-out is best defined as:", options:["Physical exhaustion from overwork and emotional demands","An imbalance between perceived demands and resources to cope","Chronic psychological suffering caused by a lack of stimulation at work","Harassment and bullying behaviors in the workplace"], correct:2, explanation:"Bore-out is chronic psychological suffering caused by a lack of stimulation during work activity (INRS, 2016). Burnout involves exhaustion from emotionally demanding work. Work-related stress involves an imbalance between demands and resources."},
    {q:"According to the course statistics, psychosocial risks account for what percentage of sick leaves in large companies?", options:["24%","36%","48%","62%"], correct:2, explanation:"PSRs account for 48% of sick leaves in large companies (AT-MP Barometer, 2018). Other alarming figures include 2.6% of GDP in costs, 400 work-related suicides per year, and 24% of employees in a state of hyper-stress."},
    {q:"The Right to Disconnect was established by which law?", options:["Rixain Law of 2021","Avenir Professionnel Law of 2018","Labor Law of August 8, 2016","El Khomri Law of 2015"], correct:2, explanation:"The Right to Disconnect was established by the Labor Law of August 8, 2016. It aims to protect work-life balance by ensuring employees are not expected to respond to work communications outside working hours."},
    {q:"According to survey data, what percentage of employees consider work-life balance an important or very important issue?", options:["65%","72%","85%","92%"], correct:3, explanation:"92% of employees consider work-life balance important or very important. Yet only 12% are satisfied with their balance, 72% feel they lack time daily, and 60% say their employer does not do much to help."},
    {q:"Research by Johnson, Hekman and Chan (published in Harvard Business Review) found that if there is only one woman in a candidate pool, what happens statistically?", options:["She has a 50% chance of being hired","She is more likely to be hired due to diversity pressure","There is statistically no chance she will be hired","She is hired only if she scores highest on all criteria"], correct:2, explanation:"Research found that if there is only one woman in a candidate pool, there is statistically no chance she will be hired. This highlights the importance of building diverse candidate shortlists."},
    {q:"Which two essential conditions must be met for work-life balance policies to be effective, according to the course?", options:["High salaries and generous leave policies","Employee responsibility/autonomy and employer trust","Strict schedules and clear hierarchies","Union agreements and government subsidies"], correct:1, explanation:"The two essential conditions are that employees must have a sense of responsibility and autonomy, and the employer must trust them. Without these, work-life balance policies cannot function effectively."}
];
let current = 0, score = 0, answered = false, startTime = Date.now(), timerInterval;
function startTimer() { timerInterval = setInterval(() => { const elapsed = Math.floor((Date.now() - startTime) / 1000); const m = String(Math.floor(elapsed / 60)).padStart(2, '0'); const s = String(elapsed % 60).padStart(2, '0'); document.getElementById('timer').textContent = '⏱ ' + m + ':' + s; }, 1000); }
function shuffleOptions(q) { const indices = q.options.map((_, i) => i); for (let i = indices.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [indices[i], indices[j]] = [indices[j], indices[i]]; } const shuffled = indices.map(i => q.options[i]); const newCorrect = indices.indexOf(q.correct); return { ...q, options: shuffled, correct: newCorrect }; }
function renderQ() { const q = shuffleOptions(questions[current]); questions[current]._shuffled = q; document.getElementById('current-q').textContent = current + 1; document.getElementById('total-q').textContent = questions.length; document.getElementById('score').textContent = score; document.getElementById('progress').style.width = ((current + 1) / questions.length * 100) + '%'; const letters = ['A', 'B', 'C', 'D']; document.getElementById('quiz-area').innerHTML = '<div class="question-card"><div class="question-num">Question ' + (current + 1) + ' / ' + questions.length + '</div><div class="question-text">' + q.q + '</div><div class="options">' + q.options.map((opt, i) => '<button class="option" onclick="selectOption(' + i + ')" id="opt' + i + '">' + letters[i] + '. ' + opt + '</button>').join('') + '</div><div class="explanation" id="explanation">' + q.explanation + '</div></div><div class="nav-buttons"><div></div><button class="btn btn-next" id="btn-next" onclick="nextQ()" disabled>Next &rarr;</button></div>'; answered = false; }
function selectOption(idx) { if (answered) return; answered = true; const q = questions[current]._shuffled; document.querySelectorAll('.option').forEach(b => b.disabled = true); if (idx === q.correct) { document.getElementById('opt' + idx).classList.add('correct'); score++; } else { document.getElementById('opt' + idx).classList.add('wrong'); document.getElementById('opt' + q.correct).classList.add('correct'); } document.getElementById('explanation').style.display = 'block'; document.getElementById('btn-next').disabled = false; document.getElementById('score').textContent = score; }
function nextQ() { if (current < questions.length - 1) { current++; renderQ(); } else { showResult(); } }
function showResult() { clearInterval(timerInterval); const elapsed = Math.floor((Date.now() - startTime) / 1000); const m = Math.floor(elapsed / 60); const s = elapsed % 60; document.getElementById('quiz-area').innerHTML = ''; const rc = document.getElementById('result-card'); rc.style.display = 'block'; document.getElementById('final-score').textContent = score; document.getElementById('result-time').textContent = '⏱ Time: ' + m + 'min ' + s + 's'; const pct = score / questions.length; document.getElementById('result-msg').textContent = pct >= 0.9 ? 'Outstanding! You truly mastered this chapter.' : pct >= 0.7 ? 'Good job! A bit more review and you will ace it.' : pct >= 0.5 ? 'Not bad, but review the summary to strengthen weak areas.' : 'Keep studying! Read the summary and try again.'; }
function restartQuiz() { current = 0; score = 0; answered = false; startTime = Date.now(); document.getElementById('result-card').style.display = 'none'; startTimer(); renderQ(); }
startTimer(); renderQ();
</script>

</body>
</html>
