<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Quiz — Performance Management Ch 6: Budgeting</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; padding: 1.5rem; }
        .quiz-header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 1.5rem 2rem; border-radius: 16px; margin-bottom: 1.5rem; border-bottom: 3px solid #10b981; }
        .quiz-header .matiere { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #10b981; margin-bottom: 0.3rem; }
        .quiz-header h1 { font-size: 1.3rem; font-weight: 700; color: white; }
        .quiz-container { max-width: 800px; margin: 0 auto; }
        .progress-bar { background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; margin-bottom: 1.5rem; }
        .progress-fill { background: #10b981; height: 100%; border-radius: 10px; transition: width 0.3s; }
        .score-display { text-align: center; font-size: 0.85rem; color: #808090; margin-bottom: 1rem; }
        .timer { text-align: center; font-size: 0.85rem; color: #f59e0b; margin-bottom: 0.5rem; font-weight: 600; }
        .question-card { background: #1a1a2e; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 2rem; margin-bottom: 1rem; }
        .question-num { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #10b981; margin-bottom: 0.8rem; font-weight: 700; }
        .question-text { font-size: 1.05rem; font-weight: 600; color: white; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: grid; gap: 0.6rem; }
        .option { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0.9rem 1.2rem; cursor: pointer; transition: all 0.2s; font-size: 0.92rem; color: #d0d0d8; text-align: left; width: 100%; }
        .option:hover:not(:disabled) { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.4); color: white; }
        .option.correct { background: rgba(16,185,129,0.2); border-color: #10b981; color: #10b981; font-weight: 600; }
        .option.wrong { background: rgba(239,68,68,0.2); border-color: #ef4444; color: #ef4444; }
        .option:disabled { cursor: default; }
        .explanation { background: rgba(16,185,129,0.08); border-left: 3px solid #10b981; padding: 0.8rem 1rem; margin-top: 1rem; border-radius: 0 8px 8px 0; font-size: 0.88rem; color: #6ee7b7; display: none; }
        .nav-buttons { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; gap: 1rem; }
        .btn { padding: 0.7rem 1.5rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-next { background: #10b981; color: white; margin-left: auto; }
        .btn-next:hover { background: #059669; }
        .btn-next:disabled { background: rgba(255,255,255,0.1); color: #606070; cursor: default; }
        .result-card { background: #1a1a2e; border-radius: 16px; padding: 3rem 2rem; text-align: center; display: none; }
        .result-score { font-size: 3.5rem; font-weight: 800; color: #10b981; margin: 1rem 0; }
        .result-msg { font-size: 1.1rem; color: #d0d0d8; margin-bottom: 2rem; }
        .result-time { font-size: 0.9rem; color: #f59e0b; margin-bottom: 1.5rem; }
        .btn-restart { background: #10b981; color: white; padding: 0.8rem 2rem; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; border: none; }
        .back-link { display: inline-block; color: #808090; font-size: 0.8rem; text-decoration: none; margin-bottom: 1rem; }
        .back-link:hover { color: #10b981; }
    </style>
</head>
<body>
<div class="quiz-container">
    <a href="../../en/index.html" class="back-link">&larr; Back to dashboard</a>
    <div class="quiz-header">
        <div class="matiere">PERFORMANCE MANAGEMENT &mdash; QUIZ</div>
        <h1>Chapter 6 &mdash; Budgeting</h1>
    </div>
    <div class="timer" id="timer">&#9201; 00:00</div>
    <div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">10</span> &mdash; Score: <span id="score">0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:10%"></div></div>
    <div id="quiz-area"></div>
    <div class="result-card" id="result-card">
        <div style="font-size:2rem">&#127919;</div>
        <div class="result-score"><span id="final-score">0</span>/10</div>
        <div class="result-time" id="result-time"></div>
        <div class="result-msg" id="result-msg"></div>
        <button class="btn-restart" onclick="restartQuiz()">Restart</button>
        <br><br>
        <a href="../../en/index.html" class="back-link">&larr; Back to dashboard</a>
    </div>
</div>
<script>
const questions = [
    {q:"What is the key difference between a budget and a forecast?",options:["A budget covers five years while a forecast covers one year","A budget is a plan showing intention to achieve targets; a forecast is a prediction of the future","A forecast is always more detailed than a budget","There is no meaningful difference between the two"],correct:1,explanation:"A budget is a plan showing an intention or determination to achieve targets. A forecast is a prediction of the future state of the environment. Forecasts inform budgets, but they are distinctly different concepts."},
    {q:"Which of the following is NOT a stated purpose of budgets?",options:["Promote forward thinking","Provide a system of authorisation","Motivate performance through targets","Eliminate all business risk"],correct:3,explanation:"The five purposes of budgets are: promote forward thinking, help coordinate the business, motivate performance, provide a system of control (variance analysis), and provide a system of authorisation (spending limits). Eliminating all business risk is not a purpose of budgets."},
    {q:"In the budget-setting process, why should the limiting factor be identified first?",options:["Because it is always the sales budget","Because all other budgets depend on the constraint it imposes","Because it determines the depreciation policy","Because it sets the interest rate for the cash budget"],correct:1,explanation:"A limiting factor (key factor or binding constraint) restricts the business's ability to achieve its objectives. All other budgets depend on this constraint, so the budget for the limiting factor area must be prepared first."},
    {q:"Zero-base budgeting (ZBB) differs from incremental budgeting because ZBB:",options:["Starts from last year's budget and adjusts for known changes","Is simpler and quicker to prepare than incremental budgets","Perpetuates past inefficiencies in the same way","Requires every item of spending to be justified from scratch"],correct:3,explanation:"ZBB starts from zero and requires all spending to be justified. Incremental budgeting starts from the previous period's budget and adjusts for known changes. ZBB is more time-consuming but promotes more efficient use of resources."},
    {q:"A company sells goods on one month's credit. If March sales are \u00a340,000, when will the cash be received?",options:["March","April","May","February"],correct:1,explanation:"With one month's credit terms, cash is received one month after the sale. March sales of \u00a340,000 would be received as cash in April."},
    {q:"Which of the following items should be EXCLUDED from a cash budget?",options:["Purchase of a new van","Payment of wages","Depreciation charges","Quarterly electricity payments"],correct:2,explanation:"Depreciation is NOT a cash flow. It is an accounting charge that allocates the cost of an asset over time but does not involve any actual cash movement. All other items involve real cash payments and must be included in the cash budget."},
    {q:"What is a continual (rolling) budget?",options:["A budget prepared once for a five-year period","A budget that only covers variable costs","A budget that is continually updated so there is always a full planning period ahead","A budget that eliminates the need for variance analysis"],correct:2,explanation:"A continual (rolling) budget is continually updated, ensuring there are always budgets for a full planning period ahead. Unlike periodic budgets prepared for a fixed period, rolling budgets adapt as new information becomes available."},
    {q:"In Activity-Based Budgeting, Danube Ltd calculates 520,000 product weeks at \u00a31.50 each. What is the total activity budget for finished goods stores?",options:["\u00a3520,000","\u00a3680,000","\u00a3780,000","\u00a3850,000"],correct:2,explanation:"Gamma (60,000 units x 2 weeks) + Delta (80,000 units x 5 weeks) = 120,000 + 400,000 = 520,000 product weeks. At \u00a31.50 per product week, the activity budget = 520,000 x \u00a31.50 = \u00a3780,000."},
    {q:"Which of the following is a criticism of conventional budgeting?",options:["It encourages a decentralised management style","It promotes long-term value creation over short-term targets","It can encourage budget gaming and sharp practice among managers","It adapts easily to rapid change"],correct:2,explanation:"Criticisms of conventional budgeting include: cannot deal with rapid change, focuses on short-term financial targets rather than value creation, encourages top-down management, is time-consuming, encourages incremental thinking, and promotes sharp practice (budget gaming) among managers."},
    {q:"Which statement about the Beyond Budgeting approach is TRUE?",options:["It reinforces traditional hierarchical structures","It replaces rolling forecasts with fixed annual budgets","It eliminates the need for any form of financial planning","It devolves decision-making to front-line managers and uses KPIs"],correct:3,explanation:"Beyond Budgeting replaces traditional budgets with rolling forecasts, KPIs (monetary and non-monetary), decentralised decision-making devolved to front-line managers, a network structure, sharing of knowledge, and rewards linked to performance improvement targets."}
];
let current = 0, score = 0, answered = false, startTime = Date.now(), timerInterval;
function startTimer() { timerInterval = setInterval(() => { const elapsed = Math.floor((Date.now() - startTime) / 1000); const m = String(Math.floor(elapsed / 60)).padStart(2, '0'); const s = String(elapsed % 60).padStart(2, '0'); document.getElementById('timer').textContent = '\u23F1 ' + m + ':' + s; }, 1000); }
function shuffleOptions(q) { const indices = q.options.map((_, i) => i); for (let i = indices.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [indices[i], indices[j]] = [indices[j], indices[i]]; } const shuffled = indices.map(i => q.options[i]); const newCorrect = indices.indexOf(q.correct); return { ...q, options: shuffled, correct: newCorrect }; }
function renderQ() { const q = shuffleOptions(questions[current]); questions[current]._shuffled = q; document.getElementById('current-q').textContent = current + 1; document.getElementById('total-q').textContent = questions.length; document.getElementById('score').textContent = score; document.getElementById('progress').style.width = ((current + 1) / questions.length * 100) + '%'; const letters = ['A', 'B', 'C', 'D']; document.getElementById('quiz-area').innerHTML = '<div class="question-card"><div class="question-num">Question ' + (current + 1) + ' / ' + questions.length + '</div><div class="question-text">' + q.q + '</div><div class="options">' + q.options.map((opt, i) => '<button class="option" onclick="selectOption(' + i + ')" id="opt' + i + '">' + letters[i] + '. ' + opt + '</button>').join('') + '</div><div class="explanation" id="explanation">' + q.explanation + '</div></div><div class="nav-buttons"><div></div><button class="btn btn-next" id="btn-next" onclick="nextQ()" disabled>Next &rarr;</button></div>'; answered = false; }
function selectOption(idx) { if (answered) return; answered = true; const q = questions[current]._shuffled; document.querySelectorAll('.option').forEach(b => b.disabled = true); if (idx === q.correct) { document.getElementById('opt' + idx).classList.add('correct'); score++; } else { document.getElementById('opt' + idx).classList.add('wrong'); document.getElementById('opt' + q.correct).classList.add('correct'); } document.getElementById('explanation').style.display = 'block'; document.getElementById('btn-next').disabled = false; document.getElementById('score').textContent = score; }
function nextQ() { if (current < questions.length - 1) { current++; renderQ(); } else { showResult(); } }
function showResult() { clearInterval(timerInterval); const elapsed = Math.floor((Date.now() - startTime) / 1000); const m = Math.floor(elapsed / 60); const s = elapsed % 60; document.getElementById('quiz-area').innerHTML = ''; const rc = document.getElementById('result-card'); rc.style.display = 'block'; document.getElementById('final-score').textContent = score; document.getElementById('result-time').textContent = '\u23F1 Time: ' + m + 'min ' + s + 's'; const pct = score / questions.length; document.getElementById('result-msg').textContent = pct >= 0.9 ? 'Outstanding! You truly mastered this chapter.' : pct >= 0.7 ? 'Good job! A bit more review and you will ace it.' : pct >= 0.5 ? 'Not bad, but review the summary to strengthen weak areas.' : 'Keep studying! Read the summary and try again.'; }
function restartQuiz() { current = 0; score = 0; answered = false; startTime = Date.now(); document.getElementById('result-card').style.display = 'none'; startTimer(); renderQ(); }
startTimer(); renderQ();
</script>
