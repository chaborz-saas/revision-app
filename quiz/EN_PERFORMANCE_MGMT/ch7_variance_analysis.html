    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

<body>
<div class="quiz-container">
    <a href="../../en/index.html" class="back-link">&larr; Back to dashboard</a>
    <div class="quiz-header">
        <div class="matiere">PERFORMANCE MANAGEMENT &mdash; QUIZ</div>
        <h1>Chapter 7 &mdash; Standard Costing and Variance Analysis</h1>
    </div>
    <div class="timer" id="timer">&#9201; 00:00</div>
    <div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">10</span> &mdash; Score: <span id="score">0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:10%"></div></div>
    <div id="quiz-area"></div>
    <div class="result-card" id="result-card">
        <div style="font-size:2rem">&#127919;</div>
        <div class="result-score"><span id="final-score">0</span>/10</div>
        <div class="result-time" id="result-time"></div>
        <div class="result-msg" id="result-msg"></div>
        <button class="btn-restart" onclick="restartQuiz()">Restart</button>
        <br><br>
        <a href="../../en/index.html" class="back-link">&larr; Back to dashboard</a>
    </div>
</div>
<script>
const questions = [
    {q:"Why is it necessary to flex a budget before comparing it with actual results?",options:["To adjust for inflation in the current period","To include depreciation in the cash budget","To make the budget comparable to the actual volume of output achieved","To convert variable costs into fixed costs"],correct:2,explanation:"If actual output differs from budgeted output, a direct comparison is misleading. Flexing adjusts variable revenue and cost items to the actual volume, ensuring a like-for-like comparison and meaningful variance analysis."},
    {q:"When flexing a budget, which of the following remains unchanged?",options:["Sales revenue","Direct materials cost","Direct labour cost","Fixed overheads"],correct:3,explanation:"Fixed overheads remain unchanged regardless of output volume. Only variable items (sales revenue, direct materials, direct labour) are adjusted proportionally to the actual output level. Fixed costs do not change with volume by definition."},
    {q:"Baxter Ltd budgeted 1,000 units at \u00a310 each. Actual sales were 900 units generating \u00a392,000. What is the sales price variance?",options:["\u00a34,000 Adverse","\u00a32,000 Favourable","\u00a38,000 Adverse","\u00a310,000 Favourable"],correct:1,explanation:"Sales price variance = Actual revenue - (Actual units x Budget price) = \u00a392,000 - (900 x \u00a310) = \u00a392,000 - \u00a390,000 = \u00a32,000 Favourable. The company achieved a higher price per unit than budgeted."},
    {q:"Standard material cost is 40m per unit at \u00a31/m. Actual output of 900 units used 37,000m costing \u00a336,900. What is the materials usage variance?",options:["\u00a3100 Favourable","\u00a31,000 Adverse","\u00a3900 Favourable","\u00a31,000 Favourable"],correct:1,explanation:"Standard qty for 900 units = 900 x 40 = 36,000m. Actual = 37,000m. Difference = 1,000m excess. Usage variance = (36,000 - 37,000) x \u00a31 = \u00a31,000 Adverse (used more material than standard allows)."},
    {q:"A labour efficiency variance is favourable when:",options:["Workers are paid more than the standard hourly rate","Actual hours worked exceed the standard hours for actual output","Actual hours are fewer than the standard hours allowed for actual output","The original budget overestimated fixed overhead costs"],correct:2,explanation:"Efficiency variance = (Standard hours - Actual hours) x Standard rate. When actual hours are fewer than standard hours, workers completed the job faster than expected, producing a favourable variance."},
    {q:"Which of the following is NOT a possible cause of an adverse materials price variance?",options:["Poor buying performance by the purchasing department","Using higher quality material than standard","General market price increases not anticipated in the budget","Workers using less material than the standard quantity"],correct:3,explanation:"Workers using less material relates to the usage variance, not the price variance. Adverse materials price variance causes include poor negotiation, higher quality purchases, and unexpected market price increases."},
    {q:"What is the fixed overhead spending variance formula?",options:["Budgeted fixed overheads minus actual fixed overheads","Flexed budget overheads minus actual fixed overheads","Actual output times standard overhead rate","Standard hours times actual overhead rate"],correct:0,explanation:"Fixed overhead spending variance = Budgeted fixed overheads - Actual fixed overheads. It is simply the difference between what was planned and what was actually spent. Fixed overheads are NOT flexed because they do not change with volume."},
    {q:"What are compensating variances?",options:["Variances that always sum to zero across all categories","Linked favourable and adverse variances that offset each other","Variances caused exclusively by changes in fixed costs","Variances that only appear in service industries"],correct:1,explanation:"Compensating variances are linked favourable and adverse variances that offset each other. For example, buying cheaper materials (favourable price) may lead to more waste (adverse usage). These should be examined carefully rather than simply netted off."},
    {q:"In the Baxter May example, budgeted profit was \u00a320,000 and actual profit was \u00a316,900. Which statement is TRUE?",options:["Net favourable variances were \u00a32,900 and net adverse variances were \u00a36,000","All variances were adverse, totalling \u00a33,100","The sales volume variance was favourable","Fixed overhead spending was exactly on budget"],correct:0,explanation:"Favourable variances totalled \u00a32,900 (sales price \u00a32,000 + materials price \u00a3100 + labour efficiency \u00a3800). Adverse variances totalled \u00a36,000 (sales volume \u00a34,000 + materials usage \u00a31,000 + labour rate \u00a3300 + fixed OH \u00a3700). Net: \u00a320,000 + \u00a32,900 - \u00a36,000 = \u00a316,900."},
    {q:"Which type of standard assumes perfect conditions with no inefficiency?",options:["Practical standards","Ideal standards","Historical standards","Flexible standards"],correct:1,explanation:"Ideal standards assume perfect, flawless conditions with no waste or downtime. Practical standards are achievable but challenging, allowing for normal levels of inefficiency. Practical standards are generally preferred for motivation purposes."}
];
let current = 0, score = 0, answered = false, startTime = Date.now(), timerInterval;
function startTimer() { timerInterval = setInterval(() => { const elapsed = Math.floor((Date.now() - startTime) / 1000); const m = String(Math.floor(elapsed / 60)).padStart(2, '0'); const s = String(elapsed % 60).padStart(2, '0'); document.getElementById('timer').textContent = '\u23F1 ' + m + ':' + s; }, 1000); }
function shuffleOptions(q) { const indices = q.options.map((_, i) => i); for (let i = indices.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [indices[i], indices[j]] = [indices[j], indices[i]]; } const shuffled = indices.map(i => q.options[i]); const newCorrect = indices.indexOf(q.correct); return { ...q, options: shuffled, correct: newCorrect }; }
function renderQ() { const q = shuffleOptions(questions[current]); questions[current]._shuffled = q; document.getElementById('current-q').textContent = current + 1; document.getElementById('total-q').textContent = questions.length; document.getElementById('score').textContent = score; document.getElementById('progress').style.width = ((current + 1) / questions.length * 100) + '%'; const letters = ['A', 'B', 'C', 'D']; document.getElementById('quiz-area').innerHTML = '<div class="question-card"><div class="question-num">Question ' + (current + 1) + ' / ' + questions.length + '</div><div class="question-text">' + q.q + '</div><div class="options">' + q.options.map((opt, i) => '<button class="option" onclick="selectOption(' + i + ')" id="opt' + i + '">' + letters[i] + '. ' + opt + '</button>').join('') + '</div><div class="explanation" id="explanation">' + q.explanation + '</div></div><div class="nav-buttons"><div></div><button class="btn btn-next" id="btn-next" onclick="nextQ()" disabled>Next &rarr;</button></div>'; answered = false; }
function selectOption(idx) { if (answered) return; answered = true; const q = questions[current]._shuffled; document.querySelectorAll('.option').forEach(b => b.disabled = true); if (idx === q.correct) { document.getElementById('opt' + idx).classList.add('correct'); score++; } else { document.getElementById('opt' + idx).classList.add('wrong'); document.getElementById('opt' + q.correct).classList.add('correct'); } document.getElementById('explanation').style.display = 'block'; document.getElementById('btn-next').disabled = false; document.getElementById('score').textContent = score; }
function nextQ() { if (current < questions.length - 1) { current++; renderQ(); } else { showResult(); } }
function showResult() { clearInterval(timerInterval); const elapsed = Math.floor((Date.now() - startTime) / 1000); const m = Math.floor(elapsed / 60); const s = elapsed % 60; document.getElementById('quiz-area').innerHTML = ''; const rc = document.getElementById('result-card'); rc.style.display = 'block'; document.getElementById('final-score').textContent = score; document.getElementById('result-time').textContent = '\u23F1 Time: ' + m + 'min ' + s + 's'; const pct = score / questions.length; document.getElementById('result-msg').textContent = pct >= 0.9 ? 'Outstanding! You truly mastered this chapter.' : pct >= 0.7 ? 'Good job! A bit more review and you will ace it.' : pct >= 0.5 ? 'Not bad, but review the summary to strengthen weak areas.' : 'Keep studying! Read the summary and try again.'; }
function restartQuiz() { current = 0; score = 0; answered = false; startTime = Date.now(); document.getElementById('result-card').style.display = 'none'; startTimer(); renderQ(); }
startTimer(); renderQ();
</script>
