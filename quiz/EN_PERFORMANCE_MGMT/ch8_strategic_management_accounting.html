    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }

<body>
<div class="quiz-container">
    <a href="../../en/index.html" class="back-link">&larr; Back to dashboard</a>
    <div class="quiz-header">
        <div class="matiere">PERFORMANCE MANAGEMENT &mdash; QUIZ</div>
        <h1>Chapter 8 &mdash; Strategic Management Accounting, Divisionalisation &amp; Transfer Pricing</h1>
    </div>
    <div class="timer" id="timer">&#9201; 00:00</div>
    <div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">10</span> &mdash; Score: <span id="score">0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:10%"></div></div>
    <div id="quiz-area"></div>
    <div class="result-card" id="result-card">
        <div style="font-size:2rem">&#127919;</div>
        <div class="result-score"><span id="final-score">0</span>/10</div>
        <div class="result-time" id="result-time"></div>
        <div class="result-msg" id="result-msg"></div>
        <button class="btn-restart" onclick="restartQuiz()">Restart</button>
        <br><br>
        <a href="../../en/index.html" class="back-link">&larr; Back to dashboard</a>
    </div>
</div>
<script>
const questions = [
    {q:"What distinguishes Strategic Management Accounting (SMA) from conventional management accounting?",options:["It focuses exclusively on internal cost reduction","It is outward-looking and focused on outperforming competition","It only deals with budgeting and variance analysis","It ignores strategic objectives and long-term planning"],correct:1,explanation:"SMA is outward-looking (considering external factors), concerned with outperforming competition, and focused on monitoring progress towards strategic objectives. This contrasts with conventional management accounting which tends to be inward-looking."},
    {q:"Which of the following is NOT one of the four balanced scorecard perspectives?",options:["Financial","Competitor","Internal Business Processes","Learning and Growth"],correct:1,explanation:"The four perspectives of the balanced scorecard are: Financial, Customer, Internal Business Processes, and Learning & Growth. Competitor is not a BSC perspective, though competitor analysis is a separate part of SMA."},
    {q:"In the EVA formula EVA = NOPAT - (R x C), what does R represent?",options:["Revenue growth rate","Restructuring cost ratio","The required rate of return from investors (cost of capital)","Return on investment for the division"],correct:2,explanation:"In the EVA formula, R is the required rate of return from investors, also known as the cost of capital. It represents the minimum return that investors expect on the capital they have invested in the business."},
    {q:"Peverell plc has adjusted NOPAT of \u00a362.4m, capital invested of \u00a3150m, and a cost of capital of 12%. What is its EVA?",options:["\u00a344.4m","\u00a362.4m","\u00a318.0m","\u00a380.4m"],correct:0,explanation:"EVA = NOPAT - (R x C) = \u00a362.4m - (12% x \u00a3150m) = \u00a362.4m - \u00a318.0m = \u00a344.4m. A positive EVA means the business is generating returns that exceed the cost of capital required by investors."},
    {q:"What is penetration pricing?",options:["Setting the highest possible initial price for a new product","Pricing at marginal cost to break even","Pricing a new product low to gain market share, then raising the price once established","Setting price equal to the full cost plus a fixed profit margin"],correct:2,explanation:"Penetration pricing involves selling a new product at a low price to capture market share and discourage competitors. Once established, the price is raised. This contrasts with price skimming, which starts high and gradually lowers."},
    {q:"A division has profit of \u00a325,000 and investment of \u00a3150,000. The cost of capital is 20%. What is its Residual Income?",options:["\u00a325,000","\u00a35,000","-\u00a35,000","\u00a355,000"],correct:2,explanation:"RI = Divisional Profit - (Investment x Cost of Capital) = \u00a325,000 - (20% x \u00a3150,000) = \u00a325,000 - \u00a330,000 = -\u00a35,000. A negative RI means the division is not generating sufficient returns to cover the cost of capital invested."},
    {q:"Why might ROI lead a divisional manager to reject an investment that benefits the business as a whole?",options:["ROI always underestimates divisional profit","The new project might lower the division's existing ROI even though it exceeds the cost of capital","ROI cannot be calculated for investment centres","ROI ignores all variable costs in the calculation"],correct:1,explanation:"If a division has a high current ROI (e.g., 25%), a new project yielding 18% would lower the overall divisional ROI even though 18% exceeds the cost of capital (e.g., 15%). The manager rejects it to protect their performance metric, which is sub-optimal for the whole business."},
    {q:"When a selling division has spare capacity, what is the ideal minimum transfer price?",options:["The market price of the product","The full cost plus a loading for profit","The variable cost of production","A negotiated price set by head office"],correct:2,explanation:"When a division has spare capacity, the opportunity cost of the internal transfer equals the variable cost of production, since no external sales are being forgone. Therefore, the minimum acceptable transfer price is the variable cost."},
    {q:"Which of the following is NOT a problem with using accounting profit to measure performance?",options:["It is measured over a relatively short period","It does not account for all capital costs","Risk is ignored in the calculation","It always overstates true economic profit"],correct:3,explanation:"Problems with accounting profit include: measured over short periods (usually one year), risk is ignored, does not account for all capital costs, and can vary according to accounting policies. It does not always overstate economic profit - it can go either way depending on circumstances."},
    {q:"In the balanced scorecard, what is the cause-and-effect relationship between the four perspectives?",options:["Financial drives customer which drives internal processes which drives learning","Learning and growth improves internal processes which improves customer satisfaction which drives financial performance","Customer drives financial which drives learning which drives internal processes","All four perspectives operate independently with no causal links"],correct:1,explanation:"The balanced scorecard follows a cause-and-effect chain: Learning & Growth (employee skills, systems) improves Internal Business Processes (efficiency, innovation), which improves Customer satisfaction (quality, service), which ultimately drives Financial performance (revenue, profit)."}
];
let current = 0, score = 0, answered = false, startTime = Date.now(), timerInterval;
function startTimer() { timerInterval = setInterval(() => { const elapsed = Math.floor((Date.now() - startTime) / 1000); const m = String(Math.floor(elapsed / 60)).padStart(2, '0'); const s = String(elapsed % 60).padStart(2, '0'); document.getElementById('timer').textContent = '\u23F1 ' + m + ':' + s; }, 1000); }
function shuffleOptions(q) { const indices = q.options.map((_, i) => i); for (let i = indices.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [indices[i], indices[j]] = [indices[j], indices[i]]; } const shuffled = indices.map(i => q.options[i]); const newCorrect = indices.indexOf(q.correct); return { ...q, options: shuffled, correct: newCorrect }; }
function renderQ() { const q = shuffleOptions(questions[current]); questions[current]._shuffled = q; document.getElementById('current-q').textContent = current + 1; document.getElementById('total-q').textContent = questions.length; document.getElementById('score').textContent = score; document.getElementById('progress').style.width = ((current + 1) / questions.length * 100) + '%'; const letters = ['A', 'B', 'C', 'D']; document.getElementById('quiz-area').innerHTML = '<div class="question-card"><div class="question-num">Question ' + (current + 1) + ' / ' + questions.length + '</div><div class="question-text">' + q.q + '</div><div class="options">' + q.options.map((opt, i) => '<button class="option" onclick="selectOption(' + i + ')" id="opt' + i + '">' + letters[i] + '. ' + opt + '</button>').join('') + '</div><div class="explanation" id="explanation">' + q.explanation + '</div></div><div class="nav-buttons"><div></div><button class="btn btn-next" id="btn-next" onclick="nextQ()" disabled>Next &rarr;</button></div>'; answered = false; }
function selectOption(idx) { if (answered) return; answered = true; const q = questions[current]._shuffled; document.querySelectorAll('.option').forEach(b => b.disabled = true); if (idx === q.correct) { document.getElementById('opt' + idx).classList.add('correct'); score++; } else { document.getElementById('opt' + idx).classList.add('wrong'); document.getElementById('opt' + q.correct).classList.add('correct'); } document.getElementById('explanation').style.display = 'block'; document.getElementById('btn-next').disabled = false; document.getElementById('score').textContent = score; }
function nextQ() { if (current < questions.length - 1) { current++; renderQ(); } else { showResult(); } }
function showResult() { clearInterval(timerInterval); const elapsed = Math.floor((Date.now() - startTime) / 1000); const m = Math.floor(elapsed / 60); const s = elapsed % 60; document.getElementById('quiz-area').innerHTML = ''; const rc = document.getElementById('result-card'); rc.style.display = 'block'; document.getElementById('final-score').textContent = score; document.getElementById('result-time').textContent = '\u23F1 Time: ' + m + 'min ' + s + 's'; const pct = score / questions.length; document.getElementById('result-msg').textContent = pct >= 0.9 ? 'Outstanding! You truly mastered this chapter.' : pct >= 0.7 ? 'Good job! A bit more review and you will ace it.' : pct >= 0.5 ? 'Not bad, but review the summary to strengthen weak areas.' : 'Keep studying! Read the summary and try again.'; }
function restartQuiz() { current = 0; score = 0; answered = false; startTime = Date.now(); document.getElementById('result-card').style.display = 'none'; startTimer(); renderQ(); }
startTimer(); renderQ();
</script>
