<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz — Relationship Marketing Ch4: AI & Relationship Marketing</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; padding: 1.5rem; }
        .quiz-header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 1.5rem 2rem; border-radius: 16px; margin-bottom: 1.5rem; border-bottom: 3px solid #10b981; }
        .quiz-header .matiere { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #10b981; margin-bottom: 0.3rem; }
        .quiz-header h1 { font-size: 1.3rem; font-weight: 700; color: white; }
        .quiz-container { max-width: 800px; margin: 0 auto; }
        .progress-bar { background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; margin-bottom: 1.5rem; }
        .progress-fill { background: #10b981; height: 100%; border-radius: 10px; transition: width 0.3s; }
        .score-display { text-align: center; font-size: 0.85rem; color: #808090; margin-bottom: 1rem; }
        .timer { text-align: center; font-size: 0.85rem; color: #f59e0b; margin-bottom: 0.5rem; font-weight: 600; }
        .question-card { background: #1a1a2e; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 2rem; margin-bottom: 1rem; }
        .question-num { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #10b981; margin-bottom: 0.8rem; font-weight: 700; }
        .question-text { font-size: 1.05rem; font-weight: 600; color: white; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: grid; gap: 0.6rem; }
        .option { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0.9rem 1.2rem; cursor: pointer; transition: all 0.2s; font-size: 0.92rem; color: #d0d0d8; text-align: left; width: 100%; }
        .option:hover:not(:disabled) { background: rgba(16,185,129,0.1); border-color: rgba(16,185,129,0.4); color: white; }
        .option.correct { background: rgba(16,185,129,0.2); border-color: #10b981; color: #10b981; font-weight: 600; }
        .option.wrong { background: rgba(239,68,68,0.2); border-color: #ef4444; color: #ef4444; }
        .option:disabled { cursor: default; }
        .explanation { background: rgba(16,185,129,0.08); border-left: 3px solid #10b981; padding: 0.8rem 1rem; margin-top: 1rem; border-radius: 0 8px 8px 0; font-size: 0.88rem; color: #6ee7b7; display: none; }
        .nav-buttons { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; gap: 1rem; }
        .btn { padding: 0.7rem 1.5rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-next { background: #10b981; color: white; margin-left: auto; }
        .btn-next:hover { background: #059669; }
        .btn-next:disabled { background: rgba(255,255,255,0.1); color: #606070; cursor: default; }
        .result-card { background: #1a1a2e; border-radius: 16px; padding: 3rem 2rem; text-align: center; display: none; }
        .result-score { font-size: 3.5rem; font-weight: 800; color: #10b981; margin: 1rem 0; }
        .result-msg { font-size: 1.1rem; color: #d0d0d8; margin-bottom: 2rem; }
        .result-time { font-size: 0.9rem; color: #f59e0b; margin-bottom: 1.5rem; }
        .btn-restart { background: #10b981; color: white; padding: 0.8rem 2rem; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; border: none; }
        .back-link { display: inline-block; color: #808090; font-size: 0.8rem; text-decoration: none; margin-bottom: 1rem; }
        .back-link:hover { color: #10b981; }
    </style>
</head>
<body>
<div class="quiz-container">
    <a href="../../en/index.html" class="back-link">&larr; Back to dashboard</a>
    <div class="quiz-header">
        <div class="matiere">Relationship Marketing &mdash; QUIZ</div>
        <h1>Chapter 4 &mdash; AI &amp; Relationship Marketing</h1>
    </div>
    <div class="timer" id="timer">&#9201; 00:00</div>
    <div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">10</span> &mdash; Score: <span id="score">0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:10%"></div></div>
    <div id="quiz-area"></div>
    <div class="result-card" id="result-card">
        <div style="font-size:2rem">&#127919;</div>
        <div class="result-score"><span id="final-score">0</span>/10</div>
        <div class="result-time" id="result-time"></div>
        <div class="result-msg" id="result-msg"></div>
        <button class="btn-restart" onclick="restartQuiz()">Restart</button>
        <br><br>
        <a href="../../en/index.html" class="back-link">&larr; Back to dashboard</a>
    </div>
</div>
<script>
const questions = [
    {q:"According to Huang et al. (2023), which level of AI recognizes emotions?", options:["Mechanical AI (Level A)","Thinking AI (Level B)","Feeling AI (Level C)","General AI (Level D)"], correct:2, explanation:"Level C is Feeling AI, which recognizes emotions (e.g., sentiment analysis, facial emotion detection). Level A (Mechanical) executes tasks, and Level B (Thinking) analyzes data."},
    {q:"Which generative AI tool is described as an open-source LLM with European values?", options:["ChatGPT","Sora","Mistral","Synthesia"], correct:2, explanation:"Mistral is described as an open-source LLM that is fast and has European values. Its limitation is fewer built-in tools compared to other options."},
    {q:"Sephora ColorIQ, which scans skin tone to match foundation shades, is an example of which type of AI?", options:["Mechanical AI only","Thinking AI (analyzes data to make recommendations)","Feeling AI only","It does not use AI"], correct:1, explanation:"Sephora ColorIQ is an example of Thinking AI because it analyzes data (skin tone scans) to make personalized recommendations for foundation shades."},
    {q:"According to Grewal et al. (Journal of Retailing 2023), in-store technology should be analyzed along which two dimensions?", options:["Cost and speed","Efficiency and Enhancement","Online and offline","Hardware and software"], correct:1, explanation:"Grewal et al. state that in-store technology should be analyzed along Efficiency (making processes faster, cheaper, smoother) and Enhancement (making experiences richer, more engaging, more memorable)."},
    {q:"What is a key strength of AI in collaborative intelligence compared to humans?", options:["Empathy and moral values","Creative problem-solving and judgment","Speed, volume processing, and pattern recognition","Context understanding and intuition"], correct:2, explanation:"AI strengths include speed, volume processing, pattern recognition, 24/7 availability, consistency, data analysis at scale, and prediction. Humans excel at empathy, context understanding, intuition, and creative problem-solving."},
    {q:"Which of the following is NOT an application of Generative AI in customer relationships mentioned in the course?", options:["Hyper-personalized email marketing","AI-generated customer service responses with memory of past conversations","Fully autonomous sales negotiations without human oversight","Voice agents for loyalty programs"], correct:2, explanation:"The course mentions hyper-personalized email marketing, AI-generated customer service responses with conversation memory, and voice agents for loyalty programs. Fully autonomous sales negotiations without human oversight is not listed."},
    {q:"What does Schumpeter's theory of Creative Destruction imply for CRM?", options:["CRM should remain unchanged to maintain stability","Old CRM practices are being destroyed and replaced by new AI-powered approaches","AI will completely eliminate the need for human marketers","Technology has no impact on relationship marketing"], correct:1, explanation:"Schumpeter's Creative Destruction theory states that new technologies constantly revolutionize the economic structure from within, destroying old practices and creating new ones. This applies to AI's transformation of CRM."},
    {q:"According to the course conclusions, what must relationship marketers become?", options:["Pure data scientists","Architects of hybrid intelligence","AI programmers","Traditional marketing specialists"], correct:1, explanation:"One of the four key takeaways is that relationship marketers must become 'architects of hybrid intelligence,' combining human strengths and AI strengths rather than being basic users of AI."},
    {q:"The ITRI smart store in Taiwan uses which technologies for its 24-hour 'grab and go' concept?", options:["Only traditional barcode scanners","Face recognition and sensors","Virtual reality headsets only","Manual checkout with AI pricing"], correct:1, explanation:"The ITRI smart store in Taiwan uses face recognition and sensors for 24-hour 'grab and go' shopping, combining Mechanical and Thinking AI and approaching Feeling AI."},
    {q:"Which of the four key conclusions states that technology must be aligned with both the customer journey AND which other journey?", options:["The competitor journey","The supplier journey","The employee journey","The shareholder journey"], correct:2, explanation:"One of the four key takeaways is that technology must be aligned with BOTH the customer journey AND the employee journey, recognizing that both perspectives matter for successful implementation."}
];
let current = 0, score = 0, answered = false, startTime = Date.now(), timerInterval;
function startTimer() {
    timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const s = String(elapsed % 60).padStart(2, '0');
        document.getElementById('timer').textContent = '\u23F1 ' + m + ':' + s;
    }, 1000);
}
function shuffleOptions(q) {
    const indices = q.options.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    const shuffled = indices.map(i => q.options[i]);
    const newCorrect = indices.indexOf(q.correct);
    return { ...q, options: shuffled, correct: newCorrect };
}
function renderQ() {
    const q = shuffleOptions(questions[current]);
    questions[current]._shuffled = q;
    document.getElementById('current-q').textContent = current + 1;
    document.getElementById('total-q').textContent = questions.length;
    document.getElementById('score').textContent = score;
    document.getElementById('progress').style.width = ((current + 1) / questions.length * 100) + '%';
    const letters = ['A', 'B', 'C', 'D'];
    document.getElementById('quiz-area').innerHTML =
        '<div class="question-card">' +
        '<div class="question-num">Question ' + (current + 1) + ' / ' + questions.length + '</div>' +
        '<div class="question-text">' + q.q + '</div>' +
        '<div class="options">' + q.options.map((opt, i) => '<button class="option" onclick="selectOption(' + i + ')" id="opt' + i + '">' + letters[i] + '. ' + opt + '</button>').join('') + '</div>' +
        '<div class="explanation" id="explanation">' + q.explanation + '</div>' +
        '</div>' +
        '<div class="nav-buttons"><div></div><button class="btn btn-next" id="btn-next" onclick="nextQ()" disabled>Next &rarr;</button></div>';
    answered = false;
}
function selectOption(idx) {
    if (answered) return;
    answered = true;
    const q = questions[current]._shuffled;
    document.querySelectorAll('.option').forEach(b => b.disabled = true);
    if (idx === q.correct) { document.getElementById('opt' + idx).classList.add('correct'); score++; }
    else { document.getElementById('opt' + idx).classList.add('wrong'); document.getElementById('opt' + q.correct).classList.add('correct'); }
    document.getElementById('explanation').style.display = 'block';
    document.getElementById('btn-next').disabled = false;
    document.getElementById('score').textContent = score;
}
function nextQ() { if (current < questions.length - 1) { current++; renderQ(); } else { showResult(); } }
function showResult() {
    clearInterval(timerInterval);
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const m = Math.floor(elapsed / 60);
    const s = elapsed % 60;
    document.getElementById('quiz-area').innerHTML = '';
    const rc = document.getElementById('result-card');
    rc.style.display = 'block';
    document.getElementById('final-score').textContent = score;
    document.getElementById('result-time').textContent = '\u23F1 Time: ' + m + 'min ' + s + 's';
    const pct = score / questions.length;
    document.getElementById('result-msg').textContent = pct >= 0.9 ? 'Outstanding! You truly mastered this chapter.' : pct >= 0.7 ? 'Good job! A bit more review and you will ace it.' : pct >= 0.5 ? 'Not bad, but review the summary to strengthen weak areas.' : 'Keep studying! Read the summary and try again.';
}
function restartQuiz() { current = 0; score = 0; answered = false; startTime = Date.now(); document.getElementById('result-card').style.display = 'none'; startTimer(); renderQ(); }
startTimer();
renderQ();
</script>

</body>
</html>
