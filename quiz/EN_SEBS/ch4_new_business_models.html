<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz — SEBS Ch 4: New Business Models for a Sustainable World</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; padding: 2rem; }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        .quiz-container { max-width: 750px; margin: 0 auto; }
        .back-link { color: #888; text-decoration: none; font-size: 0.85rem; }
        .back-link:hover { color: #10b981; }
        .quiz-header { text-align: center; margin: 1.5rem 0; }
        .matiere { color: #10b981; font-size: 0.8rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
        .quiz-header h1 { font-size: 1.5rem; margin-top: 0.5rem; color: #fff; }
        .score-display { text-align: center; color: #aaa; margin: 1rem 0; font-size: 0.95rem; }
        .progress-bar { background: #1a1a2e; border-radius: 10px; height: 8px; margin-bottom: 2rem; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #10b981, #059669); height: 100%; border-radius: 10px; transition: width 0.5s ease; }
        .question-card { background: #1a1a2e; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; }
        .question-num { color: #10b981; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; }
        .question-text { font-size: 1.1rem; font-weight: 600; color: #fff; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 0.7rem; }
        .option { background: #252540; border: 2px solid #333; border-radius: 10px; padding: 1rem; text-align: left; color: #e0e0e0; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; }
        .option:hover:not(:disabled) { border-color: #10b981; background: #2a2a4a; }
        .option.correct { border-color: #10b981; background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .option.wrong { border-color: #ef4444; background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .option:disabled { cursor: default; }
        .explanation { display: none; background: #252540; border-left: 4px solid #10b981; padding: 1rem; margin-top: 1rem; border-radius: 0 8px 8px 0; font-size: 0.9rem; line-height: 1.5; color: #ccc; }
        .nav-buttons { text-align: center; margin-top: 1rem; }
        .btn { padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-next { background: #10b981; color: #fff; }
        .btn-next:hover:not(:disabled) { background: #059669; }
        .btn-next:disabled { opacity: 0.4; cursor: not-allowed; }
        .result-card { display: none; text-align: center; background: #1a1a2e; padding: 2.5rem; border-radius: 12px; }
        .result-score { font-size: 3rem; font-weight: 700; color: #10b981; margin: 1rem 0; }
        .result-msg { font-size: 1.1rem; color: #ccc; margin-bottom: 1.5rem; }
        .btn-restart { background: #10b981; color: white; border: none; padding: 0.8rem 2.5rem; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-restart:hover { background: #059669; }
    </style>
</head>
<body>
    <div class="quiz-container">
        <a href="../../en/index.html" class="back-link">&larr; Back to dashboard</a>
        <div class="quiz-header">
            <div class="matiere">SUSTAINABLE &amp; ETHICAL BUSINESS STRATEGY &mdash; QUIZ</div>
            <h1>Chapter 4 &mdash; New Business Models for a Sustainable World</h1>
        </div>
        <div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">10</span> &mdash; Score: <span id="score">0</span> &mdash; <span id="timer">&#9201; 00:00</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progress" style="width:10%"></div></div>
        <div id="quiz-area"></div>
        <div class="result-card" id="result-card">
            <div style="font-size:2rem">&#127919;</div>
            <div class="result-score"><span id="final-score">0</span>/10</div>
            <div class="result-msg" id="result-msg"></div>
            <div id="result-time"></div>
            <br>
            <button class="btn-restart" onclick="restartQuiz()">Restart</button>
            <br><br>
            <a href="../../en/index.html" class="back-link">&larr; Back to dashboard</a>
        </div>
    </div>
    <script>
const questions = [
    {q:"What does the ASI framework for sustainable transportation stand for?",options:["Automate, Standardize, Implement","Avoid, Shift, Improve","Accelerate, Sustain, Integrate","Assess, Strategize, Innovate"],correct:1,explanation:"ASI stands for: Avoid (reduce the need for transport through remote work, local production), Shift (move to less carbon-intensive modes like rail and cycling), and Improve (make remaining transport more efficient with electric vehicles, better engines)."},
    {q:"Biochar is a charcoal-like substance with multiple benefits. Which of the following is NOT one of its three advantages?",options:["Stable form of carbon that locks carbon in soil for centuries","Clean source of energy during production","Improvement of soil quality and fertility","Replacement of fossil fuels in electricity generation"],correct:3,explanation:"Biochar offers three benefits: stable carbon storage in soil, clean energy generation during production, and soil quality improvement. Replacing fossil fuels in electricity generation is not one of its specific advantages."},
    {q:"According to the course, what are the two pillars for rethinking the energy system?",options:["Fossil fuels and nuclear power","Wind energy and solar panels","De-carbonated electricity and new molecules (especially hydrogen)","Energy storage and grid expansion"],correct:2,explanation:"The solution for rethinking the energy system rests on two pillars: de-carbonated electricity (clean power generation from renewables and nuclear) and new molecules (especially decarbonated hydrogen)."},
    {q:"A company pays for the energy savings achieved in its building rather than buying heating equipment. This is an example of which concept?",options:["Carbon offsetting","Economy of service functionality","Greenwashing","Vertical integration"],correct:1,explanation:"This describes the Economy of Service Functionality — paying for the result (energy savings) rather than the product (equipment). The Energy Performance Contract concept dates back to 1937 and exemplifies selling service instead of products."},
    {q:"What is agrivoltaism?",options:["Using agricultural waste to generate electricity","Combining agricultural production with solar energy generation on the same land","Powering agricultural machinery with batteries","Converting all farmland to solar panel installations"],correct:1,explanation:"Agrivoltaism combines agricultural production with solar energy generation on the same land. Remarkably, French nuclear power production is equivalent to agrivoltaism applied to just 2% of French cultivated area."},
    {q:"Which innovation addresses steel production's massive carbon footprint?",options:["Building fewer steel structures","Direct reduction of iron by hydrogen instead of coal/coke","Importing steel from countries with cleaner grids","Using recycled plastic as a steel substitute"],correct:1,explanation:"The key innovation for decarbonizing steel is the direct reduction of iron by hydrogen, replacing coal/coke. Additionally, carbon fibers can replace steel in some applications, offering lighter and less energy-intensive alternatives."},
    {q:"What is bioremediation?",options:["Using chemicals to neutralize contaminated soil","Using living organisms (bacteria, fungi, plants) to clean up contaminated environments","Replacing damaged ecosystems with artificial habitats","Genetic modification of crops to resist pollution"],correct:1,explanation:"Bioremediation uses living organisms (bacteria, fungi, plants) to remove pollutants from soil, water, and air through natural biological processes, offering a sustainable approach to environmental cleanup."},
    {q:"Which statement about the 'New Abundance' concept (BCG) is TRUE?",options:["Resource constraints are irrelevant to business strategy","Companies should ignore physical constraints and focus only on financial ones","Resource constraints should be seen as strategic opportunities for competitive advantage","Abundance means unlimited access to all natural resources"],correct:2,explanation:"The New Abundance concept holds that resource constraints should be seen as strategic opportunities. Companies that adapt their business models to work within physical constraints (resources, energy, climate) gain competitive advantages, while those that ignore them face existential risks."},
    {q:"What does 'proteins out of thin air' refer to in the context of food innovation?",options:["Growing protein-rich crops in vertical farms","Producing protein from CO2, water, and electricity using microorganisms","Extracting protein from atmospheric nitrogen","Synthesizing protein in zero-gravity environments"],correct:1,explanation:"This emerging technology produces protein from CO2, water, and electricity using microorganisms, potentially revolutionizing food production with minimal land and water use."},
    {q:"Which is NOT one of the sustainable design principles mentioned in the course?",options:["Adjustable — products that adapt to different needs","Repairable — designed for easy repair to extend lifespan","Disposable — designed for single use and easy replacement","Sustainable — built to last with durable materials"],correct:2,explanation:"The sustainable design principles are Adjustable, Repairable, and Sustainable (built to last). Disposable design is the opposite of sustainable design — the course advocates for durability and longevity, not single-use products."}
];
let current = 0, score = 0, answered = false, startTime = Date.now(), timerInterval;
function startTimer() { timerInterval = setInterval(() => { const elapsed = Math.floor((Date.now() - startTime) / 1000); const m = String(Math.floor(elapsed / 60)).padStart(2, '0'); const s = String(elapsed % 60).padStart(2, '0'); document.getElementById('timer').textContent = '⏱ ' + m + ':' + s; }, 1000); }
function shuffleOptions(q) { const indices = q.options.map((_, i) => i); for (let i = indices.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [indices[i], indices[j]] = [indices[j], indices[i]]; } const shuffled = indices.map(i => q.options[i]); const newCorrect = indices.indexOf(q.correct); return { ...q, options: shuffled, correct: newCorrect }; }
function renderQ() { const q = shuffleOptions(questions[current]); questions[current]._shuffled = q; document.getElementById('current-q').textContent = current + 1; document.getElementById('total-q').textContent = questions.length; document.getElementById('score').textContent = score; document.getElementById('progress').style.width = ((current + 1) / questions.length * 100) + '%'; const letters = ['A', 'B', 'C', 'D']; document.getElementById('quiz-area').innerHTML = '<div class="question-card"><div class="question-num">Question ' + (current + 1) + ' / ' + questions.length + '</div><div class="question-text">' + q.q + '</div><div class="options">' + q.options.map((opt, i) => '<button class="option" onclick="selectOption(' + i + ')" id="opt' + i + '">' + letters[i] + '. ' + opt + '</button>').join('') + '</div><div class="explanation" id="explanation">' + q.explanation + '</div></div><div class="nav-buttons"><div></div><button class="btn btn-next" id="btn-next" onclick="nextQ()" disabled>Next &rarr;</button></div>'; answered = false; }
function selectOption(idx) { if (answered) return; answered = true; const q = questions[current]._shuffled; document.querySelectorAll('.option').forEach(b => b.disabled = true); if (idx === q.correct) { document.getElementById('opt' + idx).classList.add('correct'); score++; } else { document.getElementById('opt' + idx).classList.add('wrong'); document.getElementById('opt' + q.correct).classList.add('correct'); } document.getElementById('explanation').style.display = 'block'; document.getElementById('btn-next').disabled = false; document.getElementById('score').textContent = score; }
function nextQ() { if (current < questions.length - 1) { current++; renderQ(); } else { showResult(); } }
function showResult() { clearInterval(timerInterval); const elapsed = Math.floor((Date.now() - startTime) / 1000); const m = Math.floor(elapsed / 60); const s = elapsed % 60; document.getElementById('quiz-area').innerHTML = ''; const rc = document.getElementById('result-card'); rc.style.display = 'block'; document.getElementById('final-score').textContent = score; document.getElementById('result-time').textContent = '⏱ Time: ' + m + 'min ' + s + 's'; const pct = score / questions.length; document.getElementById('result-msg').textContent = pct >= 0.9 ? 'Outstanding! You truly mastered this chapter.' : pct >= 0.7 ? 'Good job! A bit more review and you will ace it.' : pct >= 0.5 ? 'Not bad, but review the summary to strengthen weak areas.' : 'Keep studying! Read the summary and try again.'; }
function restartQuiz() { current = 0; score = 0; answered = false; startTime = Date.now(); document.getElementById('result-card').style.display = 'none'; startTimer(); renderQ(); }
startTimer(); renderQ();
    </script>
    <script data-goatcounter="https://chaborz.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
