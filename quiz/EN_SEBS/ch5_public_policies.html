<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz — SEBS Ch 5: Public Policies</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; padding: 2rem; }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        .quiz-container { max-width: 750px; margin: 0 auto; }
        .back-link { color: #888; text-decoration: none; font-size: 0.85rem; }
        .back-link:hover { color: #10b981; }
        .quiz-header { text-align: center; margin: 1.5rem 0; }
        .matiere { color: #10b981; font-size: 0.8rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; }
        .quiz-header h1 { font-size: 1.5rem; margin-top: 0.5rem; color: #fff; }
        .score-display { text-align: center; color: #aaa; margin: 1rem 0; font-size: 0.95rem; }
        .progress-bar { background: #1a1a2e; border-radius: 10px; height: 8px; margin-bottom: 2rem; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #10b981, #059669); height: 100%; border-radius: 10px; transition: width 0.5s ease; }
        .question-card { background: #1a1a2e; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; }
        .question-num { color: #10b981; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; }
        .question-text { font-size: 1.1rem; font-weight: 600; color: #fff; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: flex; flex-direction: column; gap: 0.7rem; }
        .option { background: #252540; border: 2px solid #333; border-radius: 10px; padding: 1rem; text-align: left; color: #e0e0e0; font-size: 0.95rem; cursor: pointer; transition: all 0.2s; }
        .option:hover:not(:disabled) { border-color: #10b981; background: #2a2a4a; }
        .option.correct { border-color: #10b981; background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .option.wrong { border-color: #ef4444; background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        .option:disabled { cursor: default; }
        .explanation { display: none; background: #252540; border-left: 4px solid #10b981; padding: 1rem; margin-top: 1rem; border-radius: 0 8px 8px 0; font-size: 0.9rem; line-height: 1.5; color: #ccc; }
        .nav-buttons { text-align: center; margin-top: 1rem; }
        .btn { padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-next { background: #10b981; color: #fff; }
        .btn-next:hover:not(:disabled) { background: #059669; }
        .btn-next:disabled { opacity: 0.4; cursor: not-allowed; }
        .result-card { display: none; text-align: center; background: #1a1a2e; padding: 2.5rem; border-radius: 12px; }
        .result-score { font-size: 3rem; font-weight: 700; color: #10b981; margin: 1rem 0; }
        .result-msg { font-size: 1.1rem; color: #ccc; margin-bottom: 1.5rem; }
        .btn-restart { background: #10b981; color: white; border: none; padding: 0.8rem 2.5rem; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-restart:hover { background: #059669; }
    </style>
</head>
<body>
    <div class="quiz-container">
        <a href="../../en/index.html" class="back-link">&larr; Back to dashboard</a>
        <div class="quiz-header">
            <div class="matiere">SUSTAINABLE &amp; ETHICAL BUSINESS STRATEGY &mdash; QUIZ</div>
            <h1>Chapter 5 &mdash; Public Policies</h1>
        </div>
        <div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">10</span> &mdash; Score: <span id="score">0</span> &mdash; <span id="timer">&#9201; 00:00</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progress" style="width:10%"></div></div>
        <div id="quiz-area"></div>
        <div class="result-card" id="result-card">
            <div style="font-size:2rem">&#127919;</div>
            <div class="result-score"><span id="final-score">0</span>/10</div>
            <div class="result-msg" id="result-msg"></div>
            <div id="result-time"></div>
            <br>
            <button class="btn-restart" onclick="restartQuiz()">Restart</button>
            <br><br>
            <a href="../../en/index.html" class="back-link">&larr; Back to dashboard</a>
        </div>
    </div>
    <script>
const questions = [
    {q:"What is the key difference between 'Carbon Neutral' and 'Net Zero'?",options:["They mean exactly the same thing","Carbon neutral focuses on compensation/offsetting; net zero requires deep emission reductions across all scopes","Net zero only applies to governments, not companies","Carbon neutral is more ambitious than net zero"],correct:1,explanation:"Carbon neutral allows offsetting emissions through external projects without deep transformation. Net zero requires major reductions across the entire value chain (Scope 1, 2, and 3), with only minimal remaining offsets. Net zero is much more ambitious and science-based."},
    {q:"What does 'double materiality' mean in the context of CSRD?",options:["Companies must report in two different languages","Companies must report both how sustainability issues affect them AND how they affect people and the environment","Two separate auditing firms must verify each report","Reports must cover both financial and non-financial subsidiaries"],correct:1,explanation:"Double materiality means reporting from two perspectives: financial materiality (how sustainability issues affect the company) and impact materiality (how the company affects people and the environment). This is a core innovation of the CSRD."},
    {q:"Under the GHG Protocol, which scope typically represents the largest share of a company's total emissions?",options:["Scope 1 — direct emissions from owned sources","Scope 2 — indirect energy emissions from purchased electricity","Scope 3 — other indirect emissions across the value chain","All three scopes are always equal"],correct:2,explanation:"Scope 3 typically represents the largest share, covering everything in the value chain: employee commuting, supply chain, product use, waste disposal, and non-energy purchases. Scopes 1 and 2 cover only direct emissions and purchased energy."},
    {q:"If mitigation had started in 2000, approximately what annual emission reduction rate would have been needed?",options:["~2% per year","~5% per year","~9% per year","~15% per year"],correct:0,explanation:"Starting in 2000, only ~2% annual reduction was needed — manageable with moderate policy changes. Starting in 2019 requires ~5%. Waiting 10 more years of constant emissions would require ~9% — nearly impossible without massive economic disruption."},
    {q:"Which of the following is NOT one of the six environmental objectives of the EU Taxonomy?",options:["Climate change mitigation","Circular economy promotion","Maximizing economic growth","Biodiversity and ecosystem restoration"],correct:2,explanation:"The six objectives are: Climate Change Mitigation, Climate Change Adaptation, Water and Marine Resources Protection, Circular Economy Promotion, Pollution Prevention, and Biodiversity and Ecosystem Restoration. Maximizing economic growth is not an environmental objective of the taxonomy."},
    {q:"What is 'Absolute Zero' in climate policy?",options:["The same concept as net zero but with a different name","Zero emissions with no reliance on any CO2 removal or offsetting technologies","The temperature at which all carbon emissions freeze","A voluntary carbon reduction target for small businesses"],correct:1,explanation:"Absolute Zero means zero emissions produced with no reliance on CO2 removal technologies — no offsets, no carbon capture. It is the most stringent target, contrasting with carbon neutral (allows compensation) and net zero (allows minimal offsetting)."},
    {q:"According to the IEA scenarios, which is the only scenario consistent with limiting global warming?",options:["Current Policies (business-as-usual)","Stated Policies (middle ambition)","Sustainable Development (climate-aligned)","None of the scenarios can limit warming"],correct:2,explanation:"Only the Sustainable Development scenario is compatible with the Paris Agreement: coal, oil, and gas decline sharply while renewables grow significantly and CO2 emissions drop steeply. The other scenarios lead to insufficient reductions."},
    {q:"The European Green Deal targets a GHG reduction of what percentage by 2030?",options:["30%","40%","55%","80%"],correct:2,explanation:"The European Green Deal targets a 55% reduction in greenhouse gas emissions by 2030, with the goal of reaching net zero by 2050. It also includes sectoral constraints such as ending production of new combustion engine cars by 2035."},
    {q:"What significant change does the 2025 Omnibus proposal introduce regarding CSRD?",options:["It accelerates the CSRD reporting timeline significantly","It adds more companies and stricter penalties","It drastically reduces the number of companies covered and simplifies requirements","It merges CSRD with the EU Taxonomy into one regulation"],correct:2,explanation:"The 2025 Omnibus proposal suggests a drastic reduction in companies covered by CSRD and big simplifications of reporting requirements. The CSDDD is also impacted. This reflects political pushback about regulatory burden on businesses."},
    {q:"In the IEA Net Zero Emissions scenario, what percentage of global electricity generation do solar PV and wind provide by 2050?",options:["About 30%","About 50%","Nearly 70%","Over 90%"],correct:2,explanation:"In the NZE scenario, solar PV and wind become the leading sources of electricity globally before 2030 and together provide nearly 70% of global generation by 2050. Total energy supply falls by 7% between 2020 and 2030 in this scenario."}
];
let current = 0, score = 0, answered = false, startTime = Date.now(), timerInterval;
function startTimer() { timerInterval = setInterval(() => { const elapsed = Math.floor((Date.now() - startTime) / 1000); const m = String(Math.floor(elapsed / 60)).padStart(2, '0'); const s = String(elapsed % 60).padStart(2, '0'); document.getElementById('timer').textContent = '⏱ ' + m + ':' + s; }, 1000); }
function shuffleOptions(q) { const indices = q.options.map((_, i) => i); for (let i = indices.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [indices[i], indices[j]] = [indices[j], indices[i]]; } const shuffled = indices.map(i => q.options[i]); const newCorrect = indices.indexOf(q.correct); return { ...q, options: shuffled, correct: newCorrect }; }
function renderQ() { const q = shuffleOptions(questions[current]); questions[current]._shuffled = q; document.getElementById('current-q').textContent = current + 1; document.getElementById('total-q').textContent = questions.length; document.getElementById('score').textContent = score; document.getElementById('progress').style.width = ((current + 1) / questions.length * 100) + '%'; const letters = ['A', 'B', 'C', 'D']; document.getElementById('quiz-area').innerHTML = '<div class="question-card"><div class="question-num">Question ' + (current + 1) + ' / ' + questions.length + '</div><div class="question-text">' + q.q + '</div><div class="options">' + q.options.map((opt, i) => '<button class="option" onclick="selectOption(' + i + ')" id="opt' + i + '">' + letters[i] + '. ' + opt + '</button>').join('') + '</div><div class="explanation" id="explanation">' + q.explanation + '</div></div><div class="nav-buttons"><div></div><button class="btn btn-next" id="btn-next" onclick="nextQ()" disabled>Next &rarr;</button></div>'; answered = false; }
function selectOption(idx) { if (answered) return; answered = true; const q = questions[current]._shuffled; document.querySelectorAll('.option').forEach(b => b.disabled = true); if (idx === q.correct) { document.getElementById('opt' + idx).classList.add('correct'); score++; } else { document.getElementById('opt' + idx).classList.add('wrong'); document.getElementById('opt' + q.correct).classList.add('correct'); } document.getElementById('explanation').style.display = 'block'; document.getElementById('btn-next').disabled = false; document.getElementById('score').textContent = score; }
function nextQ() { if (current < questions.length - 1) { current++; renderQ(); } else { showResult(); } }
function showResult() { clearInterval(timerInterval); const elapsed = Math.floor((Date.now() - startTime) / 1000); const m = Math.floor(elapsed / 60); const s = elapsed % 60; document.getElementById('quiz-area').innerHTML = ''; const rc = document.getElementById('result-card'); rc.style.display = 'block'; document.getElementById('final-score').textContent = score; document.getElementById('result-time').textContent = '⏱ Time: ' + m + 'min ' + s + 's'; const pct = score / questions.length; document.getElementById('result-msg').textContent = pct >= 0.9 ? 'Outstanding! You truly mastered this chapter.' : pct >= 0.7 ? 'Good job! A bit more review and you will ace it.' : pct >= 0.5 ? 'Not bad, but review the summary to strengthen weak areas.' : 'Keep studying! Read the summary and try again.'; }
function restartQuiz() { current = 0; score = 0; answered = false; startTime = Date.now(); document.getElementById('result-card').style.display = 'none'; startTimer(); renderQ(); }
startTimer(); renderQ();
    </script>
    <script data-goatcounter="https://chaborz.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
