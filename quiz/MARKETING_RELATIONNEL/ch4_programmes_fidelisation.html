<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Quiz — Ch.4 — Programmes de Fid&eacute;lisation</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',sans-serif;background:#0f0f1a;color:#e0e0e0;min-height:100vh;padding:1.5rem}.quiz-header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);padding:1.5rem 2rem;border-radius:16px;margin-bottom:1.5rem;border-bottom:3px solid #e94560}.quiz-header .matiere{font-size:.75rem;text-transform:uppercase;letter-spacing:2px;color:#e94560;margin-bottom:.3rem}.quiz-header h1{font-size:1.3rem;font-weight:700;color:#fff}.quiz-container{max-width:800px;margin:0 auto}.progress-bar{background:rgba(255,255,255,.1);border-radius:10px;height:6px;margin-bottom:1.5rem}.progress-fill{background:#e94560;height:100%;border-radius:10px;transition:width .3s}.score-display{text-align:center;font-size:.85rem;color:#808090;margin-bottom:1rem}.timer{text-align:center;font-size:.85rem;color:#f59e0b;margin-bottom:.5rem;font-weight:600}.question-card{background:#1a1a2e;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:2rem;margin-bottom:1rem}.question-num{font-size:.7rem;text-transform:uppercase;letter-spacing:2px;color:#e94560;margin-bottom:.8rem;font-weight:700}.question-text{font-size:1.05rem;font-weight:600;color:#fff;margin-bottom:1.5rem;line-height:1.5}.options{display:grid;gap:.6rem}.option{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:.9rem 1.2rem;cursor:pointer;transition:all .2s;font-size:.92rem;color:#d0d0d8;text-align:left;width:100%}.option:hover:not(:disabled){background:rgba(233,69,96,.1);border-color:rgba(233,69,96,.4);color:#fff}.option.correct{background:rgba(16,185,129,.2);border-color:#10b981;color:#10b981;font-weight:600}.option.wrong{background:rgba(233,69,96,.2);border-color:#e94560;color:#e94560}.option:disabled{cursor:default}.explanation{background:rgba(233,69,96,.08);border-left:3px solid #e94560;padding:.8rem 1rem;margin-top:1rem;border-radius:0 8px 8px 0;font-size:.88rem;color:#f9a8b8;display:none}.nav-buttons{display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem;gap:1rem}.btn{padding:.7rem 1.5rem;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer;border:none;transition:all .2s}.btn-next{background:#e94560;color:#fff;margin-left:auto}.btn-next:hover{background:#c0392b}.btn-next:disabled{background:rgba(255,255,255,.1);color:#606070;cursor:default}.btn-back{background:rgba(255,255,255,.08);color:#d0d0d8}.btn-back:hover{background:rgba(255,255,255,.15)}.result-card{background:#1a1a2e;border-radius:16px;padding:3rem 2rem;text-align:center;display:none}.result-score{font-size:3.5rem;font-weight:800;color:#e94560;margin:1rem 0}.result-msg{font-size:1.1rem;color:#d0d0d8;margin-bottom:2rem}.btn-restart{background:#e94560;color:#fff;padding:.8rem 2rem;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;border:none}.back-link{display:inline-block;color:#808090;font-size:.8rem;text-decoration:none;margin-bottom:1rem}.back-link:hover{color:#e94560}</style></head><body>
<div class="quiz-container">
<a href="../../fr/index.html" class="back-link">&larr; Retour &agrave; l'accueil</a>
<div class="quiz-header"><div class="matiere">MARKETING RELATIONNEL &mdash; QUIZ</div><h1>Ch.4 &mdash; Programmes de Fid&eacute;lisation</h1></div>
<div class="timer" id="timer">&#9202; 00:00</div>
<div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">10</span> &mdash; Score : <span id="score">0</span></div>
<div class="progress-bar"><div class="progress-fill" id="progress" style="width:10%"></div></div>
<div id="quiz-area"></div>
<div class="result-card" id="result-card"><div style="font-size:2rem">&#127919;</div><div class="result-score"><span id="final-score">0</span>/<span id="final-total">10</span></div><div class="result-msg" id="result-msg"></div><button class="btn-restart" onclick="restartQuiz()">Recommencer</button><br><br><a href="../../fr/index.html" class="back-link">&larr; Retour &agrave; l'accueil</a></div>
</div>
<script>
const questions=[
{q:"Quelle est la diff\u00e9rence fondamentale entre fid\u00e9lisation induite et fid\u00e9lisation recherch\u00e9e ?",options:["Il n\u2019y a aucune diff\u00e9rence","La fid\u00e9lisation induite r\u00e9sulte de barri\u00e8res au changement, la recherch\u00e9e repose sur la valeur per\u00e7ue","La fid\u00e9lisation induite est plus durable","La fid\u00e9lisation recherch\u00e9e utilise des contrats d\u2019engagement"],correct:1,explanation:"La fid\u00e9lisation induite repose sur des barri\u00e8res (contrat, co\u00fbts de changement). La fid\u00e9lisation recherch\u00e9e repose sur la satisfaction et la pr\u00e9f\u00e9rence du client."},
{q:"Un programme \u00e0 points comme Carrefour Fid\u00e9lit\u00e9 est un exemple de :",options:["Programme relationnel","Programme \u00e0 b\u00e9n\u00e9fices transactionnels","Programme communautaire","Programme \u00e0 privil\u00e8ges exclusifs"],correct:1,explanation:"Les programmes \u00e0 points r\u00e9compensent les transactions (achats) par des points convertibles : logique transactionnelle."},
{q:"Lequel N\u2019EST PAS un objectif d\u2019un programme de fid\u00e9lisation ?",options:["Augmenter la fr\u00e9quence d\u2019achat","R\u00e9duire le taux d\u2019attrition (churn)","Maximiser les ventes ponctuelles sans suivi","Collecter des donn\u00e9es clients"],correct:2,explanation:"Maximiser les ventes ponctuelles est une logique transactionnelle. Les programmes de fid\u00e9lisation visent la r\u00e9p\u00e9tition, la r\u00e9tention et la connaissance client."},
{q:"Vrai ou faux : tous les programmes de fid\u00e9lisation sont pay\u00e9s par le client.",options:["Vrai, le client paie toujours un abonnement","Faux, certains sont gratuits (carte \u00e0 points) et d\u2019autres payants (Amazon Prime)","Vrai, sinon ce n\u2019est pas un programme de fid\u00e9lisation","Faux, ils sont toujours gratuits par obligation l\u00e9gale"],correct:1,explanation:"Il existe des programmes gratuits (carte Carrefour) et payants (Amazon Prime, Costco). Le mod\u00e8le payant cr\u00e9e un engagement plus fort."},
{q:"Amazon Prime est un exemple de programme de fid\u00e9lisation de type :",options:["Programme \u00e0 points classique","Programme de cashback","Programme par abonnement payant avec privil\u00e8ges","Programme de parrainage"],correct:2,explanation:"Amazon Prime est un programme payant qui offre des avantages exclusifs (livraison gratuite, streaming) en \u00e9change d\u2019un abonnement annuel."},
{q:"Le taux de r\u00e9tention mesure :",options:["Le nombre de nouveaux clients acquis","Le pourcentage de clients conserv\u00e9s sur une p\u00e9riode donn\u00e9e","Le montant moyen d\u00e9pens\u00e9 par client","La part de march\u00e9 de l\u2019entreprise"],correct:1,explanation:"Le taux de r\u00e9tention = pourcentage de clients encore actifs \u00e0 la fin de la p\u00e9riode par rapport au d\u00e9but."},
{q:"Un client qui reste fid\u00e8le parce que changer de fournisseur co\u00fbterait trop cher est un exemple de :",options:["Fid\u00e9lit\u00e9 attitudinale","Fid\u00e9lisation recherch\u00e9e","Fid\u00e9lisation induite (barri\u00e8res au changement)","Fid\u00e9lit\u00e9 \u00e9motionnelle"],correct:2,explanation:"La fid\u00e9lisation induite repose sur des co\u00fbts de changement \u00e9lev\u00e9s (switching costs) qui emp\u00eachent le client de partir."},
{q:"Le programme Nespresso Club offre des invitations \u00e0 des \u00e9v\u00e9nements exclusifs. Cela rel\u00e8ve de :",options:["R\u00e9compenses transactionnelles","B\u00e9n\u00e9fices relationnels et exp\u00e9rientiels","R\u00e9duction de prix classique","Strat\u00e9gie de prix bas"],correct:1,explanation:"Les invitations \u00e0 des \u00e9v\u00e9nements exclusifs sont des b\u00e9n\u00e9fices relationnels/exp\u00e9rientiels qui cr\u00e9ent un sentiment d\u2019appartenance."},
{q:"Pourquoi la personnalisation est-elle cl\u00e9 dans un programme de fid\u00e9lisation ?",options:["Elle r\u00e9duit le budget publicitaire","Elle permet d\u2019adapter les r\u00e9compenses aux pr\u00e9f\u00e9rences individuelles, augmentant la valeur per\u00e7ue","Elle est impos\u00e9e par la loi RGPD","Elle ne sert qu\u2019\u00e0 la communication de masse"],correct:1,explanation:"La personnalisation augmente la pertinence des offres et donc la valeur per\u00e7ue par le client, renfor\u00e7ant son engagement."},
{q:"Quel est le risque principal d\u2019un programme de fid\u00e9lisation mal con\u00e7u ?",options:["Augmenter la satisfaction client","D\u00e9truire de la valeur en offrant des remises sans augmenter la fid\u00e9lit\u00e9 r\u00e9elle","Am\u00e9liorer l\u2019image de marque","Cr\u00e9er trop de fid\u00e9lit\u00e9 \u00e9motionnelle"],correct:1,explanation:"Un programme mal con\u00e7u peut r\u00e9duire les marges (remises) sans g\u00e9n\u00e9rer de fid\u00e9lit\u00e9 r\u00e9elle : le client part d\u00e8s qu\u2019un concurrent offre mieux."}
];
let current=0,score=0,answered=false,timerInterval,seconds=0;function startTimer(){seconds=0;clearInterval(timerInterval);timerInterval=setInterval(()=>{seconds++;const m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');document.getElementById('timer').textContent='\u23F2 '+m+':'+s},1000)}function renderQuestion(){const q=questions[current];document.getElementById('current-q').textContent=current+1;document.getElementById('total-q').textContent=questions.length;document.getElementById('score').textContent=score;document.getElementById('progress').style.width=((current+1)/questions.length*100)+'%';document.getElementById('quiz-area').innerHTML=`<div class="question-card"><div class="question-num">Question ${current+1} / ${questions.length}</div><div class="question-text">${q.q}</div><div class="options">${q.options.map((opt,i)=>`<button class="option" onclick="answer(${i})" id="opt${i}">${opt}</button>`).join('')}</div><div class="explanation" id="explanation">${q.explanation}</div></div><div class="nav-buttons">${current>0?'<button class="btn btn-back" onclick="prev()">&larr; Pr\u00e9c\u00e9dent</button>':'<div></div>'}<button class="btn btn-next" id="btn-next" onclick="next()" disabled>Suivant &rarr;</button></div>`;answered=false}function answer(idx){if(answered)return;answered=true;const q=questions[current];document.querySelectorAll('.option').forEach(b=>b.disabled=true);if(idx===q.correct){document.getElementById('opt'+idx).classList.add('correct');score++}else{document.getElementById('opt'+idx).classList.add('wrong');document.getElementById('opt'+q.correct).classList.add('correct')}document.getElementById('explanation').style.display='block';document.getElementById('btn-next').disabled=false;document.getElementById('score').textContent=score}function next(){if(current<questions.length-1){current++;renderQuestion()}else{showResult()}}function prev(){if(current>0){current--;renderQuestion()}}function showResult(){clearInterval(timerInterval);document.getElementById('quiz-area').innerHTML='';const rc=document.getElementById('result-card');rc.style.display='block';document.getElementById('final-score').textContent=score;document.getElementById('final-total').textContent=questions.length;const pct=score/questions.length;document.getElementById('result-msg').textContent=pct>=.8?'\uD83C\uDFC6 Excellent ! Tu ma\u00eetrises ce chapitre.':pct>=.6?'\uD83D\uDC4D Bien ! Encore un peu de r\u00e9vision.':'\uD83D\uDCDA R\u00e9vise la synth\u00e8se et r\u00e9essaie !'}function restartQuiz(){current=0;score=0;answered=false;document.getElementById('result-card').style.display='none';startTimer();renderQuestion()}startTimer();renderQuestion();
</script>
