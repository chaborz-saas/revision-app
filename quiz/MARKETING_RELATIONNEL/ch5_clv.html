<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Quiz — Ch.5 — Customer Lifetime Value</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',sans-serif;background:#0f0f1a;color:#e0e0e0;min-height:100vh;padding:1.5rem}.quiz-header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);padding:1.5rem 2rem;border-radius:16px;margin-bottom:1.5rem;border-bottom:3px solid #e94560}.quiz-header .matiere{font-size:.75rem;text-transform:uppercase;letter-spacing:2px;color:#e94560;margin-bottom:.3rem}.quiz-header h1{font-size:1.3rem;font-weight:700;color:#fff}.quiz-container{max-width:800px;margin:0 auto}.progress-bar{background:rgba(255,255,255,.1);border-radius:10px;height:6px;margin-bottom:1.5rem}.progress-fill{background:#e94560;height:100%;border-radius:10px;transition:width .3s}.score-display{text-align:center;font-size:.85rem;color:#808090;margin-bottom:1rem}.timer{text-align:center;font-size:.85rem;color:#f59e0b;margin-bottom:.5rem;font-weight:600}.question-card{background:#1a1a2e;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:2rem;margin-bottom:1rem}.question-num{font-size:.7rem;text-transform:uppercase;letter-spacing:2px;color:#e94560;margin-bottom:.8rem;font-weight:700}.question-text{font-size:1.05rem;font-weight:600;color:#fff;margin-bottom:1.5rem;line-height:1.5}.options{display:grid;gap:.6rem}.option{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:.9rem 1.2rem;cursor:pointer;transition:all .2s;font-size:.92rem;color:#d0d0d8;text-align:left;width:100%}.option:hover:not(:disabled){background:rgba(233,69,96,.1);border-color:rgba(233,69,96,.4);color:#fff}.option.correct{background:rgba(16,185,129,.2);border-color:#10b981;color:#10b981;font-weight:600}.option.wrong{background:rgba(233,69,96,.2);border-color:#e94560;color:#e94560}.option:disabled{cursor:default}.explanation{background:rgba(233,69,96,.08);border-left:3px solid #e94560;padding:.8rem 1rem;margin-top:1rem;border-radius:0 8px 8px 0;font-size:.88rem;color:#f9a8b8;display:none}.nav-buttons{display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem;gap:1rem}.btn{padding:.7rem 1.5rem;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer;border:none;transition:all .2s}.btn-next{background:#e94560;color:#fff;margin-left:auto}.btn-next:hover{background:#c0392b}.btn-next:disabled{background:rgba(255,255,255,.1);color:#606070;cursor:default}.btn-back{background:rgba(255,255,255,.08);color:#d0d0d8}.btn-back:hover{background:rgba(255,255,255,.15)}.result-card{background:#1a1a2e;border-radius:16px;padding:3rem 2rem;text-align:center;display:none}.result-score{font-size:3.5rem;font-weight:800;color:#e94560;margin:1rem 0}.result-msg{font-size:1.1rem;color:#d0d0d8;margin-bottom:2rem}.btn-restart{background:#e94560;color:#fff;padding:.8rem 2rem;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;border:none}.back-link{display:inline-block;color:#808090;font-size:.8rem;text-decoration:none;margin-bottom:1rem}.back-link:hover{color:#e94560}</style></head><body>
<div class="quiz-container">

<div class="quiz-header"><div class="matiere">MARKETING RELATIONNEL &mdash; QUIZ</div><h1>Ch.5 &mdash; Customer Lifetime Value (CLV)</h1></div>
<div class="timer" id="timer">&#9202; 00:00</div>
<div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">10</span> &mdash; Score : <span id="score">0</span></div>
<div class="progress-bar"><div class="progress-fill" id="progress" style="width:10%"></div></div>
<div id="quiz-area"></div>
<div class="result-card" id="result-card"><div style="font-size:2rem">&#127919;</div><div class="result-score"><span id="final-score">0</span>/<span id="final-total">10</span></div><div class="result-msg" id="result-msg"></div><button class="btn-restart" onclick="restartQuiz()">Recommencer</button><br><br><a href="../../fr/index.html" class="back-link">&larr; Retour &agrave; l'accueil</a></div>
</div>
<script>
const questions=[
{q:"Selon la loi de Pareto appliqu\u00e9e au marketing, quel pourcentage de clients g\u00e9n\u00e8re 80 % des revenus ?",options:["50 %","30 %","20 %","10 %"],correct:2,explanation:"La loi de Pareto (20/80) stipule que 20 % des clients g\u00e9n\u00e8rent 80 % des revenus."},
{q:"Selon la r\u00e8gle de Sherden (80/20/30), les 30 % de clients les moins rentables peuvent :",options:["G\u00e9n\u00e9rer 30 % des profits","Faire perdre jusqu\u2019\u00e0 la moiti\u00e9 des profits g\u00e9n\u00e9r\u00e9s par les 20 % meilleurs clients","Ne pas avoir d\u2019impact sur la rentabilit\u00e9","Repr\u00e9senter les clients les plus fid\u00e8les"],correct:1,explanation:"Sherden (1994) montre que les 30 % de clients non rentables peuvent effacer 50 % des gains des 20 % meilleurs clients."},
{q:"La formule simplifi\u00e9e de la CLV est :",options:["CA \u00d7 Nombre de produits \u00d7 Dur\u00e9e","Marge par achat \u00d7 Nombre d\u2019achats par an \u00d7 Dur\u00e9e de la relation \u2212 Co\u00fbts marketing","Prix de vente \u00d7 Volume \u00d7 Taux de marge","Chiffre d\u2019affaires \u2212 Co\u00fbt de production"],correct:1,explanation:"CLV simplifi\u00e9e = Marge par achat \u00d7 Fr\u00e9quence d\u2019achat \u00d7 Dur\u00e9e de la relation \u2212 Co\u00fbts marketing."},
{q:"Un client de boulangerie ach\u00e8te 3 fois par semaine, pour 5\u20ac de marge, depuis 8 ans. Quelle est sa CLV brute ?",options:["1 240 \u20ac","3 120 \u20ac","6 240 \u20ac","12 480 \u20ac"],correct:2,explanation:"CLV = 5\u20ac \u00d7 3 \u00d7 52 semaines \u00d7 8 ans = 6 240\u20ac."},
{q:"Lequel N\u2019EST PAS une erreur courante dans le calcul de la CLV ?",options:["Confondre chiffre d\u2019affaires et marge","Oublier les co\u00fbts de service et d\u2019acquisition","Int\u00e9grer le taux d\u2019actualisation dans le calcul","Croire que le panier moyen le plus \u00e9lev\u00e9 = CLV la plus forte"],correct:2,explanation:"Int\u00e9grer le taux d\u2019actualisation est une bonne pratique (m\u00e9thode complexe), pas une erreur. Les trois autres sont des pi\u00e8ges fr\u00e9quents."},
{q:"Vrai ou faux : un client au panier moyen \u00e9lev\u00e9 a toujours une CLV sup\u00e9rieure \u00e0 un client au panier modeste.",options:["Vrai, le montant unitaire est d\u00e9terminant","Faux, la dur\u00e9e et la fr\u00e9quence comptent autant que le montant unitaire","Vrai, la CLV d\u00e9pend uniquement du panier moyen","Faux, la CLV ne d\u00e9pend que de la dur\u00e9e"],correct:1,explanation:"Un client au panier modeste mais tr\u00e8s fid\u00e8le et fr\u00e9quent peut avoir une CLV bien sup\u00e9rieure (ex : 50\u20ac \u00d7 24/an \u00d7 5 ans = 6 000\u20ac vs 500\u20ac \u00d7 1)."},
{q:"Quelle est la r\u00e8gle d\u2019or de la CLV pour l\u2019acquisition ?",options:["Le co\u00fbt d\u2019acquisition doit \u00eatre \u00e9gal \u00e0 la CLV","Le co\u00fbt d\u2019acquisition ne doit jamais d\u00e9passer la CLV","La CLV n\u2019a pas de rapport avec l\u2019acquisition","Le co\u00fbt d\u2019acquisition doit \u00eatre le plus \u00e9lev\u00e9 possible"],correct:1,explanation:"Si le co\u00fbt d\u2019acquisition d\u00e9passe la CLV, chaque nouveau client co\u00fbte plus qu\u2019il ne rapporte : l\u2019entreprise d\u00e9truit de la valeur."},
{q:"Le taux d\u2019actualisation dans la m\u00e9thode complexe de CLV sert \u00e0 :",options:["Augmenter la valeur future des clients","Ramener les flux financiers futurs \u00e0 leur valeur pr\u00e9sente","Calculer le chiffre d\u2019affaires annuel","Estimer le nombre de clients futurs"],correct:1,explanation:"Le taux d\u2019actualisation refl\u00e8te le co\u00fbt du capital et le risque : un euro re\u00e7u dans 5 ans vaut moins qu\u2019un euro aujourd\u2019hui."},
{q:"Quelle strat\u00e9gie peut \u00eatre adopt\u00e9e pour les clients non rentables identifi\u00e9s par la CLV ?",options:["Les exclure syst\u00e9matiquement de toute communication","Les transformer en clients rentables ou ajuster l\u2019offre/le niveau de service","Leur offrir plus de r\u00e9ductions pour les fid\u00e9liser","Ignorer leur existence dans l\u2019analyse"],correct:1,explanation:"Trois strat\u00e9gies : les rendre rentables (frais, prix), ajuster l\u2019offre (self-service) ou diff\u00e9rencier les niveaux de service."},
{q:"Pourquoi la CLV est-elle qualifi\u00e9e d\u2019indicateur prospectif ?",options:["Elle mesure le pass\u00e9 du client","Elle mesure ce que le client est susceptible de rapporter dans le futur","Elle est calcul\u00e9e une seule fois et ne change plus","Elle ne concerne que les nouveaux clients"],correct:1,explanation:"La CLV est prospective : elle estime la valeur future d\u2019un client, pas son historique pass\u00e9."}
];
let current=0,score=0,answered=false,timerInterval,seconds=0;function startTimer(){seconds=0;clearInterval(timerInterval);timerInterval=setInterval(()=>{seconds++;const m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');document.getElementById('timer').textContent='\u23F2 '+m+':'+s},1000)}function renderQuestion(){const q=questions[current];document.getElementById('current-q').textContent=current+1;document.getElementById('total-q').textContent=questions.length;document.getElementById('score').textContent=score;document.getElementById('progress').style.width=((current+1)/questions.length*100)+'%';document.getElementById('quiz-area').innerHTML=`<div class="question-card"><div class="question-num">Question ${current+1} / ${questions.length}</div><div class="question-text">${q.q}</div><div class="options">${q.options.map((opt,i)=>`<button class="option" onclick="answer(${i})" id="opt${i}">${opt}</button>`).join('')}</div><div class="explanation" id="explanation">${q.explanation}</div></div><div class="nav-buttons">${current>0?'<button class="btn btn-back" onclick="prev()">&larr; Pr\u00e9c\u00e9dent</button>':'<div></div>'}<button class="btn btn-next" id="btn-next" onclick="next()" disabled>Suivant &rarr;</button></div>`;answered=false}function answer(idx){if(answered)return;answered=true;const q=questions[current];document.querySelectorAll('.option').forEach(b=>b.disabled=true);if(idx===q.correct){document.getElementById('opt'+idx).classList.add('correct');score++}else{document.getElementById('opt'+idx).classList.add('wrong');document.getElementById('opt'+q.correct).classList.add('correct')}document.getElementById('explanation').style.display='block';document.getElementById('btn-next').disabled=false;document.getElementById('score').textContent=score}function next(){if(current<questions.length-1){current++;renderQuestion()}else{showResult()}}function prev(){if(current>0){current--;renderQuestion()}}function showResult(){clearInterval(timerInterval);document.getElementById('quiz-area').innerHTML='';const rc=document.getElementById('result-card');rc.style.display='block';document.getElementById('final-score').textContent=score;document.getElementById('final-total').textContent=questions.length;const pct=score/questions.length;document.getElementById('result-msg').textContent=pct>=.8?'\uD83C\uDFC6 Excellent !':pct>=.6?'\uD83D\uDC4D Bien ! Encore un effort.':'\uD83D\uDCDA R\u00e9vise la synth\u00e8se et r\u00e9essaie !'}function restartQuiz(){current=0;score=0;answered=false;document.getElementById('result-card').style.display='none';startTimer();renderQuestion()}startTimer();renderQuestion();
</script>
