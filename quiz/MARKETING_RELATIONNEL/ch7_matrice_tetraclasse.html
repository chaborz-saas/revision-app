<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Quiz — Ch.7 — Matrice T&eacute;traclasse</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Inter',sans-serif;background:#0f0f1a;color:#e0e0e0;min-height:100vh;padding:1.5rem}.quiz-header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);padding:1.5rem 2rem;border-radius:16px;margin-bottom:1.5rem;border-bottom:3px solid #e94560}.quiz-header .matiere{font-size:.75rem;text-transform:uppercase;letter-spacing:2px;color:#e94560;margin-bottom:.3rem}.quiz-header h1{font-size:1.3rem;font-weight:700;color:#fff}.quiz-container{max-width:800px;margin:0 auto}.progress-bar{background:rgba(255,255,255,.1);border-radius:10px;height:6px;margin-bottom:1.5rem}.progress-fill{background:#e94560;height:100%;border-radius:10px;transition:width .3s}.score-display{text-align:center;font-size:.85rem;color:#808090;margin-bottom:1rem}.timer{text-align:center;font-size:.85rem;color:#f59e0b;margin-bottom:.5rem;font-weight:600}.question-card{background:#1a1a2e;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:2rem;margin-bottom:1rem}.question-num{font-size:.7rem;text-transform:uppercase;letter-spacing:2px;color:#e94560;margin-bottom:.8rem;font-weight:700}.question-text{font-size:1.05rem;font-weight:600;color:#fff;margin-bottom:1.5rem;line-height:1.5}.options{display:grid;gap:.6rem}.option{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:.9rem 1.2rem;cursor:pointer;transition:all .2s;font-size:.92rem;color:#d0d0d8;text-align:left;width:100%}.option:hover:not(:disabled){background:rgba(233,69,96,.1);border-color:rgba(233,69,96,.4);color:#fff}.option.correct{background:rgba(16,185,129,.2);border-color:#10b981;color:#10b981;font-weight:600}.option.wrong{background:rgba(233,69,96,.2);border-color:#e94560;color:#e94560}.option:disabled{cursor:default}.explanation{background:rgba(233,69,96,.08);border-left:3px solid #e94560;padding:.8rem 1rem;margin-top:1rem;border-radius:0 8px 8px 0;font-size:.88rem;color:#f9a8b8;display:none}.nav-buttons{display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem;gap:1rem}.btn{padding:.7rem 1.5rem;border-radius:10px;font-size:.9rem;font-weight:600;cursor:pointer;border:none;transition:all .2s}.btn-next{background:#e94560;color:#fff;margin-left:auto}.btn-next:hover{background:#c0392b}.btn-next:disabled{background:rgba(255,255,255,.1);color:#606070;cursor:default}.btn-back{background:rgba(255,255,255,.08);color:#d0d0d8}.btn-back:hover{background:rgba(255,255,255,.15)}.result-card{background:#1a1a2e;border-radius:16px;padding:3rem 2rem;text-align:center;display:none}.result-score{font-size:3.5rem;font-weight:800;color:#e94560;margin:1rem 0}.result-msg{font-size:1.1rem;color:#d0d0d8;margin-bottom:2rem}.btn-restart{background:#e94560;color:#fff;padding:.8rem 2rem;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;border:none}.back-link{display:inline-block;color:#808090;font-size:.8rem;text-decoration:none;margin-bottom:1rem}.back-link:hover{color:#e94560}</style></head><body>
<div class="quiz-container">
<a href="../../fr/index.html" class="back-link">&larr; Retour &agrave; l'accueil</a>
<div class="quiz-header"><div class="matiere">MARKETING RELATIONNEL &mdash; QUIZ</div><h1>Ch.7 &mdash; La Matrice T&eacute;traclasse</h1></div>
<div class="timer" id="timer">&#9202; 00:00</div>
<div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">10</span> &mdash; Score : <span id="score">0</span></div>
<div class="progress-bar"><div class="progress-fill" id="progress" style="width:10%"></div></div>
<div id="quiz-area"></div>
<div class="result-card" id="result-card"><div style="font-size:2rem">&#127919;</div><div class="result-score"><span id="final-score">0</span>/<span id="final-total">10</span></div><div class="result-msg" id="result-msg"></div><button class="btn-restart" onclick="restartQuiz()">Recommencer</button><br><br><a href="../../fr/index.html" class="back-link">&larr; Retour &agrave; l'accueil</a></div>
</div>
<script>
const questions=[
{q:"Qui est le cr\u00e9ateur de la matrice T\u00e9traclasse ?",options:["Michael Porter","Philip Kotler","Jean-Marc Ferrandi (2000)","Noriaki Kano"],correct:2,explanation:"La matrice T\u00e9traclasse a \u00e9t\u00e9 cr\u00e9\u00e9e par Jean-Marc Ferrandi en 2000."},
{q:"Un attribut de base dans la matrice T\u00e9traclasse se caract\u00e9rise par :",options:["Forte satisfaction si pr\u00e9sent, aucun impact si absent","Satisfaction neutre si pr\u00e9sent, forte insatisfaction si absent","Impact proportionnel dans les deux cas","Aucun impact dans aucun cas"],correct:1,explanation:"Les attributs de base sont attendus : leur pr\u00e9sence ne cr\u00e9e pas de satisfaction particuli\u00e8re, mais leur absence provoque une forte insatisfaction."},
{q:"Dans un h\u00f4tel, un cadeau de bienvenue surprise est un attribut de :",options:["Base","Performance","Charme","Indiff\u00e9rent"],correct:2,explanation:"Un cadeau de bienvenue surprise cr\u00e9e un effet \u00ab wow \u00bb non attendu = attribut de charme (enthousiasmant)."},
{q:"Lequel de ces attributs h\u00f4teliers est un attribut indiff\u00e9rent ?",options:["La propret\u00e9 des chambres","La qualit\u00e9 du petit-d\u00e9jeuner","La couleur des serviettes","Un upgrade surprise de chambre"],correct:2,explanation:"La couleur des serviettes n\u2019influence ni la satisfaction ni l\u2019insatisfaction du client = attribut indiff\u00e9rent."},
{q:"Vrai ou faux : un attribut de charme aujourd\u2019hui peut devenir un attribut de base demain.",options:["Vrai, les attentes clients \u00e9voluent et int\u00e8grent les anciens \u00ab plus \u00bb comme standards","Faux, les cat\u00e9gories sont fixes","Vrai, mais seulement pour les attributs de performance","Faux, un attribut de charme reste toujours un charme"],correct:0,explanation:"Exemple : le Wi-Fi gratuit en h\u00f4tel \u00e9tait un attribut de charme il y a 15 ans, c\u2019est un attribut de base aujourd\u2019hui."},
{q:"Quel est l\u2019ordre de priorit\u00e9 d\u2019action selon la matrice T\u00e9traclasse ?",options:["Charme \u2192 Performance \u2192 Base \u2192 Indiff\u00e9rent","Indiff\u00e9rent \u2192 Base \u2192 Performance \u2192 Charme","Base \u2192 Performance \u2192 Charme \u2192 Ne pas surinvestir dans les indiff\u00e9rents","Performance \u2192 Charme \u2192 Indiff\u00e9rent \u2192 Base"],correct:2,explanation:"Priorit\u00e9s : 1) S\u00e9curiser la base, 2) Am\u00e9liorer la performance, 3) Innover sur le charme, 4) Ne pas surinvestir dans les indiff\u00e9rents."},
{q:"Les attributs de performance ont un impact :",options:["Uniquement positif","Uniquement n\u00e9gatif","Proportionnel : satisfaction quand la qualit\u00e9 augmente, insatisfaction quand elle diminue","Aucun impact mesurable"],correct:2,explanation:"Les attributs de performance sont lin\u00e9aires : plus leur qualit\u00e9 est \u00e9lev\u00e9e, plus la satisfaction augmente, et inversement."},
{q:"Lequel N\u2019EST PAS un avantage de la matrice T\u00e9traclasse ?",options:["Simplicit\u00e9 et flexibilit\u00e9 d\u2019utilisation","Identification claire des priorit\u00e9s d\u2019investissement","Garantie que les attributs ne changent jamais de cat\u00e9gorie","Adaptable \u00e0 tous les secteurs d\u2019activit\u00e9"],correct:2,explanation:"Les attributs peuvent changer de cat\u00e9gorie selon les segments clients et dans le temps. C\u2019est une limite, pas un avantage."},
{q:"La m\u00e9thodologie de la matrice T\u00e9traclasse repose sur l\u2019analyse de l\u2019impact de chaque attribut :",options:["Uniquement en pr\u00e9sence","Uniquement en absence","En pr\u00e9sence ET en absence (asym\u00e9trie)","Par rapport au prix"],correct:2,explanation:"La m\u00e9thodologie mesure l\u2019impact de chaque attribut \u00e0 la fois en pr\u00e9sence et en absence, exploitant l\u2019asym\u00e9trie satisfaction/insatisfaction."},
{q:"Un h\u00f4tel investit massivement dans le style des poign\u00e9es de porte. Selon la matrice T\u00e9traclasse, c\u2019est :",options:["Un investissement strat\u00e9gique pertinent","Un gaspillage car c\u2019est un attribut indiff\u00e9rent","Un renforcement de l\u2019attribut de base","Une innovation de charme"],correct:1,explanation:"Le style des poign\u00e9es de porte est un attribut indiff\u00e9rent : il n\u2019influence ni la satisfaction ni l\u2019insatisfaction. Y investir est un gaspillage."}
];
let current=0,score=0,answered=false,timerInterval,seconds=0;function startTimer(){seconds=0;clearInterval(timerInterval);timerInterval=setInterval(()=>{seconds++;const m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');document.getElementById('timer').textContent='\u23F2 '+m+':'+s},1000)}function renderQuestion(){const q=questions[current];document.getElementById('current-q').textContent=current+1;document.getElementById('total-q').textContent=questions.length;document.getElementById('score').textContent=score;document.getElementById('progress').style.width=((current+1)/questions.length*100)+'%';document.getElementById('quiz-area').innerHTML=`<div class="question-card"><div class="question-num">Question ${current+1} / ${questions.length}</div><div class="question-text">${q.q}</div><div class="options">${q.options.map((opt,i)=>`<button class="option" onclick="answer(${i})" id="opt${i}">${opt}</button>`).join('')}</div><div class="explanation" id="explanation">${q.explanation}</div></div><div class="nav-buttons">${current>0?'<button class="btn btn-back" onclick="prev()">&larr; Pr\u00e9c\u00e9dent</button>':'<div></div>'}<button class="btn btn-next" id="btn-next" onclick="next()" disabled>Suivant &rarr;</button></div>`;answered=false}function answer(idx){if(answered)return;answered=true;const q=questions[current];document.querySelectorAll('.option').forEach(b=>b.disabled=true);if(idx===q.correct){document.getElementById('opt'+idx).classList.add('correct');score++}else{document.getElementById('opt'+idx).classList.add('wrong');document.getElementById('opt'+q.correct).classList.add('correct')}document.getElementById('explanation').style.display='block';document.getElementById('btn-next').disabled=false;document.getElementById('score').textContent=score}function next(){if(current<questions.length-1){current++;renderQuestion()}else{showResult()}}function prev(){if(current>0){current--;renderQuestion()}}function showResult(){clearInterval(timerInterval);document.getElementById('quiz-area').innerHTML='';const rc=document.getElementById('result-card');rc.style.display='block';document.getElementById('final-score').textContent=score;document.getElementById('final-total').textContent=questions.length;const pct=score/questions.length;document.getElementById('result-msg').textContent=pct>=.8?'\uD83C\uDFC6 Excellent !':pct>=.6?'\uD83D\uDC4D Bien ! Encore un effort.':'\uD83D\uDCDA R\u00e9vise la synth\u00e8se et r\u00e9essaie !'}function restartQuiz(){current=0;score=0;answered=false;document.getElementById('result-card').style.display='none';startTimer();renderQuestion()}startTimer();renderQuestion();
</script>
