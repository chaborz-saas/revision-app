<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz — Introduction et Elaboration budgetaire</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; padding: 1.5rem; }
        .quiz-header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 1.5rem 2rem; border-radius: 16px; margin-bottom: 1.5rem; border-bottom: 3px solid #8b5cf6; }
        .quiz-header .matiere { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #8b5cf6; margin-bottom: 0.3rem; }
        .quiz-header h1 { font-size: 1.3rem; font-weight: 700; color: white; }
        .quiz-container { max-width: 800px; margin: 0 auto; }
        .progress-bar { background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; margin-bottom: 1.5rem; }
        .progress-fill { background: #8b5cf6; height: 100%; border-radius: 10px; transition: width 0.3s; }
        .score-display { text-align: center; font-size: 0.85rem; color: #808090; margin-bottom: 1rem; }
        .question-card { background: #1a1a2e; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 2rem; margin-bottom: 1rem; }
        .question-num { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #8b5cf6; margin-bottom: 0.8rem; font-weight: 700; }
        .question-text { font-size: 1.05rem; font-weight: 600; color: white; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: grid; gap: 0.6rem; }
        .option { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0.9rem 1.2rem; cursor: pointer; transition: all 0.2s; font-size: 0.92rem; color: #d0d0d8; text-align: left; width: 100%; }
        .option:hover:not(:disabled) { background: rgba(139,92,246,0.1); border-color: rgba(139,92,246,0.4); color: white; }
        .option.correct { background: rgba(16,185,129,0.2); border-color: #10b981; color: #10b981; font-weight: 600; }
        .option.wrong { background: rgba(233,69,96,0.2); border-color: #e94560; color: #e94560; }
        .option:disabled { cursor: default; }
        .explanation { background: rgba(139,92,246,0.08); border-left: 3px solid #8b5cf6; padding: 0.8rem 1rem; margin-top: 1rem; border-radius: 0 8px 8px 0; font-size: 0.88rem; color: #c4b5fd; display: none; }
        .nav-buttons { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; gap: 1rem; }
        .btn { padding: 0.7rem 1.5rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-next { background: #8b5cf6; color: white; margin-left: auto; }
        .btn-next:hover { background: #7c3aed; }
        .btn-next:disabled { background: rgba(255,255,255,0.1); color: #606070; cursor: default; }
        .btn-back { background: rgba(255,255,255,0.08); color: #d0d0d8; }
        .result-card { background: #1a1a2e; border-radius: 16px; padding: 3rem 2rem; text-align: center; display: none; }
        .result-score { font-size: 3.5rem; font-weight: 800; color: #8b5cf6; margin: 1rem 0; }
        .result-msg { font-size: 1.1rem; color: #d0d0d8; margin-bottom: 2rem; }
        .btn-restart { background: #8b5cf6; color: white; padding: 0.8rem 2rem; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; border: none; }
        .back-link { display: inline-block; color: #808090; font-size: 0.8rem; text-decoration: none; margin-bottom: 1rem; }
        .back-link:hover { color: #8b5cf6; }
    </style>
</head>
<body>
<div class="quiz-container">
    <a href="../../index.html" class="back-link">← Retour à l'accueil</a>
    <div class="quiz-header">
        <div class="matiere">PILOTAGE DE LA PERFORMANCE — QUIZ</div>
        <h1>Introduction et Elaboration budgetaire</h1>
    </div>
    <div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">10</span> — Score : <span id="score">0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:10%"></div></div>
    <div id="quiz-area"></div>
    <div class="result-card" id="result-card">
        <div style="font-size:2rem">🎯</div>
        <div class="result-score"><span id="final-score">0</span>/<span id="final-total">10</span></div>
        <div class="result-msg" id="result-msg"></div>
        <button class="btn-restart" onclick="restartQuiz()">Recommencer</button>
        <br><br>
        <a href="../../index.html" class="back-link">← Retour à l'accueil</a>
    </div>
</div>
<script>
const questions = [
    {
        q: "Combien de fonctions le budget remplit-il selon le cours ?",
        options: ["3 fonctions", "4 fonctions", "5 fonctions", "6 fonctions"],
        correct: 2,
        explanation: "Le budget remplit 5 fonctions : prévision, attribution d'objectifs et de moyens, délégation et motivation, coordination et communication, optimisation des choix."
    },
    {
        q: "Comment fonctionne le rolling forecast ?",
        options: ["Révision annuelle sur 12 mois fixes", "Réévaluation trimestrielle sur 6 trimestres roulants (1 réel + 5 estimés)", "Révision mensuelle sur 3 mois glissants", "Prévision semestrielle sur 2 semestres"],
        correct: 1,
        explanation: "Le rolling forecast est une réévaluation trimestrielle sur 6 trimestres roulants (1 réel + 5 estimés). Les chiffres de décembre N servent de cible pour les primes variables de N+1."
    },
    {
        q: "Quel est le principe du Budget Base Zéro (BBZ) ?",
        options: ["Reconduire chaque poste automatiquement avec une légère hausse", "Justifier chaque poste budgétaire depuis zéro sans reconduction automatique", "Fixer un budget global et le décomposer top-down", "Utiliser les données des 3 dernières années comme base"],
        correct: 1,
        explanation: "Le BBZ impose de justifier chaque poste budgétaire depuis zéro. Mis au point par P. Pyhrr (années 80, Texas Instruments), il est adapté aux frais de structure et aux administrations."
    },
    {
        q: "Quelle est la formule de la TVA à décaisser ?",
        options: ["TVA collectée + TVA déductible", "TVA déductible - TVA collectée", "TVA collectée - TVA déductible", "TVA collectée × taux de déductibilité"],
        correct: 2,
        explanation: "TVA à décaisser = TVA collectée - TVA déductible. Si TVA déductible > TVA collectée, il y a un crédit de TVA reporté sur la période suivante. La TVA du mois M est payée au mois M+1."
    },
    {
        q: "Dans l'approche budgétaire mixte (pratique), quel outil lance le processus ?",
        options: ["Le business plan stratégique", "La lettre de cadrage de la direction", "Le bilan social de l'année précédente", "Le rolling forecast du dernier trimestre"],
        correct: 1,
        explanation: "L'approche mixte combine une lettre de cadrage (top-down) avec les remontées terrain (bottom-up). C'est l'approche la plus courante car elle équilibre rapidité et responsabilisation."
    },
    {
        q: "La formule de l'écart économique sur matière (EM) est :",
        options: ["(Qr - Qp) × Pr + (Pr - Pp) × Qp", "(Qr - Qp) × Pp + (Pr - Pp) × Qr", "(Pr - Pp) × Qp + (Qr - Qp) × Pr", "(Qr + Qp) × (Pr - Pp)"],
        correct: 1,
        explanation: "EM = (Qr - Qp) × Pp + (Pr - Pp) × Qr. Le premier terme est l'écart sur quantités (valorisé au coût prévu), le second est l'écart sur prix (valorisé à la quantité réelle)."
    },
    {
        q: "Quelle est la principale limite de l'approche bottom-up du budget ?",
        options: ["Elle est trop rapide et manque de détail", "Elle dévalorise les managers opérationnels", "Elle tend à être inflationniste (les managers gonflent leurs demandes)", "Elle ne permet pas la coordination entre services"],
        correct: 2,
        explanation: "L'approche bottom-up responsabilise et fournit du détail, mais elle est souvent inflationniste : les managers ont tendance à demander plus que nécessaire pour se ménager des marges de manœuvre."
    },
    {
        q: "Le budget de trésorerie utilise le CA TTC ou HT pour calculer les encaissements clients ?",
        options: ["Le CA HT, car la TVA est gérée séparément", "Le CA TTC, car c'est la somme réellement encaissée", "La moyenne des deux selon la période", "Le CA HT majoré du taux de TVA moyen"],
        correct: 1,
        explanation: "On utilise le CA TTC pour calculer les encaissements clients, car c'est le montant réellement versé par le client. La TVA collectée est ensuite soustraite dans le budget de TVA."
    },
    {
        q: "Le contrôle budgetaire est défini comme une 'gestion par exception'. Que cela signifie-t-il ?",
        options: ["On ne contrôle que les postes budgétaires exceptionnels (investissements)", "Seuls les écarts significatifs déclenchent une analyse approfondie et des mesures correctives", "On effectue des contrôles aléatoires pour éviter la fraude", "Le budget n'est contrôlé qu'en fin d'exercice"],
        correct: 1,
        explanation: "La gestion par exception signifie que l'on se concentre sur les écarts remarquables plutôt que de traiter tous les écarts de la même manière. Cela permet d'orienter l'énergie sur ce qui compte vraiment."
    },
    {
        q: "Quelle méthode de prévision consiste à abandonner totalement le budget au profit d'une culture de confiance ?",
        options: ["Rolling forecast", "Budget Base Zéro (BBZ)", "Beyond Budgeting", "Modèle de simulation"],
        correct: 2,
        explanation: "Le Beyond Budgeting prône l'abandon complet du budget traditionnel. D'origine scandinave, il repose sur une culture de confiance et nécessite l'exemplarité des dirigeants."
    }
];
let current = 0, score = 0, answered = false;
function renderQuestion() {
    const q = questions[current];
    document.getElementById('current-q').textContent = current + 1;
    document.getElementById('total-q').textContent = questions.length;
    document.getElementById('score').textContent = score;
    document.getElementById('progress').style.width = ((current + 1) / questions.length * 100) + '%';
    document.getElementById('quiz-area').innerHTML = `
        <div class="question-card">
            <div class="question-num">Question ${current + 1} / ${questions.length}</div>
            <div class="question-text">${q.q}</div>
            <div class="options">${q.options.map((opt, i) => `<button class="option" onclick="answer(${i})" id="opt${i}">${opt}</button>`).join('')}</div>
            <div class="explanation" id="explanation">${q.explanation}</div>
        </div>
        <div class="nav-buttons">
            ${current > 0 ? '<button class="btn btn-back" onclick="prev()">← Précédent</button>' : '<div></div>'}
            <button class="btn btn-next" id="btn-next" onclick="next()" disabled>Suivant →</button>
        </div>`;
    answered = false;
}
function answer(idx) {
    if (answered) return; answered = true;
    const q = questions[current];
    document.querySelectorAll('.option').forEach(b => b.disabled = true);
    if (idx === q.correct) { document.getElementById('opt' + idx).classList.add('correct'); score++; }
    else { document.getElementById('opt' + idx).classList.add('wrong'); document.getElementById('opt' + q.correct).classList.add('correct'); }
    document.getElementById('explanation').style.display = 'block';
    document.getElementById('btn-next').disabled = false;
    document.getElementById('score').textContent = score;
}
function next() { if (current < questions.length - 1) { current++; renderQuestion(); } else { showResult(); } }
function prev() { if (current > 0) { current--; renderQuestion(); } }
function showResult() {
    document.getElementById('quiz-area').innerHTML = '';
    document.getElementById('result-card').style.display = 'block';
    document.getElementById('final-score').textContent = score;
    document.getElementById('final-total').textContent = questions.length;
    const pct = score / questions.length;
    document.getElementById('result-msg').textContent = pct >= 0.8 ? '🏆 Excellent ! Tu maîtrises ce chapitre.' : pct >= 0.6 ? '👍 Bien ! Encore un peu de révision.' : '📚 Révise la synthèse et réessaie !';
}
function restartQuiz() { current = 0; score = 0; answered = false; document.getElementById('result-card').style.display = 'none'; renderQuestion(); }
renderQuestion();
</script>
</body>
</html>
