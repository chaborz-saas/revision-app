<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz — Analyse des écarts</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; padding: 1.5rem; }
        .quiz-header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 1.5rem 2rem; border-radius: 16px; margin-bottom: 1.5rem; border-bottom: 3px solid #8b5cf6; }
        .quiz-header .matiere { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #8b5cf6; margin-bottom: 0.3rem; }
        .quiz-header h1 { font-size: 1.3rem; font-weight: 700; color: white; }
        .quiz-container { max-width: 800px; margin: 0 auto; }
        .progress-bar { background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; margin-bottom: 1.5rem; }
        .progress-fill { background: #8b5cf6; height: 100%; border-radius: 10px; transition: width 0.3s; }
        .score-display { text-align: center; font-size: 0.85rem; color: #808090; margin-bottom: 1rem; }
        .question-card { background: #1a1a2e; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 2rem; margin-bottom: 1rem; }
        .question-num { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #8b5cf6; margin-bottom: 0.8rem; font-weight: 700; }
        .question-text { font-size: 1.05rem; font-weight: 600; color: white; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: grid; gap: 0.6rem; }
        .option { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0.9rem 1.2rem; cursor: pointer; transition: all 0.2s; font-size: 0.92rem; color: #d0d0d8; text-align: left; width: 100%; }
        .option:hover:not(:disabled) { background: rgba(139,92,246,0.1); border-color: rgba(139,92,246,0.4); color: white; }
        .option.correct { background: rgba(16,185,129,0.2); border-color: #10b981; color: #10b981; font-weight: 600; }
        .option.wrong { background: rgba(233,69,96,0.2); border-color: #e94560; color: #e94560; }
        .option:disabled { cursor: default; }
        .explanation { background: rgba(139,92,246,0.08); border-left: 3px solid #8b5cf6; padding: 0.8rem 1rem; margin-top: 1rem; border-radius: 0 8px 8px 0; font-size: 0.88rem; color: #c4b5fd; display: none; }
        .nav-buttons { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; gap: 1rem; }
        .btn { padding: 0.7rem 1.5rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-next { background: #8b5cf6; color: white; margin-left: auto; }
        .btn-next:hover { background: #7c3aed; }
        .btn-next:disabled { background: rgba(255,255,255,0.1); color: #606070; cursor: default; }
        .btn-back { background: rgba(255,255,255,0.08); color: #d0d0d8; }
        .result-card { background: #1a1a2e; border-radius: 16px; padding: 3rem 2rem; text-align: center; display: none; }
        .result-score { font-size: 3.5rem; font-weight: 800; color: #8b5cf6; margin: 1rem 0; }
        .result-msg { font-size: 1.1rem; color: #d0d0d8; margin-bottom: 2rem; }
        .btn-restart { background: #8b5cf6; color: white; padding: 0.8rem 2rem; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; border: none; }
        .back-link { display: inline-block; color: #808090; font-size: 0.8rem; text-decoration: none; margin-bottom: 1rem; }
        .back-link:hover { color: #8b5cf6; }
    </style>
</head>
<body>
<div class="quiz-container">
    <a href="../../index.html" class="back-link">← Retour à l'accueil</a>
    <div class="quiz-header">
        <div class="matiere">PILOTAGE DE LA PERFORMANCE — QUIZ</div>
        <h1>L'analyse des écarts</h1>
    </div>
    <div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">10</span> — Score : <span id="score">0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:10%"></div></div>
    <div id="quiz-area"></div>
    <div class="result-card" id="result-card">
        <div style="font-size:2rem">🎯</div>
        <div class="result-score"><span id="final-score">0</span>/<span id="final-total">10</span></div>
        <div class="result-msg" id="result-msg"></div>
        <button class="btn-restart" onclick="restartQuiz()">Recommencer</button>
        <br><br>
        <a href="../../index.html" class="back-link">← Retour à l'accueil</a>
    </div>
</div>
<script>
const questions = [
    {
        q: "Quelle est la formule de l'écart sur prix de vente ?",
        options: ["(Prix réel - Prix prévu) × Quantités prévues", "(Prix réel - Prix prévu) × Quantités réellement vendues", "(Quantités réelles - Quantités prévues) × Prix réel", "(CA réel - CA prévu) / Quantités réelles"],
        correct: 1,
        explanation: "Écart sur prix de vente = (Prix réel - Prix prévu) × Quantités réellement vendues. Un résultat positif signifie que le prix réel est supérieur au prix prévu : c'est un écart favorable."
    },
    {
        q: "Un écart est dit 'favorable' lorsque :",
        options: ["Il est positif en valeur absolue", "Il contribue positivement au résultat (recette réelle > prévue ou coût réel < prévu)", "Il dépasse 5 % de l'écart budgété", "Il est validé par la direction générale"],
        correct: 1,
        explanation: "Un écart favorable contribue positivement au résultat : soit la recette réelle est supérieure à la prévue, soit le coût réel est inférieur au prévu. La convention de signe est essentielle."
    },
    {
        q: "Dans le cas SEUROL, quel écart représente 91 % de l'écart global défavorable ?",
        options: ["L'écart sur prix de vente (-70 000 €)", "L'écart sur activité (-127 026 €)", "L'écart sur mix-produits (-2 437 755 €)", "L'écart sur coût de production (-43 203 €)"],
        correct: 2,
        explanation: "L'écart sur mix-produits (-2 437 755 €) représente 91 % de l'écart global. Il est dû à l'effondrement des ventes de tablettes (marge std = 779 €/u) au profit des enceintes bluetooth (marge std = 28 €/u)."
    },
    {
        q: "La formule de l'écart sur quantités de matières consommées est :",
        options: ["(Qr - Qp) × Pr", "(Qr - Qp) × Pp", "(Pr - Pp) × Qr", "(Pr - Pp) × Qp"],
        correct: 1,
        explanation: "Écart sur quantités matières = (Qr - Qp) × Pp. On valorise l'écart de quantité au coût prévu (Pp) pour isoler l'effet quantité de l'effet prix."
    },
    {
        q: "La formule de l'écart sur taux horaire de MOD est :",
        options: ["(Tr - Tp) × Sp", "(Sr - Sp) × Tr", "(Sr - Sp) × Tp", "(Tr - Tp) × Sr"],
        correct: 1,
        explanation: "Écart sur taux horaire MOD = (Sr - Sp) × Tr. On valorise l'écart de taux salarial à la quantité réelle d'heures travaillées (Tr) pour isoler l'effet taux."
    },
    {
        q: "Qu'est-ce que le coût standard et à quoi sert-il ?",
        options: ["Le coût moyen des 5 dernières années, utilisé comme référence comptable", "Quantité standard × Coût unitaire standard, calculé à l'avance pour mesurer les écarts (gestion par exception)", "Le coût le plus bas observé dans l'industrie, servant de benchmark", "Le coût prévisionnel validé par les commissaires aux comptes"],
        correct: 1,
        explanation: "Coût standard = Quantité standard × Coût unitaire standard. C'est un coût calculé à l'avance qui sert de référence pour mesurer les écarts. Il permet la gestion par exception : on n'analyse que les écarts significatifs."
    },
    {
        q: "Comment calcule-t-on la marge standard unitaire moyenne (pour l'écart sur activité) ?",
        options: ["Somme des marges standards unitaires / Nombre de produits", "Somme [Marge std unitaire(i) × Part prévisionnelle du produit(i) dans les ventes]", "CA total / Nombre d'unités vendues - Coût variable moyen", "Marge globale budgétée / Quantités totales prévues"],
        correct: 1,
        explanation: "Marge std moyenne = Somme [Marge std unitaire(i) × Part prévisionnelle du produit(i) dans les ventes en volume]. Elle tient compte du mix prévisionnel pour avoir une référence cohérente."
    },
    {
        q: "Quelles sont les causes possibles d'un écart défavorable sur les quantités de MOD (temps) ?",
        options: ["Augmentations légales imprévues, excès d'heures supplémentaires", "Chute de cadences, défaut d'encadrement, standards mal calculés", "Mauvais choix de fournisseur, variation des prix du marché", "Excès de rebuts, mauvais entretien des machines"],
        correct: 1,
        explanation: "Les écarts défavorables sur les temps de MOD peuvent venir : d'une chute de cadences, d'un défaut d'encadrement, ou de standards mal calculés. Les augmentations légales imprévues affectent plutôt le taux horaire."
    },
    {
        q: "Quelle est la première étape de la démarche d'analyse des écarts en 5 étapes ?",
        options: ["Identifier les causes et proposer des actions correctives", "Décomposer l'écart en sous-écarts (prix, volume, mix, coûts)", "Calculer l'écart global (résultat ou marge réel vs budget)", "Vérifier la cohérence : somme des sous-écarts = écart global"],
        correct: 2,
        explanation: "La démarche commence par calculer l'écart global (réel vs budget), puis on décompose en sous-écarts, on analyse chaque sous-écart, on vérifie la cohérence, et enfin on identifie les causes et propose des actions."
    },
    {
        q: "En quoi consiste l'écart sur mix-produits ? Comment se calcule Qmix(i) ?",
        options: ["Qmix(i) = Part réelle(i) × Total ventes prévues", "Qmix(i) = Part prévue(i) × Total ventes réelles, et l'écart = Somme [(Qr(i) - Qmix(i)) × Marge std(i)]", "Qmix(i) = Part réelle(i) × Total ventes réelles", "Qmix(i) = Marge std(i) / Marge std moyenne"],
        correct: 1,
        explanation: "Qmix(i) = Part prévisionnelle(i) × Total ventes réelles. L'écart sur mix = Somme [(Qr(i) - Qmix(i)) × Marge std(i)]. Il mesure l'impact du changement de composition des ventes (vente de produits plus ou moins rentables que prévu)."
    }
];
let current = 0, score = 0, answered = false;
function renderQuestion() {
    const q = questions[current];
    document.getElementById('current-q').textContent = current + 1;
    document.getElementById('total-q').textContent = questions.length;
    document.getElementById('score').textContent = score;
    document.getElementById('progress').style.width = ((current + 1) / questions.length * 100) + '%';
    document.getElementById('quiz-area').innerHTML = `
        <div class="question-card">
            <div class="question-num">Question ${current + 1} / ${questions.length}</div>
            <div class="question-text">${q.q}</div>
            <div class="options">${q.options.map((opt, i) => `<button class="option" onclick="answer(${i})" id="opt${i}">${opt}</button>`).join('')}</div>
            <div class="explanation" id="explanation">${q.explanation}</div>
        </div>
        <div class="nav-buttons">
            ${current > 0 ? '<button class="btn btn-back" onclick="prev()">← Précédent</button>' : '<div></div>'}
            <button class="btn btn-next" id="btn-next" onclick="next()" disabled>Suivant →</button>
        </div>`;
    answered = false;
}
function answer(idx) {
    if (answered) return; answered = true;
    const q = questions[current];
    document.querySelectorAll('.option').forEach(b => b.disabled = true);
    if (idx === q.correct) { document.getElementById('opt' + idx).classList.add('correct'); score++; }
    else { document.getElementById('opt' + idx).classList.add('wrong'); document.getElementById('opt' + q.correct).classList.add('correct'); }
    document.getElementById('explanation').style.display = 'block';
    document.getElementById('btn-next').disabled = false;
    document.getElementById('score').textContent = score;
}
function next() { if (current < questions.length - 1) { current++; renderQuestion(); } else { showResult(); } }
function prev() { if (current > 0) { current--; renderQuestion(); } }
function showResult() {
    document.getElementById('quiz-area').innerHTML = '';
    document.getElementById('result-card').style.display = 'block';
    document.getElementById('final-score').textContent = score;
    document.getElementById('final-total').textContent = questions.length;
    const pct = score / questions.length;
    document.getElementById('result-msg').textContent = pct >= 0.8 ? '🏆 Excellent ! Tu maîtrises ce chapitre.' : pct >= 0.6 ? '👍 Bien ! Encore un peu de révision.' : '📚 Révise la synthèse et réessaie !';
}
function restartQuiz() { current = 0; score = 0; answered = false; document.getElementById('result-card').style.display = 'none'; renderQuestion(); }
renderQuestion();
</script>
</body>
</html>
