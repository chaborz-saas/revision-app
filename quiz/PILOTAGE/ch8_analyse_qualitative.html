<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz — Analyse qualitative (méthodologie mémoire)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; padding: 1.5rem; }
        .quiz-header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 1.5rem 2rem; border-radius: 16px; margin-bottom: 1.5rem; border-bottom: 3px solid #8b5cf6; }
        .quiz-header .matiere { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #8b5cf6; margin-bottom: 0.3rem; }
        .quiz-header h1 { font-size: 1.3rem; font-weight: 700; color: white; }
        .quiz-container { max-width: 800px; margin: 0 auto; }
        .progress-bar { background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; margin-bottom: 1.5rem; }
        .progress-fill { background: #8b5cf6; height: 100%; border-radius: 10px; transition: width 0.3s; }
        .score-display { text-align: center; font-size: 0.85rem; color: #808090; margin-bottom: 1rem; }
        .question-card { background: #1a1a2e; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 2rem; margin-bottom: 1rem; }
        .question-num { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #8b5cf6; margin-bottom: 0.8rem; font-weight: 700; }
        .question-text { font-size: 1.05rem; font-weight: 600; color: white; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: grid; gap: 0.6rem; }
        .option { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0.9rem 1.2rem; cursor: pointer; transition: all 0.2s; font-size: 0.92rem; color: #d0d0d8; text-align: left; width: 100%; }
        .option:hover:not(:disabled) { background: rgba(139,92,246,0.1); border-color: rgba(139,92,246,0.4); color: white; }
        .option.correct { background: rgba(16,185,129,0.2); border-color: #10b981; color: #10b981; font-weight: 600; }
        .option.wrong { background: rgba(233,69,96,0.2); border-color: #e94560; color: #e94560; }
        .option:disabled { cursor: default; }
        .explanation { background: rgba(139,92,246,0.08); border-left: 3px solid #8b5cf6; padding: 0.8rem 1rem; margin-top: 1rem; border-radius: 0 8px 8px 0; font-size: 0.88rem; color: #c4b5fd; display: none; }
        .nav-buttons { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; gap: 1rem; }
        .btn { padding: 0.7rem 1.5rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-next { background: #8b5cf6; color: white; margin-left: auto; }
        .btn-next:hover { background: #7c3aed; }
        .btn-next:disabled { background: rgba(255,255,255,0.1); color: #606070; cursor: default; }
        .btn-back { background: rgba(255,255,255,0.08); color: #d0d0d8; }
        .result-card { background: #1a1a2e; border-radius: 16px; padding: 3rem 2rem; text-align: center; display: none; }
        .result-score { font-size: 3.5rem; font-weight: 800; color: #8b5cf6; margin: 1rem 0; }
        .result-msg { font-size: 1.1rem; color: #d0d0d8; margin-bottom: 2rem; }
        .btn-restart { background: #8b5cf6; color: white; padding: 0.8rem 2rem; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; border: none; }
        .back-link { display: inline-block; color: #808090; font-size: 0.8rem; text-decoration: none; margin-bottom: 1rem; }
        .back-link:hover { color: #8b5cf6; }
    </style>
</head>
<body>
<div class="quiz-container">
    <a href="../../index.html" class="back-link">← Retour à l'accueil</a>
    <div class="quiz-header">
        <div class="matiere">PILOTAGE DE LA PERFORMANCE — QUIZ</div>
        <h1>Analyse qualitative — Méthodologie mémoire</h1>
    </div>
    <div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">10</span> — Score : <span id="score">0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:10%"></div></div>
    <div id="quiz-area"></div>
    <div class="result-card" id="result-card">
        <div style="font-size:2rem">🎯</div>
        <div class="result-score"><span id="final-score">0</span>/<span id="final-total">10</span></div>
        <div class="result-msg" id="result-msg"></div>
        <button class="btn-restart" onclick="restartQuiz()">Recommencer</button>
        <br><br>
        <a href="../../index.html" class="back-link">← Retour à l'accueil</a>
    </div>
</div>
<script>
const questions = [
    {
        q: "Quelles sont les 4 dimensions caractéristiques des méthodes qualitatives ?",
        options: ["Objectives, mesurables, reproductibles, généralisables", "Inductives, exploratoires, interprétatives, contextuelles", "Déductives, quantifiables, comparatives, universelles", "Descriptives, analytiques, prédictives, normatives"],
        correct: 1,
        explanation: "Les méthodes qualitatives sont : 1) Inductives (du terrain vers la théorie), 2) Exploratoires (découverte plutôt que vérification), 3) Interprétatives (chercher le sens), 4) Contextuelles (le contexte est central, pas neutralisé)."
    },
    {
        q: "Quelle est la différence fondamentale entre la logique qualitative et la logique quantitative ?",
        options: ["Qualitative = plus d'entretiens ; quantitative = plus de questionnaires", "Qualitative = logique inductive (terrain vers théorie) ; quantitative = logique déductive (hypothèses vers test)", "Qualitative = moins fiable ; quantitative = plus fiable", "Il n'y a pas de différence fondamentale de logique, seulement d'outils"],
        correct: 1,
        explanation: "Qualitative : logique inductive (le terrain génère la théorie), données discursives, objectif = comprendre le sens. Quantitative : logique déductive (tester des hypothèses sur données numériques), objectif = mesurer et prédire."
    },
    {
        q: "Qu'est-ce que la Grounded Theory et qui l'a créée ?",
        options: ["Méthode déductive pour tester des hypothèses ; Yin (1994)", "Méthode inductive pour générer des concepts à partir des données de terrain ; Glaser et Strauss (1967)", "Méthode ethnographique d'observation participante ; Simon (1957)", "Méthode de triangulation des données ; Eisenhardt (1989)"],
        correct: 1,
        explanation: "La Grounded Theory (théorie enracinée) est une méthode inductive créée par Glaser et Strauss en 1967. Elle permet de générer des concepts et théories directement à partir des données de terrain, sans hypothèse préalable à tester."
    },
    {
        q: "Quel est le pipeline complet d'analyse qualitative dans l'ordre correct ?",
        options: ["Codes → Données → Unités de sens → Catégories → Thèmes → Récit → Affirmations", "Données → Unités de sens → Codes → Catégories → Thèmes → Récit → Affirmations", "Thèmes → Codes → Données → Catégories → Unités de sens → Récit → Affirmations", "Données → Codes → Unités de sens → Thèmes → Catégories → Affirmations → Récit"],
        correct: 1,
        explanation: "Le pipeline complet est : Données → Unités de sens → Codes → Catégories → Thèmes → Récit → Affirmations. Chaque étape condense et abstrait davantage les données brutes vers une interprétation théorisée."
    },
    {
        q: "Combien d'entretiens minimum sont requis et quelle est la durée idéale selon le cours ?",
        options: ["3 entretiens minimum, 30 minutes idéalement", "5 entretiens minimum, 45 minutes idéalement", "8 entretiens minimum, 60 minutes idéalement", "10 entretiens minimum, 90 minutes idéalement"],
        correct: 1,
        explanation: "Minimum 5 entretiens, durée idéale de 45 minutes chacun. En dessous de 5 entretiens, la saturation des données ne peut pas être atteinte et la représentativité du corpus est insuffisante."
    },
    {
        q: "Quels sont les 3 niveaux de codage dans l'analyse qualitative et leur objectif ?",
        options: ["Codage primaire, secondaire, tertiaire — pour affiner la précision", "Codage ouvert (étiqueter), codage axial (relier en catégories), codage sélectif (identifier la catégorie centrale)", "Codage thématique, codage conceptuel, codage narratif", "Codage descriptif, codage analytique, codage interprétatif"],
        correct: 1,
        explanation: "3 niveaux de codage : Ouvert (découper en unités de sens, étiquettes provisoires → codes initiaux), Axial (relier les codes : conditions, interactions, conséquences → catégories), Sélectif (identifier une catégorie centrale integratrice → récit cohérent / storyline)."
    },
    {
        q: "Quelle est la différence entre analyse verticale (intra-cas) et analyse horizontale (inter-cas) ?",
        options: ["Verticale = analyse sur plusieurs années ; horizontale = analyse sur plusieurs pays", "Verticale = rester dans une même interview pour préserver le contexte ; horizontale = comparer les codes entre interviews", "Verticale = analyse qualitative ; horizontale = analyse quantitative", "Verticale = top-down ; horizontale = bottom-up"],
        correct: 1,
        explanation: "Analyse verticale (intra-cas) : on reste dans une même interview pour analyser en profondeur, en préservant le contexte. Analyse horizontale (inter-cas) : on compare les codes entre les différentes interviews pour identifier convergences et divergences."
    },
    {
        q: "Où doit figurer le guide d'entretien dans un mémoire académique ?",
        options: ["Dans la section méthodologie, en début de chapitre", "Dans les annexes (pas dans la méthodologie)", "Dans la revue de littérature, pour contextualiser les questions", "Dans la section résultats, pour illustrer les thèmes"],
        correct: 1,
        explanation: "Le guide d'entretien va dans les Annexes du mémoire (pas dans la section méthodologie). La section méthodologie décrit en détail la démarche (terrain, participants, collecte, analyse) sur plusieurs pages."
    },
    {
        q: "Qu'est-ce qu'un 'thème' dans l'analyse thématique réflexive ?",
        options: ["Un simple label ou titre de sujet pour regrouper des données similaires", "Un sens partagé unifié par un concept organisateur central (pas une simple catégorie de sujet)", "Une catégorie de codes comprenant au moins 10 unités de sens", "Un résumé factuel des principaux sujets abordés en entretien"],
        correct: 1,
        explanation: "Un thème dans l'analyse thématique réflexive capture un sens partagé unifié par un concept organisateur central. Ce n'est PAS une simple catégorie de sujet ou un label : il doit expliquer quelque chose d'analytiquement important."
    },
    {
        q: "Quels sont les 3 critères d'une catégorie analytique robuste ?",
        options: ["Fréquente, visible, mesurable", "Conceptuellement claire (une seule idée), analytiquement utile (explique quelque chose d'important), distincte mais liée (recoupement minimal)", "Inductive, déductive, abductive", "Validée par les interviewés, par les pairs, par le directeur de mémoire"],
        correct: 1,
        explanation: "Une catégorie robuste doit être : 1) Conceptuellement claire (une seule idée, limites d'inclusion/exclusion explicites), 2) Analytiquement utile (explique quelque chose d'important, plus qu'un simple label), 3) Distincte mais liée (recoupement minimal avec les catégories sœurs)."
    }
];
let current = 0, score = 0, answered = false;
function renderQuestion() {
    const q = questions[current];
    document.getElementById('current-q').textContent = current + 1;
    document.getElementById('total-q').textContent = questions.length;
    document.getElementById('score').textContent = score;
    document.getElementById('progress').style.width = ((current + 1) / questions.length * 100) + '%';
    document.getElementById('quiz-area').innerHTML = `
        <div class="question-card">
            <div class="question-num">Question ${current + 1} / ${questions.length}</div>
            <div class="question-text">${q.q}</div>
            <div class="options">${q.options.map((opt, i) => `<button class="option" onclick="answer(${i})" id="opt${i}">${opt}</button>`).join('')}</div>
            <div class="explanation" id="explanation">${q.explanation}</div>
        </div>
        <div class="nav-buttons">
            ${current > 0 ? '<button class="btn btn-back" onclick="prev()">← Précédent</button>' : '<div></div>'}
            <button class="btn btn-next" id="btn-next" onclick="next()" disabled>Suivant →</button>
        </div>`;
    answered = false;
}
function answer(idx) {
    if (answered) return; answered = true;
    const q = questions[current];
    document.querySelectorAll('.option').forEach(b => b.disabled = true);
    if (idx === q.correct) { document.getElementById('opt' + idx).classList.add('correct'); score++; }
    else { document.getElementById('opt' + idx).classList.add('wrong'); document.getElementById('opt' + q.correct).classList.add('correct'); }
    document.getElementById('explanation').style.display = 'block';
    document.getElementById('btn-next').disabled = false;
    document.getElementById('score').textContent = score;
}
function next() { if (current < questions.length - 1) { current++; renderQuestion(); } else { showResult(); } }
function prev() { if (current > 0) { current--; renderQuestion(); } }
function showResult() {
    document.getElementById('quiz-area').innerHTML = '';
    document.getElementById('result-card').style.display = 'block';
    document.getElementById('final-score').textContent = score;
    document.getElementById('final-total').textContent = questions.length;
    const pct = score / questions.length;
    document.getElementById('result-msg').textContent = pct >= 0.8 ? '🏆 Excellent ! Tu maîtrises ce chapitre.' : pct >= 0.6 ? '👍 Bien ! Encore un peu de révision.' : '📚 Révise la synthèse et réessaie !';
}
function restartQuiz() { current = 0; score = 0; answered = false; document.getElementById('result-card').style.display = 'none'; renderQuestion(); }
renderQuestion();
</script>
<script data-goatcounter="https://chaborz.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
