<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz — Introduction a la GRH</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; padding: 1.5rem; }
        .quiz-header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 1.5rem 2rem; border-radius: 16px; margin-bottom: 1.5rem; border-bottom: 3px solid #f59e0b; }
        .quiz-header .matiere { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #f59e0b; margin-bottom: 0.3rem; }
        .quiz-header h1 { font-size: 1.3rem; font-weight: 700; color: white; }
        .quiz-container { max-width: 800px; margin: 0 auto; }
        .progress-bar { background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; margin-bottom: 1.5rem; }
        .progress-fill { background: #f59e0b; height: 100%; border-radius: 10px; transition: width 0.3s; }
        .score-display { text-align: center; font-size: 0.85rem; color: #808090; margin-bottom: 1rem; }
        .question-card { background: #1a1a2e; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 2rem; margin-bottom: 1rem; }
        .question-num { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #f59e0b; margin-bottom: 0.8rem; font-weight: 700; }
        .question-text { font-size: 1.05rem; font-weight: 600; color: white; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: grid; gap: 0.6rem; }
        .option { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0.9rem 1.2rem; cursor: pointer; transition: all 0.2s; font-size: 0.92rem; color: #d0d0d8; text-align: left; width: 100%; }
        .option:hover:not(:disabled) { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.4); color: white; }
        .option.correct { background: rgba(16,185,129,0.2); border-color: #10b981; color: #10b981; font-weight: 600; }
        .option.wrong { background: rgba(233,69,96,0.2); border-color: #e94560; color: #e94560; }
        .option:disabled { cursor: default; }
        .explanation { background: rgba(245,158,11,0.08); border-left: 3px solid #f59e0b; padding: 0.8rem 1rem; margin-top: 1rem; border-radius: 0 8px 8px 0; font-size: 0.88rem; color: #fcd34d; display: none; }
        .nav-buttons { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; gap: 1rem; }
        .btn { padding: 0.7rem 1.5rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-next { background: #f59e0b; color: white; margin-left: auto; }
        .btn-next:hover { background: #d97706; }
        .btn-next:disabled { background: rgba(255,255,255,0.1); color: #606070; cursor: default; }
        .btn-back { background: rgba(255,255,255,0.08); color: #d0d0d8; }
        .btn-back:hover { background: rgba(255,255,255,0.15); }
        .result-card { background: #1a1a2e; border-radius: 16px; padding: 3rem 2rem; text-align: center; display: none; }
        .result-score { font-size: 3.5rem; font-weight: 800; color: #f59e0b; margin: 1rem 0; }
        .result-msg { font-size: 1.1rem; color: #d0d0d8; margin-bottom: 2rem; }
        .btn-restart { background: #f59e0b; color: white; padding: 0.8rem 2rem; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; border: none; }
        .btn-restart:hover { background: #d97706; }
        .back-link { display: inline-block; color: #808090; font-size: 0.8rem; text-decoration: none; margin-bottom: 1rem; }
        .back-link:hover { color: #f59e0b; }
    </style>
</head>
<body>
<div class="quiz-container">
    <a href="../../fr/index.html" class="back-link">← Retour a l'accueil</a>
    <div class="quiz-header">
        <div class="matiere">GESTION DES RESSOURCES HUMAINES — QUIZ</div>
        <h1>Cours 1 — Introduction a la GRH</h1>
    </div>

    <div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">10</span> — Score : <span id="score">0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:10%"></div></div>

    <div id="quiz-area"></div>
    <div class="result-card" id="result-card">
        <div style="font-size:2rem">🎯</div>
        <div class="result-score"><span id="final-score">0</span>/<span id="final-total">10</span></div>
        <div class="result-msg" id="result-msg"></div>
        <button class="btn-restart" onclick="restartQuiz()">Recommencer</button>
        <br><br>
        <a href="../../fr/index.html" class="back-link">← Retour a l'accueil</a>
    </div>
</div>

<script>
const questions = [
    {
        q: "Selon Grasser et Noel (2022), la GRH a pour double finalite :",
        options: [
            "Le recrutement et la formation des salaries",
            "L'efficacite (atteindre les objectifs) et l'efficience (optimiser les moyens)",
            "La motivation individuelle et la cohesion collective",
            "La conformite juridique et la performance financiere"
        ],
        correct: 1,
        explanation: "Selon Grasser et Noel (2022), la GRH a pour finalite de permettre d'atteindre au mieux les objectifs de l'organisation (efficacite), tout en assurant une utilisation optimale des moyens (efficience)."
    },
    {
        q: "Lequel de ces elements n'est PAS un enjeu fondamental de la GRH ?",
        options: [
            "Choisir, conserver et former le personnel",
            "Maximiser le profit a court terme de l'entreprise",
            "Contribuer a une action collective efficace et creative",
            "Integrer les choix individuels dans la demarche collective"
        ],
        correct: 1,
        explanation: "Les trois enjeux fondamentaux de la GRH sont : choisir, conserver et former le personnel ; contribuer a une action collective efficace, efficiente et creative ; integrer les choix individuels des salaries dans la demarche collective. La maximisation du profit n'en fait pas partie."
    },
    {
        q: "Vrai ou faux : dans le modele d'Ulrich (1997), le champion des salaries combine une orientation vers le present et un focus sur les personnes.",
        options: [
            "Faux, il combine futur et personnes",
            "Faux, il combine present et processus",
            "Vrai",
            "Faux, c'est le role de l'expert administratif"
        ],
        correct: 2,
        explanation: "C'est exact. Dans le modele d'Ulrich, le champion des salaries se situe a l'intersection de l'orientation vers le present et du focus sur les personnes. Il represente et defend les interets des collaborateurs."
    },
    {
        q: "Quel courant theorique a introduit la notion de groupes de production autonomes et la critique du courant des Relations humaines ?",
        options: [
            "Le taylorisme",
            "Le management strategique",
            "Le courant des Relations humaines",
            "Le courant socio-technique"
        ],
        correct: 3,
        explanation: "Le courant socio-technique (1960-1980) prend comme point de depart la critique du courant des Relations humaines. Il se preoccupe des conditions de travail et de la mise en place de groupes de production autonomes."
    },
    {
        q: "A partir de combien de salaries le CSE (Comite Social et Economique) est-il obligatoire ?",
        options: [
            "11 salaries",
            "50 salaries",
            "20 salaries",
            "300 salaries"
        ],
        correct: 0,
        explanation: "Le CSE est obligatoire dans toutes les entreprises de 11 salaries et plus. C'est a partir de 50 salaries que le CSE acquiert des attributions economiques elargies."
    },
    {
        q: "Une entreprise de 400 salaries negocie sur la gestion des emplois et des parcours professionnels (GEPP). Quelle est la periodicite de cette negociation ?",
        options: [
            "Annuelle",
            "Semestrielle",
            "Quinquennale",
            "Triennale"
        ],
        correct: 3,
        explanation: "La negociation sur la gestion des emplois et des parcours professionnels et mixite des metiers est triennale. Elle ne concerne que les entreprises de plus de 300 salaries."
    },
    {
        q: "Quel role RH du modele d'Ulrich aligne les pratiques RH sur la strategie de l'entreprise (orientation futur, focus processus) ?",
        options: [
            "L'agent du changement",
            "Le partenaire strategique",
            "Le champion des salaries",
            "L'expert administratif"
        ],
        correct: 1,
        explanation: "Le partenaire strategique combine orientation vers le futur et focus sur les processus. Il aligne les pratiques RH sur la strategie de l'entreprise."
    },
    {
        q: "Dans l'approche ascendante (bottom-up) de l'articulation strategie-RH, quelle logique prevaut ?",
        options: [
            "La strategie determine les besoins en ressources humaines",
            "La DRH impose ses choix a la direction generale",
            "Les competences detenues par les salaries influencent la strategie",
            "L'environnement externe dicte la politique RH"
        ],
        correct: 2,
        explanation: "Dans l'approche ascendante, ce sont les competences detenues par les salaries qui influencent la strategie. L'exemple de Southwest Airlines illustre cette logique : les salaries sont consideres comme la plus grande force et l'avantage concurrentiel le plus durable."
    },
    {
        q: "Lequel de ces acteurs est considere comme un acteur externe de la GRH ?",
        options: [
            "Les representants du personnel",
            "La direction generale",
            "Les organismes de Securite Sociale",
            "Les salaries eux-memes"
        ],
        correct: 2,
        explanation: "Les organismes de Securite Sociale font partie des acteurs externes de la GRH, aux cotes de l'Etat, des syndicats, de la medecine du travail et des intervenants exterieurs. Les representants du personnel, la direction et les salaries sont des acteurs internes."
    },
    {
        q: "Olivier Lajous, ancien DRH de la Marine Nationale, prefere parler de 'richesses humaines' plutot que de 'ressources humaines'. Pourquoi ?",
        options: [
            "Car le terme 'ressources' est juridiquement obsolete",
            "Car le terme 'richesses' valorise mieux les salaires",
            "Car cela evite la confusion avec les ressources materielles",
            "Car chaque personne est unique, porteuse de talents a reconnaitre et developper"
        ],
        correct: 3,
        explanation: "O. Lajous prefere parler de richesses humaines car chaque personne est unique, singuliere et porteuse de talents et de sens. La fonction RH n'est pas de gerer des ressources comme des stocks, mais de reconnaitre, developper et mettre en relation ces richesses."
    }
];

let current = 0, score = 0, answered = false, shuffledQuestions = [];

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
}

function initQuiz() {
    shuffledQuestions = shuffle(questions);
    current = 0; score = 0; answered = false;
    renderQuestion();
}

function renderQuestion() {
    const q = shuffledQuestions[current];
    document.getElementById('current-q').textContent = current + 1;
    document.getElementById('total-q').textContent = shuffledQuestions.length;
    document.getElementById('score').textContent = score;
    document.getElementById('progress').style.width = ((current + 1) / shuffledQuestions.length * 100) + '%';

    const area = document.getElementById('quiz-area');
    area.innerHTML = `
        <div class="question-card">
            <div class="question-num">Question ${current + 1} / ${shuffledQuestions.length}</div>
            <div class="question-text">${q.q}</div>
            <div class="options">
                ${q.options.map((opt, i) => `<button class="option" onclick="answer(${i})" id="opt${i}">${opt}</button>`).join('')}
            </div>
            <div class="explanation" id="explanation">${q.explanation}</div>
        </div>
        <div class="nav-buttons">
            ${current > 0 ? '<button class="btn btn-back" onclick="prev()">← Precedent</button>' : '<div></div>'}
            <button class="btn btn-next" id="btn-next" onclick="next()" disabled>Suivant →</button>
        </div>
    `;
    answered = false;
}

function answer(idx) {
    if (answered) return;
    answered = true;
    const q = shuffledQuestions[current];
    document.querySelectorAll('.option').forEach(b => b.disabled = true);
    if (idx === q.correct) {
        document.getElementById('opt' + idx).classList.add('correct');
        score++;
    } else {
        document.getElementById('opt' + idx).classList.add('wrong');
        document.getElementById('opt' + q.correct).classList.add('correct');
    }
    document.getElementById('explanation').style.display = 'block';
    document.getElementById('btn-next').disabled = false;
    document.getElementById('score').textContent = score;
}

function next() {
    if (current < shuffledQuestions.length - 1) { current++; renderQuestion(); }
    else { showResult(); }
}

function prev() {
    if (current > 0) { current--; renderQuestion(); }
}

function showResult() {
    document.getElementById('quiz-area').style.display = 'none';
    const rc = document.getElementById('result-card');
    rc.style.display = 'block';
    document.getElementById('final-score').textContent = score;
    document.getElementById('final-total').textContent = shuffledQuestions.length;
    const pct = score / shuffledQuestions.length;
    document.getElementById('result-msg').textContent = pct >= 0.8 ? 'Excellent ! Tu maitrises ce chapitre.' : pct >= 0.6 ? 'Bien ! Encore un peu de revision.' : 'Revise la synthese et reessaie !';
}

function restartQuiz() {
    document.getElementById('result-card').style.display = 'none';
    document.getElementById('quiz-area').style.display = 'block';
    initQuiz();
}

initQuiz();
</script>
<script data-goatcounter="https://chaborz.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
