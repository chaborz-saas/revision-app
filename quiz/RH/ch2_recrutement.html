<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz — Le Recrutement</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; padding: 1.5rem; }
        .quiz-header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 1.5rem 2rem; border-radius: 16px; margin-bottom: 1.5rem; border-bottom: 3px solid #f59e0b; }
        .quiz-header .matiere { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #f59e0b; margin-bottom: 0.3rem; }
        .quiz-header h1 { font-size: 1.3rem; font-weight: 700; color: white; }
        .quiz-container { max-width: 800px; margin: 0 auto; }
        .progress-bar { background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; margin-bottom: 1.5rem; }
        .progress-fill { background: #f59e0b; height: 100%; border-radius: 10px; transition: width 0.3s; }
        .score-display { text-align: center; font-size: 0.85rem; color: #808090; margin-bottom: 1rem; }
        .question-card { background: #1a1a2e; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 2rem; margin-bottom: 1rem; }
        .question-num { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #f59e0b; margin-bottom: 0.8rem; font-weight: 700; }
        .question-text { font-size: 1.05rem; font-weight: 600; color: white; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: grid; gap: 0.6rem; }
        .option { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0.9rem 1.2rem; cursor: pointer; transition: all 0.2s; font-size: 0.92rem; color: #d0d0d8; text-align: left; width: 100%; }
        .option:hover:not(:disabled) { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.4); color: white; }
        .option.correct { background: rgba(16,185,129,0.2); border-color: #10b981; color: #10b981; font-weight: 600; }
        .option.wrong { background: rgba(233,69,96,0.2); border-color: #e94560; color: #e94560; }
        .option:disabled { cursor: default; }
        .explanation { background: rgba(245,158,11,0.08); border-left: 3px solid #f59e0b; padding: 0.8rem 1rem; margin-top: 1rem; border-radius: 0 8px 8px 0; font-size: 0.88rem; color: #fcd34d; display: none; }
        .nav-buttons { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; gap: 1rem; }
        .btn { padding: 0.7rem 1.5rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-next { background: #f59e0b; color: white; margin-left: auto; }
        .btn-next:hover { background: #d97706; }
        .btn-next:disabled { background: rgba(255,255,255,0.1); color: #606070; cursor: default; }
        .btn-back { background: rgba(255,255,255,0.08); color: #d0d0d8; }
        .btn-back:hover { background: rgba(255,255,255,0.15); }
        .result-card { background: #1a1a2e; border-radius: 16px; padding: 3rem 2rem; text-align: center; display: none; }
        .result-score { font-size: 3.5rem; font-weight: 800; color: #f59e0b; margin: 1rem 0; }
        .result-msg { font-size: 1.1rem; color: #d0d0d8; margin-bottom: 2rem; }
        .btn-restart { background: #f59e0b; color: white; padding: 0.8rem 2rem; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; border: none; }
        .btn-restart:hover { background: #d97706; }
        .back-link { display: inline-block; color: #808090; font-size: 0.8rem; text-decoration: none; margin-bottom: 1rem; }
        .back-link:hover { color: #f59e0b; }
    </style>
</head>
<body>
<div class="quiz-container">
    <a href="../../fr/index.html" class="back-link">← Retour a l'accueil</a>
    <div class="quiz-header">
        <div class="matiere">GESTION DES RESSOURCES HUMAINES — QUIZ</div>
        <h1>Cours 2 — Le Recrutement</h1>
    </div>

    <div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">10</span> — Score : <span id="score">0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:10%"></div></div>

    <div id="quiz-area"></div>
    <div class="result-card" id="result-card">
        <div style="font-size:2rem">🎯</div>
        <div class="result-score"><span id="final-score">0</span>/<span id="final-total">10</span></div>
        <div class="result-msg" id="result-msg"></div>
        <button class="btn-restart" onclick="restartQuiz()">Recommencer</button>
        <br><br>
        <a href="../../fr/index.html" class="back-link">← Retour a l'accueil</a>
    </div>
</div>

<script>
const questions = [
    {
        q: "Lequel n'est PAS un objectif fondamental du recrutement ?",
        options: [
            "Compenser les departs (retraites, demissions)",
            "Accompagner les evolutions et le developpement de l'organisation",
            "Reduire systematiquement la masse salariale",
            "Accompagner les mouvements de personnel internes"
        ],
        correct: 2,
        explanation: "Les trois objectifs fondamentaux du recrutement sont : compenser les departs, accompagner les mouvements de personnel internes et accompagner les evolutions de l'organisation. La reduction de la masse salariale n'en fait pas partie."
    },
    {
        q: "Selon la proposition de valeur employeur (Mortensen et Edmondson, 2023), quel facteur se situe a l'intersection de la portee collective et du long terme ?",
        options: [
            "Les avantages materiels",
            "Le sens et la raison d'etre",
            "Les opportunites de developpement",
            "Les liens et la communaute"
        ],
        correct: 1,
        explanation: "Dans le modele de Mortensen et Edmondson, le sens et la raison d'etre se situe a l'intersection de la portee collective et du long terme. Les avantages materiels sont individuels/court terme, les opportunites de developpement sont individuelles/long terme, et les liens et communaute sont collectifs/court terme."
    },
    {
        q: "Vrai ou faux : selon l'enquete APEC 2022, la preselection telephonique est utilisee plus frequemment que la lettre de motivation.",
        options: [
            "Faux, la lettre de motivation reste dominante a 80 %",
            "Faux, les deux sont au meme niveau",
            "Vrai, la preselection telephonique atteint 67 % contre 56 % pour la lettre de motivation",
            "Vrai, mais uniquement pour les cadres superieurs"
        ],
        correct: 2,
        explanation: "En 2022, la preselection telephonique a progresse a 67 % (contre 58 % en 2019), tandis que la demande de lettre de motivation a recule a 56 % (contre 69 % en 2019)."
    },
    {
        q: "Quel outil de selection possede une validite predictive evaluee comme nulle selon Guerrero (2023) ?",
        options: [
            "Les mises en situation et simulations",
            "Les entretiens structures",
            "Les tests de personnalite",
            "La graphologie et la morphopsychologie"
        ],
        correct: 3,
        explanation: "Selon Guerrero (2023), la graphologie, la morphopsychologie et les tests projectifs ont une validite predictive nulle. Les mises en situation ont une validite elevee, les entretiens structures une validite assez bonne, et les tests de personnalite une validite faible."
    },
    {
        q: "La decision d'embauche est un acte rationnel seulement en apparence. Quels deux facteurs viennent nuancer cette rationalite ?",
        options: [
            "Le cout du recrutement et la pression du temps",
            "La rationalite limitee des decideurs (Simon) et les jeux de pouvoir (Crozier et Friedberg)",
            "Le manque de candidats et la concurrence entre entreprises",
            "L'absence de tests et le manque de formation des recruteurs"
        ],
        correct: 1,
        explanation: "Deux elements nuancent la rationalite de la decision : la rationalite limitee des decideurs (Simon) — on choisit une solution satisfaisante plutot qu'optimale — et les jeux de pouvoir et rapports de force (Crozier et Friedberg) au sein de l'entreprise."
    },
    {
        q: "Quel pourcentage des embauches en CDI se solde par un depart dans les 12 premiers mois ?",
        options: [
            "15 %",
            "25 %",
            "36 %",
            "50 %"
        ],
        correct: 2,
        explanation: "36 % des embauches en CDI se soldent par un depart dans les 12 mois qui suivent, ce qui souligne l'importance cruciale de la phase d'integration (onboarding)."
    },
    {
        q: "Un recruteur a tendance a privilegier les candidats qui lui ressemblent. De quel biais cognitif s'agit-il ?",
        options: [
            "L'effet de halo",
            "L'effet de desirabilite sociale",
            "Le biais de projection",
            "L'effet d'inference"
        ],
        correct: 2,
        explanation: "Le biais de projection est la tendance a privilegier les candidats qui nous ressemblent. L'effet de halo porte sur une impression globale influencant le jugement, et l'effet d'inference consiste a tirer des conclusions hatives."
    },
    {
        q: "Lequel n'est PAS un avantage du recrutement interne selon Mercier et Schmidt (2004) ?",
        options: [
            "Couts moins eleves",
            "Favorise le renouvellement des competences par l'apport de nouvelles experiences",
            "Risque plus faible",
            "Integration plus facile"
        ],
        correct: 1,
        explanation: "Favoriser le renouvellement des competences par de nouvelles experiences est un avantage du recrutement externe, pas du recrutement interne. Le recrutement interne presente des couts moindres, un risque plus faible et une integration plus facile."
    },
    {
        q: "Lors de l'integration d'un nouveau collaborateur, quelle dimension est soutenue par la mise en place d'un parrain ou tuteur ?",
        options: [
            "La dimension informationnelle",
            "La dimension comportementale",
            "La dimension sociale",
            "La dimension psychologique"
        ],
        correct: 3,
        explanation: "La dimension psychologique de l'integration est soutenue par la mise en place d'un parrain ou tuteur et le role des collegues. La dimension informationnelle passe par le livret d'integration, la dimension sociale par l'integration dans les equipes, et la dimension comportementale par le feedback du N+1."
    },
    {
        q: "Le profil du candidat recherche se definit autour de quatre dimensions. Laquelle n'en fait PAS partie ?",
        options: [
            "La formation initiale et continue",
            "Les experiences professionnelles",
            "Le niveau de remuneration anterieur du candidat",
            "Les competences theoriques, techniques et comportementales"
        ],
        correct: 2,
        explanation: "Le profil du candidat se definit autour de quatre dimensions : la formation, les experiences professionnelles, les competences (theoriques, techniques et comportementales), et les caracteristiques specifiques (disponibilite, mobilite geographique). Le niveau de remuneration anterieur n'en fait pas partie."
    }
];

let current = 0, score = 0, answered = false, shuffledQuestions = [];

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
}

function initQuiz() {
    shuffledQuestions = shuffle(questions);
    current = 0; score = 0; answered = false;
    renderQuestion();
}

function renderQuestion() {
    const q = shuffledQuestions[current];
    document.getElementById('current-q').textContent = current + 1;
    document.getElementById('total-q').textContent = shuffledQuestions.length;
    document.getElementById('score').textContent = score;
    document.getElementById('progress').style.width = ((current + 1) / shuffledQuestions.length * 100) + '%';

    const area = document.getElementById('quiz-area');
    area.innerHTML = `
        <div class="question-card">
            <div class="question-num">Question ${current + 1} / ${shuffledQuestions.length}</div>
            <div class="question-text">${q.q}</div>
            <div class="options">
                ${q.options.map((opt, i) => `<button class="option" onclick="answer(${i})" id="opt${i}">${opt}</button>`).join('')}
            </div>
            <div class="explanation" id="explanation">${q.explanation}</div>
        </div>
        <div class="nav-buttons">
            ${current > 0 ? '<button class="btn btn-back" onclick="prev()">← Precedent</button>' : '<div></div>'}
            <button class="btn btn-next" id="btn-next" onclick="next()" disabled>Suivant →</button>
        </div>
    `;
    answered = false;
}

function answer(idx) {
    if (answered) return;
    answered = true;
    const q = shuffledQuestions[current];
    document.querySelectorAll('.option').forEach(b => b.disabled = true);
    if (idx === q.correct) {
        document.getElementById('opt' + idx).classList.add('correct');
        score++;
    } else {
        document.getElementById('opt' + idx).classList.add('wrong');
        document.getElementById('opt' + q.correct).classList.add('correct');
    }
    document.getElementById('explanation').style.display = 'block';
    document.getElementById('btn-next').disabled = false;
    document.getElementById('score').textContent = score;
}

function next() {
    if (current < shuffledQuestions.length - 1) { current++; renderQuestion(); }
    else { showResult(); }
}

function prev() {
    if (current > 0) { current--; renderQuestion(); }
}

function showResult() {
    document.getElementById('quiz-area').style.display = 'none';
    const rc = document.getElementById('result-card');
    rc.style.display = 'block';
    document.getElementById('final-score').textContent = score;
    document.getElementById('final-total').textContent = shuffledQuestions.length;
    const pct = score / shuffledQuestions.length;
    document.getElementById('result-msg').textContent = pct >= 0.8 ? 'Excellent ! Tu maitrises ce chapitre.' : pct >= 0.6 ? 'Bien ! Encore un peu de revision.' : 'Revise la synthese et reessaie !';
}

function restartQuiz() {
    document.getElementById('result-card').style.display = 'none';
    document.getElementById('quiz-area').style.display = 'block';
    initQuiz();
}

initQuiz();
</script>
<script data-goatcounter="https://chaborz.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
