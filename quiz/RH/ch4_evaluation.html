<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz — L'Evaluation des salaries</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; padding: 1.5rem; }
        .quiz-header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 1.5rem 2rem; border-radius: 16px; margin-bottom: 1.5rem; border-bottom: 3px solid #f59e0b; }
        .quiz-header .matiere { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #f59e0b; margin-bottom: 0.3rem; }
        .quiz-header h1 { font-size: 1.3rem; font-weight: 700; color: white; }
        .quiz-container { max-width: 800px; margin: 0 auto; }
        .progress-bar { background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; margin-bottom: 1.5rem; }
        .progress-fill { background: #f59e0b; height: 100%; border-radius: 10px; transition: width 0.3s; }
        .score-display { text-align: center; font-size: 0.85rem; color: #808090; margin-bottom: 1rem; }
        .question-card { background: #1a1a2e; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 2rem; margin-bottom: 1rem; }
        .question-num { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #f59e0b; margin-bottom: 0.8rem; font-weight: 700; }
        .question-text { font-size: 1.05rem; font-weight: 600; color: white; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: grid; gap: 0.6rem; }
        .option { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0.9rem 1.2rem; cursor: pointer; transition: all 0.2s; font-size: 0.92rem; color: #d0d0d8; text-align: left; width: 100%; }
        .option:hover:not(:disabled) { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.4); color: white; }
        .option.correct { background: rgba(16,185,129,0.2); border-color: #10b981; color: #10b981; font-weight: 600; }
        .option.wrong { background: rgba(233,69,96,0.2); border-color: #e94560; color: #e94560; }
        .option:disabled { cursor: default; }
        .explanation { background: rgba(245,158,11,0.08); border-left: 3px solid #f59e0b; padding: 0.8rem 1rem; margin-top: 1rem; border-radius: 0 8px 8px 0; font-size: 0.88rem; color: #fcd34d; display: none; }
        .nav-buttons { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; gap: 1rem; }
        .btn { padding: 0.7rem 1.5rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-next { background: #f59e0b; color: white; margin-left: auto; }
        .btn-next:hover { background: #d97706; }
        .btn-next:disabled { background: rgba(255,255,255,0.1); color: #606070; cursor: default; }
        .btn-back { background: rgba(255,255,255,0.08); color: #d0d0d8; }
        .btn-back:hover { background: rgba(255,255,255,0.15); }
        .result-card { background: #1a1a2e; border-radius: 16px; padding: 3rem 2rem; text-align: center; display: none; }
        .result-score { font-size: 3.5rem; font-weight: 800; color: #f59e0b; margin: 1rem 0; }
        .result-msg { font-size: 1.1rem; color: #d0d0d8; margin-bottom: 2rem; }
        .btn-restart { background: #f59e0b; color: white; padding: 0.8rem 2rem; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; border: none; }
        .btn-restart:hover { background: #d97706; }
        .back-link { display: inline-block; color: #808090; font-size: 0.8rem; text-decoration: none; margin-bottom: 1rem; }
        .back-link:hover { color: #f59e0b; }
    </style>
</head>
<body>
<div class="quiz-container">
    <a href="../../fr/index.html" class="back-link">← Retour a l'accueil</a>
    <div class="quiz-header">
        <div class="matiere">GESTION DES RESSOURCES HUMAINES — QUIZ</div>
        <h1>Cours 4 — L'Evaluation des salaries</h1>
    </div>

    <div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">10</span> — Score : <span id="score">0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:10%"></div></div>

    <div id="quiz-area"></div>
    <div class="result-card" id="result-card">
        <div style="font-size:2rem">🎯</div>
        <div class="result-score"><span id="final-score">0</span>/<span id="final-total">10</span></div>
        <div class="result-msg" id="result-msg"></div>
        <button class="btn-restart" onclick="restartQuiz()">Recommencer</button>
        <br><br>
        <a href="../../fr/index.html" class="back-link">← Retour a l'accueil</a>
    </div>
</div>

<script>
const questions = [
    {
        q: "Quelles sont les trois dimensions sur lesquelles porte l'evaluation d'un salarie ?",
        options: [
            "La motivation, l'assiduite et la ponctualite",
            "La performance, les competences et le potentiel",
            "Le salaire, la formation et la mobilite",
            "L'anciennete, le diplome et l'experience"
        ],
        correct: 1,
        explanation: "L'evaluation porte sur trois dimensions complementaires : la performance (quels resultats ?), les competences (comment y est-il parvenu ?) et le potentiel (que peut-il devenir ?)."
    },
    {
        q: "Vrai ou faux : l'entretien annuel d'evaluation est obligatoire pour toutes les entreprises en France.",
        options: [
            "Vrai, c'est une obligation legale depuis 2014",
            "Faux, il n'est obligatoire que s'il est defini par convention collective ou accord d'entreprise",
            "Vrai, mais uniquement pour les entreprises de plus de 50 salaries",
            "Faux, il est totalement interdit par le Code du travail"
        ],
        correct: 1,
        explanation: "L'entretien annuel d'evaluation n'est pas obligatoire en soi, sauf s'il est prevu par une convention collective ou un accord d'entreprise. Neanmoins, il concerne 60 % de l'ensemble des salaries."
    },
    {
        q: "L'evaluation a 360 degres est principalement destinee a quel public ?",
        options: [
            "Tous les salaries sans distinction",
            "Les stagiaires et apprentis",
            "Les cadres superieurs",
            "Les salaries en periode d'essai"
        ],
        correct: 2,
        explanation: "L'evaluation a 360 degres est surtout utilisee pour les cadres superieurs. Elle est particulierement adaptee aux nouvelles formes d'organisation du travail (structures en reseau ou par projets) et integre les retours de multiples interlocuteurs."
    },
    {
        q: "Pour la Direction, lequel n'est PAS un objectif de l'evaluation ?",
        options: [
            "Accroitre et controler la performance",
            "Clarifier les objectifs pour favoriser l'adhesion",
            "Negocier les accords collectifs avec les syndicats",
            "Developper les competences des collaborateurs"
        ],
        correct: 2,
        explanation: "La negociation des accords collectifs releve des relations sociales, pas de l'evaluation. Pour la Direction, l'evaluation vise a accroitre la performance, maintenir un management de proximite, clarifier les objectifs, developper les competences et objectiver le systeme."
    },
    {
        q: "Selon Grasser et Noel (2022), l'approche competences risque d'etre decredibilisee quand :",
        options: [
            "Les formations decidees lors de l'entretien ne sont pas mises en oeuvre",
            "L'entretien annuel dure plus de deux heures",
            "Le salarie obtient une promotion rapide",
            "Le manager utilise une grille d'evaluation standardisee"
        ],
        correct: 0,
        explanation: "Selon Grasser et Noel (2022), le non-respect des engagements pris lors de l'evaluation decredibilise l'approche competences. Quand les formations decidees ne sont pas mises en oeuvre, les salaries perdent confiance dans le systeme."
    },
    {
        q: "L'entretien annuel d'evaluation a lieu generalement entre le salarie et :",
        options: [
            "La direction generale",
            "Un consultant externe",
            "Son N+1 (superieur hierarchique direct)",
            "Le responsable RH"
        ],
        correct: 2,
        explanation: "L'entretien annuel a lieu entre le salarie et son N+1 (superieur hierarchique direct). Il combine une auto-evaluation par le salarie et une evaluation par le manager. Le N+2 joue un role de supervision du processus."
    },
    {
        q: "Quel pourcentage des salaries travaillant dans des entreprises de plus de 500 salaries sont concernes par l'entretien annuel ?",
        options: [
            "60 %",
            "72 %",
            "86 %",
            "95 %"
        ],
        correct: 2,
        explanation: "86 % des salaries travaillant dans des entreprises de plus de 500 salaries sont concernes par l'entretien annuel d'evaluation. Le taux global pour l'ensemble des salaries est de 60 %."
    },
    {
        q: "Les objectifs fixes lors de l'evaluation doivent respecter la methode SMART. Que signifie le 'A' de SMART ?",
        options: [
            "Annuel",
            "Atteignable",
            "Automatise",
            "Approuve"
        ],
        correct: 1,
        explanation: "SMART signifie : Specifique, Mesurable, Atteignable, Realiste et Temporellement defini. Le 'A' correspond a Atteignable, c'est-a-dire que l'objectif doit etre realisable par le salarie."
    },
    {
        q: "Quelle critique les managers formulent-ils a l'egard de l'evaluation selon Trepo et al. ?",
        options: [
            "L'evaluation prend trop de temps administratif",
            "L'outil complexifie les pratiques manageriales et met en porte-a-faux (etre a la fois juge et coach)",
            "L'evaluation ne concerne pas assez de salaries",
            "Les resultats sont trop positifs pour etre exploitables"
        ],
        correct: 1,
        explanation: "Les managers reprochent a l'evaluation de complexifier leurs pratiques et de les mettre en porte-a-faux vis-a-vis de leurs collaborateurs, car ils doivent etre simultanement juges et coachs."
    },
    {
        q: "Selon le cours, quels sont les deux facteurs ayant renforce le poids de l'evaluation individuelle ?",
        options: [
            "La digitalisation et l'automatisation",
            "Des evolutions economiques (flexibilite, concurrence) et sociales (liberalisme, individualisme)",
            "L'internationalisation et la delocalisation",
            "Le vieillissement de la population et la diversite culturelle"
        ],
        correct: 1,
        explanation: "Le poids de l'evaluation s'est renforce sous l'effet d'evolutions d'ordre economique (exigences de flexibilite, intensification de la concurrence) et d'ordre social (montee du liberalisme et de l'individualisme)."
    }
];

let current = 0, score = 0, answered = false, shuffledQuestions = [];

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
}

function initQuiz() {
    shuffledQuestions = shuffle(questions);
    current = 0; score = 0; answered = false;
    renderQuestion();
}

function renderQuestion() {
    const q = shuffledQuestions[current];
    document.getElementById('current-q').textContent = current + 1;
    document.getElementById('total-q').textContent = shuffledQuestions.length;
    document.getElementById('score').textContent = score;
    document.getElementById('progress').style.width = ((current + 1) / shuffledQuestions.length * 100) + '%';

    const area = document.getElementById('quiz-area');
    area.innerHTML = `
        <div class="question-card">
            <div class="question-num">Question ${current + 1} / ${shuffledQuestions.length}</div>
            <div class="question-text">${q.q}</div>
            <div class="options">
                ${q.options.map((opt, i) => `<button class="option" onclick="answer(${i})" id="opt${i}">${opt}</button>`).join('')}
            </div>
            <div class="explanation" id="explanation">${q.explanation}</div>
        </div>
        <div class="nav-buttons">
            ${current > 0 ? '<button class="btn btn-back" onclick="prev()">← Precedent</button>' : '<div></div>'}
            <button class="btn btn-next" id="btn-next" onclick="next()" disabled>Suivant →</button>
        </div>
    `;
    answered = false;
}

function answer(idx) {
    if (answered) return;
    answered = true;
    const q = shuffledQuestions[current];
    document.querySelectorAll('.option').forEach(b => b.disabled = true);
    if (idx === q.correct) {
        document.getElementById('opt' + idx).classList.add('correct');
        score++;
    } else {
        document.getElementById('opt' + idx).classList.add('wrong');
        document.getElementById('opt' + q.correct).classList.add('correct');
    }
    document.getElementById('explanation').style.display = 'block';
    document.getElementById('btn-next').disabled = false;
    document.getElementById('score').textContent = score;
}

function next() {
    if (current < shuffledQuestions.length - 1) { current++; renderQuestion(); }
    else { showResult(); }
}

function prev() {
    if (current > 0) { current--; renderQuestion(); }
}

function showResult() {
    document.getElementById('quiz-area').style.display = 'none';
    const rc = document.getElementById('result-card');
    rc.style.display = 'block';
    document.getElementById('final-score').textContent = score;
    document.getElementById('final-total').textContent = shuffledQuestions.length;
    const pct = score / shuffledQuestions.length;
    document.getElementById('result-msg').textContent = pct >= 0.8 ? 'Excellent ! Tu maitrises ce chapitre.' : pct >= 0.6 ? 'Bien ! Encore un peu de revision.' : 'Revise la synthese et reessaie !';
}

function restartQuiz() {
    document.getElementById('result-card').style.display = 'none';
    document.getElementById('quiz-area').style.display = 'block';
    initQuiz();
}

initQuiz();
</script>
<script data-goatcounter="https://chaborz.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
