<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz — La Gestion de carrieres</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; padding: 1.5rem; }
        .quiz-header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 1.5rem 2rem; border-radius: 16px; margin-bottom: 1.5rem; border-bottom: 3px solid #f59e0b; }
        .quiz-header .matiere { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #f59e0b; margin-bottom: 0.3rem; }
        .quiz-header h1 { font-size: 1.3rem; font-weight: 700; color: white; }
        .quiz-container { max-width: 800px; margin: 0 auto; }
        .progress-bar { background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; margin-bottom: 1.5rem; }
        .progress-fill { background: #f59e0b; height: 100%; border-radius: 10px; transition: width 0.3s; }
        .score-display { text-align: center; font-size: 0.85rem; color: #808090; margin-bottom: 1rem; }
        .question-card { background: #1a1a2e; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 2rem; margin-bottom: 1rem; }
        .question-num { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #f59e0b; margin-bottom: 0.8rem; font-weight: 700; }
        .question-text { font-size: 1.05rem; font-weight: 600; color: white; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: grid; gap: 0.6rem; }
        .option { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0.9rem 1.2rem; cursor: pointer; transition: all 0.2s; font-size: 0.92rem; color: #d0d0d8; text-align: left; width: 100%; }
        .option:hover:not(:disabled) { background: rgba(245,158,11,0.1); border-color: rgba(245,158,11,0.4); color: white; }
        .option.correct { background: rgba(16,185,129,0.2); border-color: #10b981; color: #10b981; font-weight: 600; }
        .option.wrong { background: rgba(233,69,96,0.2); border-color: #e94560; color: #e94560; }
        .option:disabled { cursor: default; }
        .explanation { background: rgba(245,158,11,0.08); border-left: 3px solid #f59e0b; padding: 0.8rem 1rem; margin-top: 1rem; border-radius: 0 8px 8px 0; font-size: 0.88rem; color: #fcd34d; display: none; }
        .nav-buttons { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; gap: 1rem; }
        .btn { padding: 0.7rem 1.5rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-next { background: #f59e0b; color: white; margin-left: auto; }
        .btn-next:hover { background: #d97706; }
        .btn-next:disabled { background: rgba(255,255,255,0.1); color: #606070; cursor: default; }
        .btn-back { background: rgba(255,255,255,0.08); color: #d0d0d8; }
        .btn-back:hover { background: rgba(255,255,255,0.15); }
        .result-card { background: #1a1a2e; border-radius: 16px; padding: 3rem 2rem; text-align: center; display: none; }
        .result-score { font-size: 3.5rem; font-weight: 800; color: #f59e0b; margin: 1rem 0; }
        .result-msg { font-size: 1.1rem; color: #d0d0d8; margin-bottom: 2rem; }
        .btn-restart { background: #f59e0b; color: white; padding: 0.8rem 2rem; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; border: none; }
        .btn-restart:hover { background: #d97706; }
        .back-link { display: inline-block; color: #808090; font-size: 0.8rem; text-decoration: none; margin-bottom: 1rem; }
        .back-link:hover { color: #f59e0b; }
    </style>
</head>
<body>
<div class="quiz-container">
    <a href="../../fr/index.html" class="back-link">← Retour a l'accueil</a>
    <div class="quiz-header">
        <div class="matiere">GESTION DES RESSOURCES HUMAINES — QUIZ</div>
        <h1>Cours 5 — La Gestion de carrieres</h1>
    </div>

    <div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">10</span> — Score : <span id="score">0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:10%"></div></div>

    <div id="quiz-area"></div>
    <div class="result-card" id="result-card">
        <div style="font-size:2rem">🎯</div>
        <div class="result-score"><span id="final-score">0</span>/<span id="final-total">10</span></div>
        <div class="result-msg" id="result-msg"></div>
        <button class="btn-restart" onclick="restartQuiz()">Recommencer</button>
        <br><br>
        <a href="../../fr/index.html" class="back-link">← Retour a l'accueil</a>
    </div>
</div>

<script>
const questions = [
    {
        q: "Selon Roger (1991), la gestion des carrieres constitue le point de rencontre entre :",
        options: [
            "Les interets des actionnaires et ceux des clients",
            "Les interets de l'organisation et ceux de l'individu",
            "Les interets de la DRH et ceux de la direction generale",
            "Les interets des managers et ceux des syndicats"
        ],
        correct: 1,
        explanation: "Selon Roger (1991), la gestion des carrieres est le point de rencontre entre les interets de l'organisation et ceux de l'individu. C'est une action finalisee pour definir la succession des affectations individuelles du personnel."
    },
    {
        q: "Dans la matrice de Ference (1977), comment appelle-t-on un cadre ayant un potentiel eleve mais une performance faible ?",
        options: [
            "Une etoile",
            "Un pilier",
            "Un espoir",
            "Une branche morte"
        ],
        correct: 2,
        explanation: "Dans la matrice de Ference, un cadre a potentiel eleve et performance faible est un 'espoir' (potentiel a confirmer par la performance). Les 'etoiles' ont potentiel et performance eleves, les 'piliers' une performance elevee mais un potentiel faible, et les 'branches mortes' n'ont ni l'un ni l'autre."
    },
    {
        q: "L'entretien professionnel est obligatoire pour tous les salaries depuis quelle annee, et a quelle frequence ?",
        options: [
            "Depuis 2010, tous les 3 ans",
            "Depuis 2014, tous les 2 ans",
            "Depuis 2018, chaque annee",
            "Depuis 2008, tous les 5 ans"
        ],
        correct: 1,
        explanation: "L'entretien professionnel est obligatoire pour tous les salaries depuis 2014 et a lieu tous les 2 ans. Il porte sur l'evolution professionnelle, le suivi des actions de formation et la reflexion sur l'avenir du salarie."
    },
    {
        q: "Lequel n'est PAS un type de mobilite identifie dans le cours ?",
        options: [
            "La mobilite verticale (changement de niveau hierarchique)",
            "La mobilite horizontale (changement de fonction sans changement hierarchique)",
            "La mobilite salariale (changement de niveau de remuneration)",
            "La mobilite geographique (changement de lieu d'exercice)"
        ],
        correct: 2,
        explanation: "Les trois types de mobilite identifies sont : la mobilite verticale (promotion ou retrogradation), la mobilite horizontale ou fonctionnelle (changement de fonction sans changement hierarchique) et la mobilite geographique (locale, nationale ou internationale). La mobilite salariale n'est pas un concept du cours."
    },
    {
        q: "Selon Condomines (2020), les 'nouvelles carrieres' incluent la carriere proteenne (Hall), la carriere sans frontieres (Arthur) et la carriere nomade (Cadin). Quel est leur point commun ?",
        options: [
            "L'evolution professionnelle se fait exclusivement au sein de la meme entreprise",
            "La carriere est entierement pilotee par l'employeur",
            "L'evolution conduit l'individu d'entreprise en entreprise, au gre des opportunites",
            "La progression est uniquement verticale et hierarchique"
        ],
        correct: 2,
        explanation: "Les nouvelles carrieres partagent l'idee que l'evolution professionnelle conduit l'individu d'entreprise en entreprise, au gre des opportunites. C'est une rupture avec la carriere traditionnelle fondee sur la relation d'emploi a long terme."
    },
    {
        q: "Vrai ou faux : dans la filiere d'expertise, la progression est principalement verticale et hierarchique.",
        options: [
            "Vrai, l'expertise conduit naturellement a des postes de direction",
            "Faux, la filiere d'expertise repose sur une progression horizontale par approfondissement des competences",
            "Vrai, mais uniquement dans les grandes entreprises",
            "Faux, il n'y a aucune progression dans la filiere d'expertise"
        ],
        correct: 1,
        explanation: "La filiere d'expertise est une alternative a la progression hierarchique. Elle permet de developper ses competences, de prendre en charge des projets complexes ou d'acceder a des fonctions de reference d'expertise, sans necessairement monter dans la hierarchie."
    },
    {
        q: "Selon Dany et Livian (2002), quel acteur a pour role de valider les grandes orientations de la politique de gestion des carrieres ?",
        options: [
            "Les specialistes RH",
            "Les managers operationnels",
            "Le salarie lui-meme",
            "La Direction Generale"
        ],
        correct: 3,
        explanation: "Selon Dany et Livian (2002), la Direction Generale valide les grandes orientations de la politique de gestion des carrieres et gere certains cadres directement. La DRH participe a la definition, les specialistes proposent des outils, et les managers evaluent et orientent."
    },
    {
        q: "Parmi les outils suivants, lequel vise a preciser les projets individuels des salaries ?",
        options: [
            "Les organigrammes de remplacement",
            "Le bilan de competences",
            "La revue de personnel",
            "Les repertoires de metiers"
        ],
        correct: 1,
        explanation: "Le bilan de competences fait partie des outils qui permettent de preciser les projets individuels, tout comme la formation a la gestion des carrieres, les conseillers mobilites et les parcours reperes. Les organigrammes de remplacement et repertoires de metiers repondent aux besoins de l'entreprise."
    },
    {
        q: "Le Groupe SEB evalue ses hauts potentiels selon trois criteres cles. Lequel n'en fait PAS partie ?",
        options: [
            "L'esprit entrepreneurial",
            "La capacite d'innovation",
            "L'anciennete dans l'entreprise",
            "Le leadership"
        ],
        correct: 2,
        explanation: "Le Groupe SEB evalue ses hauts potentiels sur trois criteres : l'esprit entrepreneurial, la capacite d'innovation et le leadership. L'anciennete n'en fait pas partie ; l'evaluation se fait sur trois annees de reference (N-2, N-1, N)."
    },
    {
        q: "Selon la conclusion du cours, de quoi depend principalement la qualite d'une politique de gestion des carrieres, au-dela du choix des outils ?",
        options: [
            "Du budget alloue a la formation",
            "Du nombre de postes disponibles dans l'organisation",
            "De la qualite de la circulation de l'information dans l'organisation",
            "De la taille du departement RH"
        ],
        correct: 2,
        explanation: "La qualite d'une politique de gestion des carrieres depend non seulement du choix de bons outils, mais surtout de la qualite de la circulation de l'information dans l'organisation. Sans communication fluide et transparente sur les opportunites et criteres d'evolution, les dispositifs resteront inefficaces."
    }
];

let current = 0, score = 0, answered = false, shuffledQuestions = [];

function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
}

function initQuiz() {
    shuffledQuestions = shuffle(questions);
    current = 0; score = 0; answered = false;
    renderQuestion();
}

function renderQuestion() {
    const q = shuffledQuestions[current];
    document.getElementById('current-q').textContent = current + 1;
    document.getElementById('total-q').textContent = shuffledQuestions.length;
    document.getElementById('score').textContent = score;
    document.getElementById('progress').style.width = ((current + 1) / shuffledQuestions.length * 100) + '%';

    const area = document.getElementById('quiz-area');
    area.innerHTML = `
        <div class="question-card">
            <div class="question-num">Question ${current + 1} / ${shuffledQuestions.length}</div>
            <div class="question-text">${q.q}</div>
            <div class="options">
                ${q.options.map((opt, i) => `<button class="option" onclick="answer(${i})" id="opt${i}">${opt}</button>`).join('')}
            </div>
            <div class="explanation" id="explanation">${q.explanation}</div>
        </div>
        <div class="nav-buttons">
            ${current > 0 ? '<button class="btn btn-back" onclick="prev()">← Precedent</button>' : '<div></div>'}
            <button class="btn btn-next" id="btn-next" onclick="next()" disabled>Suivant →</button>
        </div>
    `;
    answered = false;
}

function answer(idx) {
    if (answered) return;
    answered = true;
    const q = shuffledQuestions[current];
    document.querySelectorAll('.option').forEach(b => b.disabled = true);
    if (idx === q.correct) {
        document.getElementById('opt' + idx).classList.add('correct');
        score++;
    } else {
        document.getElementById('opt' + idx).classList.add('wrong');
        document.getElementById('opt' + q.correct).classList.add('correct');
    }
    document.getElementById('explanation').style.display = 'block';
    document.getElementById('btn-next').disabled = false;
    document.getElementById('score').textContent = score;
}

function next() {
    if (current < shuffledQuestions.length - 1) { current++; renderQuestion(); }
    else { showResult(); }
}

function prev() {
    if (current > 0) { current--; renderQuestion(); }
}

function showResult() {
    document.getElementById('quiz-area').style.display = 'none';
    const rc = document.getElementById('result-card');
    rc.style.display = 'block';
    document.getElementById('final-score').textContent = score;
    document.getElementById('final-total').textContent = shuffledQuestions.length;
    const pct = score / shuffledQuestions.length;
    document.getElementById('result-msg').textContent = pct >= 0.8 ? 'Excellent ! Tu maitrises ce chapitre.' : pct >= 0.6 ? 'Bien ! Encore un peu de revision.' : 'Revise la synthese et reessaie !';
}

function restartQuiz() {
    document.getElementById('result-card').style.display = 'none';
    document.getElementById('quiz-area').style.display = 'block';
    initQuiz();
}

initQuiz();
</script>
<script data-goatcounter="https://chaborz.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
