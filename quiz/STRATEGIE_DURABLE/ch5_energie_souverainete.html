<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz — Strategie Durable Ch5: Energie, souverainete & regulation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; padding: 1.5rem; }
        .quiz-header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 1.5rem 2rem; border-radius: 16px; margin-bottom: 1.5rem; border-bottom: 3px solid #27ae60; }
        .quiz-header .matiere { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #27ae60; margin-bottom: 0.3rem; }
        .quiz-header h1 { font-size: 1.3rem; font-weight: 700; color: white; }
        .quiz-container { max-width: 800px; margin: 0 auto; }
        .progress-bar { background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; margin-bottom: 1.5rem; }
        .progress-fill { background: #27ae60; height: 100%; border-radius: 10px; transition: width 0.3s; }
        .score-display { text-align: center; font-size: 0.85rem; color: #808090; margin-bottom: 1rem; }
        .timer { text-align: center; font-size: 0.85rem; color: #f59e0b; margin-bottom: 0.5rem; font-weight: 600; }
        .question-card { background: #1a1a2e; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 2rem; margin-bottom: 1rem; }
        .question-num { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #27ae60; margin-bottom: 0.8rem; font-weight: 700; }
        .question-text { font-size: 1.05rem; font-weight: 600; color: white; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: grid; gap: 0.6rem; }
        .option { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0.9rem 1.2rem; cursor: pointer; transition: all 0.2s; font-size: 0.92rem; color: #d0d0d8; text-align: left; width: 100%; }
        .option:hover:not(:disabled) { background: rgba(39,174,96,0.1); border-color: rgba(39,174,96,0.4); color: white; }
        .option.correct { background: rgba(39,174,96,0.2); border-color: #27ae60; color: #6ee7b7; font-weight: 600; }
        .option.wrong { background: rgba(239,68,68,0.2); border-color: #ef4444; color: #ef4444; }
        .option:disabled { cursor: default; }
        .explanation { background: rgba(39,174,96,0.08); border-left: 3px solid #27ae60; padding: 0.8rem 1rem; margin-top: 1rem; border-radius: 0 8px 8px 0; font-size: 0.88rem; color: #6ee7b7; display: none; }
        .nav-buttons { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; gap: 1rem; }
        .btn { padding: 0.7rem 1.5rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-next { background: #27ae60; color: white; margin-left: auto; }
        .btn-next:hover { background: #1e8449; }
        .btn-next:disabled { background: rgba(255,255,255,0.1); color: #606070; cursor: default; }
        .result-card { background: #1a1a2e; border-radius: 16px; padding: 3rem 2rem; text-align: center; display: none; }
        .result-score { font-size: 3.5rem; font-weight: 800; color: #27ae60; margin: 1rem 0; }
        .result-msg { font-size: 1.1rem; color: #d0d0d8; margin-bottom: 2rem; }
        .result-time { font-size: 0.9rem; color: #f59e0b; margin-bottom: 1.5rem; }
        .btn-restart { background: #27ae60; color: white; padding: 0.8rem 2rem; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; border: none; }
        .back-link { display: inline-block; color: #808090; font-size: 0.8rem; text-decoration: none; margin-bottom: 1rem; }
        .back-link:hover { color: #27ae60; }
    </style>
</head>
<body>
<div class="quiz-container">
    <a href="../../fr/index.html" class="back-link">&larr; Retour a l'accueil</a>
    <div class="quiz-header">
        <div class="matiere">Strategie & Developpement Durable &mdash; QUIZ</div>
        <h1>Chapitre 5 &mdash; Energie, souverainete & regulation</h1>
    </div>
    <div class="timer" id="timer">&#9201; 00:00</div>
    <div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">10</span> &mdash; Score: <span id="score">0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width:10%"></div></div>
    <div id="quiz-area"></div>
    <div class="result-card" id="result-card">
        <div style="font-size:2rem">&#127919;</div>
        <div class="result-score"><span id="final-score">0</span>/10</div>
        <div class="result-time" id="result-time"></div>
        <div class="result-msg" id="result-msg"></div>
        <button class="btn-restart" onclick="restartQuiz()">Recommencer</button>
        <br><br>
        <a href="../../fr/index.html" class="back-link">&larr; Retour a l'accueil</a>
    </div>
</div>
<script>
const questions = [
    {q:"Quelle proportion de l'energie primaire mondiale est gaspillee (perdue sous forme de chaleur, friction, etc.) ?",options:["Environ 10 %","Environ 25 %","Environ 70 %","Environ 42 %"],correct:3,explanation:"Environ 42 % de l'energie primaire mondiale est gaspillee, principalement sous forme de chaleur perdue dans les moteurs thermiques et centrales. C'est un gisement majeur d'efficacite energetique."},
    {q:"Qu'est-ce que la 'double contrainte carbone' ?",options:["Reduire les emissions tout en maintenant la croissance economique","Payer a la fois la taxe carbone et le cout des renouvelables","La necessite de reduire les emissions de CO2 ET la dependance aux fossiles (ressources finies)","La double taxation des entreprises polluantes"],correct:2,explanation:"La double contrainte carbone designe le fait que les fossiles posent a la fois un probleme climatique (emissions de GES) et un probleme de souverainete (dependance a des ressources finies importees). Les deux contraintes poussent vers la decarbonation."},
    {q:"Quand la France sera-t-elle veritablement souveraine sur le plan energetique ?",options:["Quand elle aura atteint 100 % de nucleaire","Quand le prix du petrole sera stable","Quand elle sera carbon neutre (plus de dependance aux fossiles importes)","Quand elle aura signe suffisamment d'accords commerciaux"],correct:2,explanation:"La France ne sera souveraine que lorsqu'elle sera carbon neutre, car sa dependance aux fossiles importes la rend vulnerable aux chocs geopolitiques et aux fluctuations de prix."},
    {q:"Qu'est-ce que le mecanisme CBAM (Carbon Border Adjustment Mechanism) ?",options:["Une taxe sur les emissions des avions aux frontieres europeennes","Un fonds europeen de financement de la transition","Un mecanisme d'ajustement carbone aux frontieres taxant les importations selon leur contenu carbone","Un label carbone obligatoire pour les produits importes"],correct:2,explanation:"Le CBAM taxe les produits importes en fonction de leur contenu carbone, afin d'eviter les fuites de carbone (delocalisation vers des pays sans prix du carbone). C'est aussi la 'retorsion credible' du tit-for-tat climatique."},
    {q:"Qu'est-ce que la directive CSRD ?",options:["Une norme technique pour les panneaux solaires","Une reglementation sur les vehicules electriques","Un mecanisme de compensation carbone","Une directive europeenne imposant un reporting de durabilite aux entreprises"],correct:3,explanation:"La CSRD impose aux entreprises un reporting detaille sur leur impact ESG (environnement, social, gouvernance) selon les normes ESRS. Le principe de double materialite s'applique : impact de l'environnement sur l'entreprise ET impact de l'entreprise sur l'environnement."},
    {q:"Dans la theorie des jeux appliquee au climat, qu'illustre le 'dilemme du prisonnier' ?",options:["La difficulte de financer la recherche climatique","Le conflit entre generations sur la politique climatique","Le risque que chaque pays attende que les autres agissent, menant a l'inaction collective","La competition entre entreprises vertes"],correct:2,explanation:"Le dilemme du prisonnier illustre le probleme du passager clandestin (free rider) : chaque pays est tente de ne pas agir pendant que les autres reduisent leurs emissions. La strategie 'tit-for-tat' et les COP favorisent la cooperation."},
    {q:"Quel changement de dependance la transition energetique entraine-t-elle ?",options:["D'une dependance aux fossiles vers une dependance aux metaux critiques","D'une dependance energetique vers une independance totale","D'une dependance technique vers une dependance financiere","D'une dependance aux USA vers une dependance a la Chine"],correct:0,explanation:"La transition fait passer d'une dependance aux fossiles (petrole, gaz) vers une dependance aux metaux critiques (lithium, cobalt, cuivre, terres rares). Mais cette nouvelle dependance est fondamentalement differente : les metaux sont recyclables, pas le petrole brule."},
    {q:"Historiquement, le lien entre energie et PIB est :",options:["Inversement proportionnel : moins d'energie = plus de PIB","Inexistant : il n'y a aucune correlation","Lineaire : plus de PIB = plus de consommation d'energie","Exponentiel : le PIB croit beaucoup plus vite que l'energie"],correct:2,explanation:"Historiquement, le lien energie-PIB est lineaire : la croissance s'est toujours accompagnee d'une hausse de la consommation d'energie. Le defi est de decoupler ces deux grandeurs grace a l'efficacite et la sobriete."},
    {q:"Quel est le rendement d'un moteur electrique compare a un moteur thermique ?",options:["Electrique ~25 % vs thermique ~90 %","Electrique ~50 % vs thermique ~50 %","Electrique ~90-95 % vs thermique ~25-30 %","Electrique ~60 % vs thermique ~40 %"],correct:2,explanation:"Un moteur electrique a un rendement de 90-95 % contre 25-30 % pour un moteur thermique. Cette difference explique pourquoi l'electrification reduit mecaniquement la demande d'energie primaire."},
    {q:"Quelle strategie de la theorie des jeux favorise la cooperation climatique internationale ?",options:["La strategie du cavalier seul (free riding)","La strategie de defection systematique","La strategie du bluff","La strategie 'tit-for-tat' (donnant-donnant) : cooperer puis reciprocite"],correct:3,explanation:"Le 'tit-for-tat' consiste a cooperer d'abord, puis a imiter le comportement de l'autre. Si l'autre coopere, on coopere. Si l'autre triche, on retorque. Les COP et le CBAM sont des outils de cette logique."}
];
let current=0,score=0,answered=false,startTime=Date.now(),timerInterval;
function startTimer(){timerInterval=setInterval(()=>{const e=Math.floor((Date.now()-startTime)/1000);const m=String(Math.floor(e/60)).padStart(2,'0');const s=String(e%60).padStart(2,'0');document.getElementById('timer').textContent='\u23F1 '+m+':'+s;},1000);}
function shuffleOptions(q){const idx=q.options.map((_,i)=>i);for(let i=idx.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}return{...q,options:idx.map(i=>q.options[i]),correct:idx.indexOf(q.correct)};}
function renderQ(){const q=shuffleOptions(questions[current]);questions[current]._s=q;document.getElementById('current-q').textContent=current+1;document.getElementById('total-q').textContent=questions.length;document.getElementById('score').textContent=score;document.getElementById('progress').style.width=((current+1)/questions.length*100)+'%';const letters=['A','B','C','D'];document.getElementById('quiz-area').innerHTML='<div class="question-card"><div class="question-num">Question '+(current+1)+' / '+questions.length+'</div><div class="question-text">'+q.q+'</div><div class="options">'+q.options.map((o,i)=>'<button class="option" onclick="sel('+i+')" id="opt'+i+'">'+letters[i]+'. '+o+'</button>').join('')+'</div><div class="explanation" id="explanation">'+q.explanation+'</div></div><div class="nav-buttons"><div></div><button class="btn btn-next" id="btn-next" onclick="nextQ()" disabled>Suivant &rarr;</button></div>';answered=false;}
function sel(i){if(answered)return;answered=true;const q=questions[current]._s;document.querySelectorAll('.option').forEach(b=>b.disabled=true);if(i===q.correct){document.getElementById('opt'+i).classList.add('correct');score++;}else{document.getElementById('opt'+i).classList.add('wrong');document.getElementById('opt'+q.correct).classList.add('correct');}document.getElementById('explanation').style.display='block';document.getElementById('btn-next').disabled=false;document.getElementById('score').textContent=score;}
function nextQ(){if(current<questions.length-1){current++;renderQ();}else{showResult();}}
function showResult(){clearInterval(timerInterval);const e=Math.floor((Date.now()-startTime)/1000);const m=Math.floor(e/60);const s=e%60;document.getElementById('quiz-area').innerHTML='';const rc=document.getElementById('result-card');rc.style.display='block';document.getElementById('final-score').textContent=score;document.getElementById('result-time').textContent='\u23F1 Temps: '+m+'min '+s+'s';const p=score/questions.length;document.getElementById('result-msg').textContent=p>=0.9?'Exceptionnel ! Tu maitrises parfaitement ce chapitre.':p>=0.7?'Bien joue ! Encore un peu de revision et ce sera parfait.':p>=0.5?'Pas mal, mais relis la synthese pour consolider.':'Continue a reviser, relis la synthese et reessaie.';}
function restartQuiz(){current=0;score=0;answered=false;startTime=Date.now();document.getElementById('result-card').style.display='none';startTimer();renderQ();}
startTimer();renderQ();
</script>
<script data-goatcounter="https://chaborz.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
