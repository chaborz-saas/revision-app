<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz — Ch.5 — &Eacute;nergie, souverainet&eacute; &amp; r&eacute;gulation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; padding: 1.5rem; }
        .quiz-header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 1.5rem 2rem; border-radius: 16px; margin-bottom: 1.5rem; border-bottom: 3px solid #27ae60; }
        .quiz-header .matiere { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px; color: #27ae60; margin-bottom: 0.3rem; }
        .quiz-header h1 { font-size: 1.3rem; font-weight: 700; color: white; }
        .quiz-container { max-width: 800px; margin: 0 auto; }
        .progress-bar { background: rgba(255,255,255,0.1); border-radius: 10px; height: 6px; margin-bottom: 1.5rem; }
        .progress-fill { background: #27ae60; height: 100%; border-radius: 10px; transition: width 0.3s; }
        .score-display { text-align: center; font-size: 0.85rem; color: #808090; margin-bottom: 1rem; }
        .question-card { background: #1a1a2e; border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 2rem; margin-bottom: 1rem; }
        .question-num { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; color: #27ae60; margin-bottom: 0.8rem; font-weight: 700; }
        .question-text { font-size: 1.05rem; font-weight: 600; color: white; margin-bottom: 1.5rem; line-height: 1.5; }
        .options { display: grid; gap: 0.6rem; }
        .option { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0.9rem 1.2rem; cursor: pointer; transition: all 0.2s; font-size: 0.92rem; color: #d0d0d8; text-align: left; width: 100%; }
        .option:hover:not(:disabled) { background: rgba(39,174,96,0.1); border-color: rgba(39,174,96,0.4); color: white; }
        .option.correct { background: rgba(16,185,129,0.2); border-color: #10b981; color: #10b981; font-weight: 600; }
        .option.wrong { background: rgba(233,69,96,0.2); border-color: #e94560; color: #e94560; }
        .option:disabled { cursor: default; }
        .explanation { background: rgba(39,174,96,0.08); border-left: 3px solid #27ae60; padding: 0.8rem 1rem; margin-top: 1rem; border-radius: 0 8px 8px 0; font-size: 0.88rem; color: #82e0aa; display: none; }
        .nav-buttons { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; gap: 1rem; }
        .btn { padding: 0.7rem 1.5rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
        .btn-next { background: #27ae60; color: white; margin-left: auto; }
        .btn-next:hover { background: #1e8449; }
        .btn-next:disabled { background: rgba(255,255,255,0.1); color: #606070; cursor: default; }
        .btn-back { background: rgba(255,255,255,0.08); color: #d0d0d8; }
        .btn-back:hover { background: rgba(255,255,255,0.15); }
        .result-card { background: #1a1a2e; border-radius: 16px; padding: 3rem 2rem; text-align: center; display: none; }
        .result-score { font-size: 3.5rem; font-weight: 800; color: #27ae60; margin: 1rem 0; }
        .result-msg { font-size: 1.1rem; color: #d0d0d8; margin-bottom: 2rem; }
        .btn-restart { background: #27ae60; color: white; padding: 0.8rem 2rem; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; border: none; }
        .back-link { display: inline-block; color: #808090; font-size: 0.8rem; text-decoration: none; margin-bottom: 1rem; }
        .back-link:hover { color: #27ae60; }
    </style>
</head>
<body>
<div class="quiz-container">
    <a href="../../index.html" class="back-link">&larr; Retour &agrave; l'accueil</a>
    <div class="quiz-header">
        <div class="matiere">STRAT&Eacute;GIE DURABLE &amp; &Eacute;THIQUE &mdash; QUIZ</div>
        <h1>Ch.5 &mdash; &Eacute;nergie, souverainet&eacute; &amp; r&eacute;gulation</h1>
    </div>
    <div class="score-display">Question <span id="current-q">1</span> / <span id="total-q">8</span> &mdash; Score : <span id="score">0</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progress" style="width: 12.5%"></div></div>
    <div id="quiz-area"></div>
    <div class="result-card" id="result-card">
        <div style="font-size:3rem;">&#127793;</div>
        <div class="result-score" id="final-score"></div>
        <div class="result-msg" id="result-msg"></div>
        <button class="btn-restart" onclick="restart()">Recommencer</button>
    </div>
</div>
<script>
const questions = [
  {q:"Quelle proportion de l'&eacute;nergie primaire mondiale est gaspill&eacute;e (perdue sous forme de chaleur, friction, etc.) ?", o:["Environ 10 %","Environ 25 %","Environ 42 %","Environ 70 %"], a:2, e:"Environ 42 % de l'&eacute;nergie primaire mondiale est gaspill&eacute;e, principalement sous forme de chaleur perdue dans les moteurs thermiques, les centrales &eacute;lectriques et les proc&eacute;d&eacute;s industriels. C'est un gisement majeur d'efficacit&eacute; &eacute;nerg&eacute;tique."},
  {q:"Qu'est-ce que la &laquo; double contrainte carbone &raquo; ?", o:["R&eacute;duire les &eacute;missions tout en maintenant la croissance &eacute;conomique","La n&eacute;cessit&eacute; de r&eacute;duire &agrave; la fois les &eacute;missions de CO2 ET la d&eacute;pendance aux &eacute;nergies fossiles (risque d'approvisionnement)","Payer &agrave; la fois la taxe carbone et le co&ucirc;t des &eacute;nergies renouvelables","La double taxation des entreprises polluantes"], a:1, e:"La double contrainte carbone d&eacute;signe le fait que les &eacute;nergies fossiles posent &agrave; la fois un probl&egrave;me climatique (&eacute;missions de GES) ET un probl&egrave;me de souverainet&eacute; (d&eacute;pendance &agrave; des ressources finies import&eacute;es). Les deux contraintes poussent dans la m&ecirc;me direction : la d&eacute;carbonation."},
  {q:"Selon le cours, quand la France sera-t-elle v&eacute;ritablement souveraine sur le plan &eacute;nerg&eacute;tique ?", o:["Quand elle aura atteint 100 % de nucl&eacute;aire","Quand elle sera carbon neutre (plus de d&eacute;pendance aux fossiles import&eacute;s)","Quand elle aura sign&eacute; suffisamment d'accords commerciaux","Quand le prix du p&eacute;trole sera stable"], a:1, e:"La France ne sera v&eacute;ritablement souveraine que lorsqu'elle sera carbon neutre, car sa d&eacute;pendance aux &eacute;nergies fossiles import&eacute;es (p&eacute;trole, gaz) la rend vuln&eacute;rable aux chocs g&eacute;opolitiques et aux fluctuations de prix."},
  {q:"Qu'est-ce que le m&eacute;canisme CBAM (Carbon Border Adjustment Mechanism) ?", o:["Une taxe sur les &eacute;missions des avions aux fronti&egrave;res europ&eacute;ennes","Un m&eacute;canisme d'ajustement carbone aux fronti&egrave;res taxant les importations selon leur contenu carbone","Un fonds europ&eacute;en de financement de la transition","Un label carbone obligatoire pour les produits import&eacute;s"], a:1, e:"Le CBAM est le m&eacute;canisme europ&eacute;en d'ajustement carbone aux fronti&egrave;res. Il taxe les produits import&eacute;s en fonction de leur contenu en carbone, afin d'&eacute;viter les fuites de carbone (d&eacute;localisation de la production vers des pays moins r&eacute;glementants)."},
  {q:"Qu'est-ce que la directive CSRD ?", o:["Une norme technique pour les panneaux solaires","Une directive europ&eacute;enne imposant un reporting de durabilit&eacute; aux entreprises","Un m&eacute;canisme de compensation carbone","Une r&eacute;glementation sur les v&eacute;hicules &eacute;lectriques"], a:1, e:"La CSRD (Corporate Sustainability Reporting Directive) est une directive europ&eacute;enne qui impose aux entreprises de publier un rapport d&eacute;taill&eacute; sur leur impact environnemental, social et de gouvernance (ESG), selon des normes standardis&eacute;es."},
  {q:"Dans la th&eacute;orie des jeux appliqu&eacute;e au climat, qu'est-ce que le &laquo; dilemme du prisonnier &raquo; illustre ?", o:["La difficult&eacute; de financer la recherche climatique","Le risque que chaque pays attende que les autres agissent, menant &agrave; l'inaction collective","La comp&eacute;tition entre entreprises vertes","Le conflit entre g&eacute;n&eacute;rations sur la politique climatique"], a:1, e:"Le dilemme du prisonnier illustre pourquoi la coop&eacute;ration climatique est difficile : chaque pays a individuellement int&eacute;r&ecirc;t &agrave; ne pas agir (free-riding) pendant que les autres r&eacute;duisent leurs &eacute;missions. La strat&eacute;gie &laquo; tit-for-tat &raquo; (coop&eacute;rer puis r&eacute;ciprocit&eacute;) est une solution possible."},
  {q:"Quel changement de d&eacute;pendance la transition &eacute;nerg&eacute;tique entra&icirc;ne-t-elle ?", o:["D'une d&eacute;pendance aux fossiles vers une d&eacute;pendance aux m&eacute;taux critiques","D'une d&eacute;pendance &eacute;nerg&eacute;tique vers une ind&eacute;pendance totale","D'une d&eacute;pendance aux &Eacute;tats-Unis vers une d&eacute;pendance &agrave; la Chine","D'une d&eacute;pendance technique vers une d&eacute;pendance financi&egrave;re"], a:0, e:"La transition &eacute;nerg&eacute;tique fait passer d'une d&eacute;pendance aux &eacute;nergies fossiles (p&eacute;trole, gaz) vers une d&eacute;pendance aux m&eacute;taux critiques (lithium, cobalt, cuivre, terres rares) n&eacute;cessaires aux technologies bas-carbone. Cela pose de nouveaux enjeux de souverainet&eacute;."},
  {q:"Historiquement, le lien entre &eacute;nergie et PIB est :", o:["Inversement proportionnel : moins d'&eacute;nergie = plus de PIB","Lin&eacute;aire : plus de PIB = plus de consommation d'&eacute;nergie","Inexistant : il n'y a aucune corr&eacute;lation","Exponentiel : le PIB cro&icirc;t beaucoup plus vite que l'&eacute;nergie"], a:1, e:"Historiquement, le lien &eacute;nergie-PIB est lin&eacute;aire : la croissance &eacute;conomique s'est toujours accompagn&eacute;e d'une hausse de la consommation d'&eacute;nergie. Le d&eacute;fi de la transition est de d&eacute;coupler ces deux grandeurs gr&acirc;ce &agrave; l'efficacit&eacute; &eacute;nerg&eacute;tique et la sobri&eacute;t&eacute;."}
];
let current=0, score=0, answered=[];
function render(){
    const quest=questions[current];
    document.getElementById('current-q').textContent=current+1;
    document.getElementById('score').textContent=score;
    document.getElementById('progress').style.width=((current+1)/questions.length*100)+'%';
    let html='<div class="question-card"><div class="question-num">Question '+(current+1)+' / '+questions.length+'</div><div class="question-text">'+quest.q+'</div><div class="options">';
    quest.o.forEach((opt,i)=>{
        const disabled=answered[current]!==undefined?'disabled':'';
        let cls='option';
        if(answered[current]!==undefined){if(i===quest.a)cls+=' correct';else if(i===answered[current])cls+=' wrong';}
        html+='<button class="'+cls+'" onclick="answer('+i+')" '+disabled+'>'+opt+'</button>';
    });
    html+='</div><div class="explanation" id="expl"'+(answered[current]!==undefined?' style="display:block"':'')+'>'+quest.e+'</div></div>';
    html+='<div class="nav-buttons">';
    if(current>0)html+='<button class="btn btn-back" onclick="prev()">&larr; Pr&eacute;c&eacute;dent</button>';
    if(answered[current]!==undefined&&current<questions.length-1)html+='<button class="btn btn-next" onclick="next()">Suivant &rarr;</button>';
    if(answered[current]!==undefined&&current===questions.length-1)html+='<button class="btn btn-next" onclick="showResult()">Voir le r&eacute;sultat &rarr;</button>';
    html+='</div>';
    document.getElementById('quiz-area').innerHTML=html;
}
function answer(i){if(answered[current]!==undefined)return;answered[current]=i;if(i===questions[current].a)score++;render();}
function next(){current++;render();}
function prev(){current--;render();}
function showResult(){
    document.getElementById('quiz-area').style.display='none';
    document.getElementById('result-card').style.display='block';
    const pct=Math.round(score/questions.length*100);
    document.getElementById('final-score').textContent=score+'/'+questions.length;
    document.getElementById('result-msg').textContent=pct>=75?'Excellent ! Tu ma\u00eetrises le sujet \uD83D\uDD25':pct>=50?'Pas mal ! Relis les points faibles \uD83D\uDCAA':'Continue \u00e0 r\u00e9viser, tu vas y arriver \uD83D\uDCDA';
}
function restart(){current=0;score=0;answered=[];document.getElementById('quiz-area').style.display='block';document.getElementById('result-card').style.display='none';render();}
render();
</script>
<script data-goatcounter="https://chaborz.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
